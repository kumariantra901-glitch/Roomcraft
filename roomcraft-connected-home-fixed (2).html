function toggleMeasure(){
  if(!requireThree('Measuring')) return;
  Editor.measureMode = !Editor.measureMode;
  Editor.measurePoints = [];
  if(Editor.measureLine){ Editor.scene.remove(Editor.measureLine); Editor.measureLine=null; }
  $('#measure-toggle').classList.toggle('on', Editor.measureMode);
  toast(Editor.measureMode ? 'Measure mode — click two points on the floor' : 'Measure mode off');
}
function handleMeasureClick(e){
  const holder = $('#three-canvas-holder'); const rect = holder.getBoundingClientRect();
  Editor.mouse.x = ((e.clientX-rect.left)/rect.width)*2-1;
  Editor.mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
  Editor.raycaster.setFromCamera(Editor.mouse, Editor.camera);
  const plane = new THREE.Plane(new THREE.Vector3(0,1,0),0);
  const pt = new THREE.Vector3();
  Editor.raycaster.ray.intersectPlane(plane, pt);
  if(!pt) return;
  Editor.measurePoints.push(pt.clone());
  if(Editor.measurePoints.length===2){
    const [a,b] = Editor.measurePoints;
    const dist = a.distanceTo(b);
    if(Editor.measureLine) Editor.scene.remove(Editor.measureLine);
    const geo = new THREE.BufferGeometry().setFromPoints([a,b]);
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({color:0xF0783C, linewidth:2}));
    Editor.scene.add(line); Editor.measureLine = line;
    toast('Distance: '+fmtLen(dist, Editor.room && Editor.room.unit), 'success', 4000);
    Editor.measurePoints = [];
  }
}

/* ---------------------------- 2D FLOOR PLAN ---------------------------- */
// Base fit-to-viewport scale, before the user's manual zoom is applied. Recomputed every
// draw so it always tracks the current layout size and canvas size (dimension edits,
// window resizes, sidebar collapse, adding/removing rooms, etc. all "just work" without
// special-casing). Fits the WHOLE multi-room layout, not just the active room, since the
// 2D plan shows every room at once.
function plan2dBaseScale(canvas, bounds){
  const pad = 76;
  const w = Math.max(0.5, bounds.width), d = Math.max(0.5, bounds.depth);
  return Math.max(4, Math.min((canvas.width-pad*2)/w, (canvas.height-pad*2)/d));
}
function plan2dZoomBy(factor){
  Editor.plan2d.zoom = clamp(Editor.plan2d.zoom*factor, 0.25, 8);
  draw2DPlan();
}
function plan2dResetView(){
  Editor.plan2d.zoom = 1; Editor.plan2d.panX = 0; Editor.plan2d.panY = 0;
  draw2DPlan();
}
// Builds the 2D Plan's floor selector <select> once (its <option>s are (re)populated by
// updateFloorSelectorUI() as the project's floors change). Picking a floor filters the
// 2D plan down to just the rooms on it — like flipping between sheets in a real
// architectural floor-plan set — with an "All Floors" option to see everything overlaid.
function buildFloorSelector(){
  const sel = el('select',{id:'floor-selector', class:'floor-selector', title:'Show a specific floor, or every floor at once'});
  sel.addEventListener('change',()=>{
    Editor.plan2d.planFloor = sel.value==='all' ? 'all' : parseInt(sel.value,10);
    Editor.plan2d.zoom=1; Editor.plan2d.panX=0; Editor.plan2d.panY=0; // fresh floor = fresh fit-to-screen
    draw2DPlan();
    updateRoomFloatingToolbar();
  });
  return sel;
}
// Refreshes the floor selector's option list from whatever floors actually have rooms on
// them right now (always including Ground Floor even if empty, so a brand-new project
// still has something to show), and syncs its selected value to Editor.plan2d.planFloor.
// Called whenever rooms are added/removed/moved between floors, or a room/floor changes.
function updateFloorSelectorUI(){
  const sel = $('#floor-selector'); if(!sel || !Editor.project) return;
  const floors = new Set([0]);
  (Editor.project.roomOrder||[]).forEach(rid=>{
    const r = Editor.project.rooms[rid]; if(r) floors.add(Number.isFinite(r.floor)?r.floor:0);
  });
  const sorted = Array.from(floors).sort((a,b)=>b-a); // top floor first, ground floor in the middle, basements last — reads like a real building section
  const prevValue = sel.value;
  sel.innerHTML='';
  sorted.forEach(f=> sel.appendChild(el('option',{value:String(f)}, floorLabel(f))));
  sel.appendChild(el('option',{value:'all'}, 'All Floors'));
  const wanted = Editor.plan2d.planFloor==='all' ? 'all' : String(Editor.plan2d.planFloor);
  sel.value = wanted;
  if(sel.value!==wanted){ // the previously-selected floor no longer has any rooms (e.g. its last room moved away) — fall back to Ground Floor rather than silently landing on whatever the browser defaults a <select> to
    Editor.plan2d.planFloor = 0; sel.value = '0';
  }
}
// Converts a mouse event's screen position into the 2D plan's world coordinates, using
// the pan/zoom transform draw2DPlan() stashed on its last run. Used for hit-testing
// which room (if any) the user is clicking/dragging.
function plan2dScreenToWorld(clientX, clientY){
  const canvas = $('#plan2d-canvas'); if(!canvas) return {x:0,z:0};
  const rect = canvas.getBoundingClientRect();
  const scale = Editor.plan2d.screenScale || 40;
  const ox = Editor.plan2d.screenOx||0, oz = Editor.plan2d.screenOz||0;
  return { x: (clientX-rect.left-ox)/scale, z: (clientY-rect.top-oz)/scale };
}
// Which room (if any) contains a given world-space point, topmost-drawn first. Used both
// to pick a room to drag and to select a room on a plain click in the 2D plan.
function plan2dHitTestRoom(wx, wz){
  if(!Editor.project) return null;
  const planFloor = Editor.plan2d.planFloor;
  const order = Editor.project.roomOrder;
  for(let i=order.length-1;i>=0;i--){
    const r = Editor.project.rooms[order[i]]; if(!r) continue;
    // only hit-test rooms that are actually visible on the plan right now — a room on a
    // different floor can share the exact same X/Z footprint (that's the whole point of
    // stacking), so without this a click meant for the visible room could instead grab
    // an invisible one sitting on another floor at the same spot.
    if(planFloor!=='all' && (Number.isFinite(r.floor)?r.floor:0)!==planFloor) continue;
    const ox=r.worldX||0, oz=r.worldZ||0;
    if(wx>=ox-r.width/2 && wx<=ox+r.width/2 && wz>=oz-r.length/2 && wz<=oz+r.length/2) return r;
  }
  return null;
}
// Snaps a room being dragged to touch or align with any OTHER room's edges/centers once
// it comes within a small threshold — this is what makes "drag Bedroom next to Living
// Room" click cleanly into a shared, gap-free, non-overlapping wall instead of requiring
// pixel-perfect placement. X and Z snap independently, so a room can snap its edge to
// touch one neighbor while its center-line stays aligned with another. Returns the
// (possibly adjusted) position plus which axes snapped, so the caller can draw a guide.
function plan2dSnapRoomPosition(room, px, pz){
  const SNAP = 0.35;
  let bestX=null, bestZ=null;
  const w=room.width, d=room.length;
  const roomFloor = Number.isFinite(room.floor) ? room.floor : 0;
  Object.values(Editor.project.rooms).forEach(other=>{
    if(!other || other.id===room.id || other.worldX==null) return;
    // never snap to a room on a different floor — they're vertically separated and
    // sharing an X/Z edge with one means nothing spatially
    if((Number.isFinite(other.floor)?other.floor:0)!==roomFloor) return;
    const oW=other.width, oD=other.length, oX=other.worldX, oZ=other.worldZ;
    const xCandidates = [ oX+oW/2+w/2, oX-oW/2-w/2, oX ]; // touching on the right, touching on the left, centers aligned
    xCandidates.forEach(val=>{ const diff=Math.abs(px-val); if(diff<SNAP && (bestX===null || diff<bestX.diff)) bestX={val,diff}; });
    const zCandidates = [ oZ+oD/2+d/2, oZ-oD/2-d/2, oZ ]; // touching below, touching above, centers aligned
    zCandidates.forEach(val=>{ const diff=Math.abs(pz-val); if(diff<SNAP && (bestZ===null || diff<bestZ.diff)) bestZ={val,diff}; });
  });
  return { x: bestX?bestX.val:px, z: bestZ?bestZ.val:pz, snappedX: !!bestX, snappedZ: !!bestZ };
}
// Draws EVERY room in the project on one shared floor plan, each at its own world
// position — this is the 2D counterpart of the multi-room 3D scene: project.rooms[]
// drives what gets drawn, Editor.roomId only decides which one is drawn as "active"
// (bold orange outline + dimension lines) versus a plain grey outline for the rest.
function draw2DPlan(){
  const canvas = $('#plan2d-canvas'); if(!canvas || !Editor.project || !Editor.project.roomOrder.length) return;
  const wrap = $('#viewport-wrap'); if(!wrap || wrap.clientWidth===0) return;
  canvas.width = wrap.clientWidth; canvas.height = wrap.clientHeight;
  const ctx = canvas.getContext('2d');
  const project = Editor.project;
  const planFloor = Editor.plan2d.planFloor;
  const roomsOnFloor = project.roomOrder.filter(rid=>{
    const r = project.rooms[rid]; if(!r) return false;
    return planFloor==='all' || (Number.isFinite(r.floor)?r.floor:0)===planFloor;
  });
  const bounds = computeLayoutBounds(project, planFloor);
  const p2 = Editor.plan2d;
  const scale = plan2dBaseScale(canvas, bounds) * p2.zoom;
  // pan/zoom center on the layout's own centroid (not always (0,0)) so a multi-room
  // layout starts framed as a whole, the same way a single room used to be centered
  // on itself
  const ox = canvas.width/2 - bounds.cx*scale + p2.panX, oz = canvas.height/2 - bounds.cz*scale + p2.panY;
  const toPx = (x,z)=>[ox+x*scale, oz+z*scale];
  // stash the current transform so mouse handlers (plan2dScreenToWorld) can convert
  // clicks/drags back into world coordinates without duplicating this math
  p2.screenOx = ox; p2.screenOz = oz; p2.screenScale = scale;

  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#F5F3EC'; ctx.fillRect(0,0,canvas.width,canvas.height);

  // ---- grid: light lines every 0.5 unit-model-meter, heavier every 1m, in world space ----
  const gridStep = scale<18 ? 1 : 0.5; // thin out the grid at low zoom so it doesn't turn to mush
  ctx.lineWidth = 1;
  const gx0 = Math.floor((-ox/scale)/gridStep)*gridStep, gx1 = Math.ceil(((canvas.width-ox)/scale)/gridStep)*gridStep;
  const gz0 = Math.floor((-oz/scale)/gridStep)*gridStep, gz1 = Math.ceil(((canvas.height-oz)/scale)/gridStep)*gridStep;
  for(let x=gx0; x<=gx1; x+=gridStep){
    const isMajor = Math.abs(Math.round(x/1)-x/1)<1e-6;
    ctx.strokeStyle = isMajor ? '#e2ddd0' : '#ece7db';
    ctx.beginPath(); ctx.moveTo(toPx(x,gz0)[0],toPx(x,gz0)[1]); ctx.lineTo(toPx(x,gz1)[0],toPx(x,gz1)[1]); ctx.stroke();
  }
  for(let z=gz0; z<=gz1; z+=gridStep){
    const isMajor = Math.abs(Math.round(z/1)-z/1)<1e-6;
    ctx.strokeStyle = isMajor ? '#e2ddd0' : '#ece7db';
    ctx.beginPath(); ctx.moveTo(toPx(gx0,z)[0],toPx(gx0,z)[1]); ctx.lineTo(toPx(gx1,z)[0],toPx(gx1,z)[1]); ctx.stroke();
  }

  // ---- each room on the currently-selected floor, drawn at its own world offset ----
  // ("All Floors" shows every room overlaid together; picking a specific floor shows
  // only the rooms that belong to it, same as a real architectural floor plan set)
  roomsOnFloor.forEach(rid=>{
    const room = project.rooms[rid]; if(!room) return;
    const isActive = rid===Editor.roomId;
    const isDragging = rid===Editor.plan2d.dragRoomId && Editor.plan2d.moved;
    const roomOx = room.worldX||0, roomOz = room.worldZ||0;
    const toPxRoom = (x,z)=> toPx(x+roomOx, z+roomOz); // room-local -> screen px
    drawOneRoomPlan(ctx, toPxRoom, scale, room, isActive, isDragging);
  });

  // ---- alignment guide while a room is being dragged into a snapped position ----
  if(Editor.plan2d.dragGuide){
    const g = Editor.plan2d.dragGuide;
    ctx.save();
    ctx.strokeStyle = '#F0783C'; ctx.setLineDash([6,5]); ctx.lineWidth = 1.5;
    if(g.snappedX){ const [gx] = toPx(g.x,0); ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,canvas.height); ctx.stroke(); }
    if(g.snappedZ){ const [,gz] = toPx(0,g.z); ctx.beginPath(); ctx.moveTo(0,gz); ctx.lineTo(canvas.width,gz); ctx.stroke(); }
    ctx.restore();
  }
  if(!(Editor.plan2d.dragRoomId && Editor.plan2d.moved)) positionRoomFloatingToolbar(); // repositioned on drop instead of tracking the cursor — see the drag-hide in initPlan2DControls()
}
// Draws a single room's floor, walls, door/window openings, furniture, outline, and
// labels onto the 2D plan canvas. toPxRoom converts that room's own LOCAL coordinates
// (its floor spans -W/2..W/2, -D/2..D/2 same as in 3D) to screen pixels, already
// carrying that room's world offset — the caller (draw2DPlan) is the only place that
// knows about world positions, so this function itself works exactly like the old
// single-room drawing code always did. isDragging draws the room slightly translucent
// with a dashed outline while the user has it picked up, so it visually reads as "in
// motion" rather than looking identical to its settled state.
function drawOneRoomPlan(ctx, toPxRoom, scale, room, isActive, isDragging){
  const W=room.width, D=room.length;
  if(isDragging){ ctx.save(); ctx.globalAlpha=0.72; }

  // ---- floor ----
  ctx.fillStyle = room.floorColor;
  const [fx,fz] = toPxRoom(-W/2,-D/2);
  ctx.fillRect(fx,fz,W*scale,D*scale);

  // ---- walls, drawn at true thickness, with door/window openings cut into them ----
  const T = Math.max(room.thickness||0.12, 0.08)*scale;
  const wallSegs = plan2dWallSegments(room); // {wall, from, to} in room-local units per wall, split around openings
  ctx.fillStyle = '#3a3f45';
  wallSegs.forEach(seg=>{
    const [x1,z1] = toPxRoom(seg.x1,seg.z1), [x2,z2] = toPxRoom(seg.x2,seg.z2);
    ctx.save();
    ctx.translate((x1+x2)/2,(z1+z2)/2);
    ctx.rotate(Math.atan2(z2-z1,x2-x1));
    const len = Math.hypot(x2-x1,z2-z1);
    ctx.fillRect(-len/2,-T/2,len,T);
    ctx.restore();
  });

  // ---- door/window openings + swing/glazing markers ----
  room.objects.forEach(o=>{
    if(!o.wall) return;
    const def = findFurnitureDef(o.type); if(!def || !def.struct) return;
    plan2dDrawOpening(ctx, toPxRoom, scale, room, o, def);
  });

  // ---- furniture ----
  room.objects.forEach(o=>{
    if(o.wall) return; // doors/windows already drawn as wall openings above
    const def = o.category==='custom' ? customAssetFootprint(o.assetId) : (findFurnitureDef(o.type)||{w:0.5,d:0.5,name:o.type});
    const w = (def.w||0.5)*o.scale.x, d = (def.d||0.5)*o.scale.z;
    const [px,pz] = toPxRoom(o.position.x, o.position.z);
    const isSel = isActive && Editor.selectedIds && Editor.selectedIds.has(o.id);
    ctx.save();
    ctx.translate(px,pz); ctx.rotate(o.rotation.y);
    ctx.fillStyle = o.color||'#8a97a8';
    ctx.strokeStyle = isSel ? '#F0783C' : '#2a2f34';
    ctx.lineWidth = isSel ? 2 : 1;
    ctx.fillRect(-w*scale/2,-d*scale/2,w*scale,d*scale);
    ctx.strokeRect(-w*scale/2,-d*scale/2,w*scale,d*scale);
    ctx.restore();
    if(w*scale>28 && d*scale>14){
      ctx.fillStyle='#4a4f56'; ctx.font='9px Inter, sans-serif'; ctx.textAlign='center';
      ctx.fillText((def.name||'').slice(0,12), px, pz+3);
    }
  });

  // ---- room outline — bold orange for the active room, plain grey for the rest, so
  // it's obvious at a glance which room is selected without hiding the others; dashed
  // (instead of solid) while it's being dragged, as a lightweight "in motion" cue ----
  ctx.strokeStyle = isActive ? '#F0783C' : '#b9b3a4';
  ctx.lineWidth = isActive ? 2 : 1.25;
  if(isDragging) ctx.setLineDash([7,4]);
  ctx.strokeRect(fx,fz,W*scale,D*scale);
  if(isDragging) ctx.setLineDash([]);

  // ---- architectural dimension lines (extension lines + arrows + label) — shown for
  // the active room only, so a layout with several rooms doesn't turn into a thicket
  // of overlapping dimension lines ----
  if(isActive){
    plan2dDimensionLine(ctx, [fx,fz-30],[fx+W*scale,fz-30], fmtLen(W,room.unit), 'h');
    plan2dDimensionLine(ctx, [fx-30,fz],[fx-30,fz+D*scale], fmtLen(D,room.unit), 'v');
  }

  // ---- room name (every room gets one, positioned inside its own footprint) ----
  ctx.fillStyle = isActive ? '#2a2f34' : '#6a6f76';
  ctx.font = (isActive?'600 ':'500 ')+'13px Inter, sans-serif'; ctx.textAlign='left';
  ctx.fillText(room.name||'Room', fx+8, fz+20);
  if(isActive){
    ctx.fillStyle='#8a8f96'; ctx.font='11px Inter, sans-serif';
    ctx.fillText(fmtLen(W,room.unit)+' × '+fmtLen(D,room.unit)+' × '+fmtLen(room.height,room.unit), fx+8, fz+36);
  }
  if(isDragging) ctx.restore(); // pairs with the globalAlpha save() at the top of this function
}
// Splits each of the 4 walls into 1-2 straight segments around any door/window mounted on
// it, so the wall isn't drawn as a solid bar straight through an opening.
function plan2dWallSegments(room){
  const W=room.width, D=room.length;
  const base = {
    back:  {x1:-W/2, z1:-D/2, x2: W/2, z2:-D/2},
    front: {x1:-W/2, z1: D/2, x2: W/2, z2: D/2},
    left:  {x1:-W/2, z1:-D/2, x2:-W/2, z2: D/2},
    right: {x1: W/2, z1:-D/2, x2: W/2, z2: D/2},
  };
  const segs = [];
  Object.entries(base).forEach(([wallName,b])=>{
    const openings = room.objects
      .filter(o=>o.wall===wallName)
      .map(o=>{ const def=findFurnitureDef(o.type); if(!def||!def.struct) return null;
        const along = (wallName==='back'||wallName==='front') ? o.position.x : o.position.z;
        return {from: along-def.w/2, to: along+def.w/2};
      }).filter(Boolean).sort((a,c)=>a.from-c.from);
    const wallLen = (wallName==='back'||wallName==='front') ? W : D;
    let cursor = -wallLen/2;
    const push = (from,to)=>{
      if(to-from < 0.02) return;
      if(wallName==='back'||wallName==='front'){ segs.push({wall:wallName, x1:from, z1:b.z1, x2:to, z2:b.z1}); }
      else { segs.push({wall:wallName, x1:b.x1, z1:from, x2:b.x1, z2:to}); }
    };
    openings.forEach(op=>{ push(cursor, op.from); cursor = Math.max(cursor, op.to); });
    push(cursor, wallLen/2);
    if(openings.length===0) segs.push(base_full(wallName,b));
  });
  return segs;
  function base_full(wallName,b){ return {wall:wallName, x1:b.x1, z1:b.z1, x2:b.x2, z2:b.z2}; }
}
// Draws a door (swing arc) or window (double glazing line) across its opening in the wall.
function plan2dDrawOpening(ctx, toPx, scale, room, o, def){
  const isWindow = def.name.toLowerCase().includes('window');
  const wallName = o.wall;
  const horizontal = (wallName==='back'||wallName==='front');
  const along = horizontal ? o.position.x : o.position.z;
  const from = along - def.w/2, to = along + def.w/2;
  const fixedCoord = horizontal ? o.position.z : o.position.x;
  const p1 = horizontal ? toPx(from, fixedCoord) : toPx(fixedCoord, from);
  const p2 = horizontal ? toPx(to, fixedCoord) : toPx(fixedCoord, to);
  if(isWindow){
    ctx.strokeStyle = '#4a90b8'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.stroke();
    ctx.strokeStyle = '#bcdcea'; ctx.lineWidth = 1.5;
    const offs = 3;
    ctx.beginPath();
    if(horizontal){ ctx.moveTo(p1[0],p1[1]-offs); ctx.lineTo(p2[0],p2[1]-offs); ctx.moveTo(p1[0],p1[1]+offs); ctx.lineTo(p2[0],p2[1]+offs); }
    else { ctx.moveTo(p1[0]-offs,p1[1]); ctx.lineTo(p2[0]-offs,p2[1]); ctx.moveTo(p1[0]+offs,p1[1]); ctx.lineTo(p2[0]+offs,p2[1]); }
    ctx.stroke();
  } else {
    // clear the wall gap (already unfilled by plan2dWallSegments) then draw a door
    // swing: leaf line + quarter-circle arc, oriented into the room.
    const hingeAtStart = true;
    const hinge = hingeAtStart ? p1 : p2;
    const far = hingeAtStart ? p2 : p1;
    const doorLenPx = Math.hypot(far[0]-hinge[0], far[1]-hinge[1]);
    // inward normal (toward room center) for whichever wall this is
    const inward = {back:[0,1], front:[0,-1], left:[1,0], right:[-1,0]}[wallName] || [0,1];
    const leafEnd = [hinge[0]+inward[0]*doorLenPx, hinge[1]+inward[1]*doorLenPx];
    ctx.strokeStyle = '#8a6a45'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(hinge[0],hinge[1]); ctx.lineTo(leafEnd[0],leafEnd[1]); ctx.stroke();
    const startAngle = Math.atan2(leafEnd[1]-hinge[1], leafEnd[0]-hinge[0]);
    const endAngle = Math.atan2(far[1]-hinge[1], far[0]-hinge[0]);
    ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.arc(hinge[0],hinge[1], doorLenPx, Math.min(startAngle,endAngle), Math.max(startAngle,endAngle));
    ctx.stroke(); ctx.setLineDash([]);
  }
}
// Architectural-style dimension line: extension ticks, an arrowed span line, and a
// centered length label. orient 'h' = horizontal span, 'v' = vertical span.
function plan2dDimensionLine(ctx, [x1,y1],[x2,y2], label, orient){
  ctx.strokeStyle = '#5a5f66'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  const arrow = (x,y,angle)=>{
    ctx.save(); ctx.translate(x,y); ctx.rotate(angle);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-7,3); ctx.lineTo(-7,-3); ctx.closePath();
    ctx.fillStyle='#5a5f66'; ctx.fill(); ctx.restore();
  };
  const angle = Math.atan2(y2-y1,x2-x1);
  arrow(x1,y1,angle+Math.PI); arrow(x2,y2,angle);
  ctx.fillStyle='#3a3f45'; ctx.font='11px Inter, sans-serif'; ctx.textAlign='center';
  if(orient==='h'){ ctx.fillText(label,(x1+x2)/2,(y1+y2)/2-6); }
  else { ctx.save(); ctx.translate((x1+x2)/2-14,(y1+y2)/2); ctx.rotate(-Math.PI/2); ctx.fillText(label,0,0); ctx.restore(); }
}
window.addEventListener('resize', ()=>{ if(App.view==='editor' && Editor.viewMode==='2d') draw2DPlan(); });
// Pan (drag) + zoom (wheel) for the 2D plan. Bound once per viewport build; the canvas
// element itself is recreated each time buildViewport() runs so listeners never double up.
function initPlan2DControls(){
  const canvas = $('#plan2d-canvas'); if(!canvas) return;
  canvas.addEventListener('wheel',(e)=>{
    if(Editor.viewMode!=='2d') return;
    e.preventDefault();
    const factor = e.deltaY<0 ? 1.1 : 1/1.1;
    Editor.plan2d.zoom = clamp(Editor.plan2d.zoom*factor, 0.25, 8);
    draw2DPlan();
  }, {passive:false});
  // Pointer Events unify mouse, touch and pen into a single code path (with pointer
  // capture keeping every subsequent move/up routed to this canvas even if the finger
  // strays outside it mid-drag). Previously mouse used mousedown/window-mousemove/
  // window-mouseup while touch used a separate touchstart/touchmove/touchend that only
  // ever panned — never hit-tested a room — so a touch "drag" would pan a little, hit
  // the browser's own native scroll/zoom handling (since nothing set touch-action:none
  // before now), lose the gesture to that, and then resume: the "moves, then sticks,
  // then moves again" feel. One pointer-based path plus touch-action:none on the canvas
  // (see CSS) fixes both the stutter and the fact that touch could never drag a room.
  canvas.addEventListener('pointerdown',(e)=>{
    if(Editor.viewMode!=='2d') return;
    if(e.pointerType==='mouse' && e.button!==0) return;
    canvas.setPointerCapture(e.pointerId);
    Editor.plan2d.dragging = true; Editor.plan2d.moved=false; Editor.plan2d.lastX=e.clientX; Editor.plan2d.lastY=e.clientY;
    // hit-test against the point the pointer landed on (in world space) — if it's inside a
    // room's footprint we drag/select THAT room; otherwise we pan the whole canvas, same
    // as before. This is what makes the 2D plan double as the room-layout editor.
    const w = plan2dScreenToWorld(e.clientX, e.clientY);
    const hit = plan2dHitTestRoom(w.x, w.z);
    Editor.plan2d.dragRoomId = hit ? hit.id : null;
  });
  canvas.addEventListener('pointermove',(e)=>{
    if(!Editor.plan2d.dragging) return;
    const dx = e.clientX-Editor.plan2d.lastX, dy = e.clientY-Editor.plan2d.lastY;
    if(Math.abs(dx)>2||Math.abs(dy)>2) Editor.plan2d.moved = true;
    if(Editor.plan2d.dragRoomId){
      // move the room itself (in world units, using the plan's current scale) instead of
      // panning the canvas. Snapping keeps it flush against neighbors once it's close.
      const room = Editor.project.rooms[Editor.plan2d.dragRoomId];
      if(room && Editor.plan2d.moved){
        const scale = Editor.plan2d.screenScale || 40;
        const nx = (room.worldX||0) + dx/scale, nz = (room.worldZ||0) + dy/scale;
        const snapped = plan2dSnapRoomPosition(room, nx, nz);
        room.worldX = snapped.x; room.worldZ = snapped.z;
        Editor.plan2d.dragGuide = (snapped.snappedX||snapped.snappedZ) ? snapped : null;
        // the room's own toolbar would otherwise lag a frame behind the cursor (it only
        // repositions on drop) — simplest is to just hide it for the duration of the drag
        const rbar = $('#room-floating-toolbar'); if(rbar) rbar.classList.add('ft-dragging');
        draw2DPlan();
      }
    } else {
      Editor.plan2d.panX += dx; Editor.plan2d.panY += dy;
      draw2DPlan();
    }
    Editor.plan2d.lastX=e.clientX; Editor.plan2d.lastY=e.clientY;
  });
  function endPlan2DDrag(e){
    if(!Editor.plan2d.dragging) return;
    if(canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
    if(Editor.plan2d.dragRoomId){
      if(Editor.plan2d.moved){
        // the room actually moved — push the new position into the 3D scene and persist it
        buildRoomScene(); touchProjectNow();
      } else {
        // a plain tap/click with no drag — treat it as selecting that room, same as clicking
        // it in the Rooms panel, without disturbing any other room's position
        switchRoom(Editor.plan2d.dragRoomId);
      }
    }
    const rbar = $('#room-floating-toolbar'); if(rbar) rbar.classList.remove('ft-dragging');
    Editor.plan2d.dragging=false; Editor.plan2d.dragRoomId=null; Editor.plan2d.dragGuide=null;
    draw2DPlan();
  }
  canvas.addEventListener('pointerup', endPlan2DDrag);
  canvas.addEventListener('pointercancel', endPlan2DDrag);

  // Drag-and-drop furniture placement, mirroring onCanvasDrop() for the 3D viewport —
  // without this, dragging an asset-card onto the 2D Plan canvas had nowhere to land
  // (no dragover meant the browser never allowed the drop, so it silently snapped back).
  canvas.addEventListener('dragover',(e)=>{ if(Editor.viewMode==='2d') e.preventDefault(); });
  canvas.addEventListener('drop', onPlan2DDrop);
}
// Converts a 2D-Plan drop point (screen space) into the active room's LOCAL coordinates
// — same convention addFurnitureToRoom()/addCustomAssetToRoom() expect from onCanvasDrop()
// — by going through plan2dScreenToWorld() (world/plan space) and subtracting the active
// room's world offset, then clamping so a drop near a wall still lands inside the room.
// Returns null (rather than throwing) if there's no room to drop into yet, or the point
// isn't actually over the plan canvas.
function computeDropPointFrom2D(clientX, clientY){
  const canvas = $('#plan2d-canvas'); if(!canvas || !Editor.room) return null;
  const rect = canvas.getBoundingClientRect();
  if(clientX<rect.left || clientX>rect.right || clientY<rect.top || clientY>rect.bottom) return null;
  const w = plan2dScreenToWorld(clientX, clientY);
  const ox = Editor.room.worldX||0, oz = Editor.room.worldZ||0;
  return {
    x: clamp(w.x-ox, -Editor.room.width/2+0.2, Editor.room.width/2-0.2), y: 0,
    z: clamp(w.z-oz, -Editor.room.length/2+0.2, Editor.room.length/2-0.2)
  };
}
function onPlan2DDrop(e){
  e.preventDefault();
  const typeId = e.dataTransfer.getData('text/furniture-id');
  const assetId = e.dataTransfer.getData('text/custom-asset-id');
  if(!typeId && !assetId) return;
  if(!Editor.room){ toast('Create a room first','error'); return; }
  const pt = computeDropPointFrom2D(e.clientX, e.clientY) || {x:0,y:0,z:0};
  if(typeId) addFurnitureToRoom(typeId, pt);
  else if(assetId) addCustomAssetToRoom(assetId, pt);
  draw2DPlan();
}
// Unified entry point for the pointer-based asset drag (see beginAssetPointerDrag) —
// used instead of native HTML5 drag-and-drop, which is unreliable on touch devices and
// inside sandboxed/embedded contexts. Figures out which viewport the pointer was
// released over (3D viewport vs 2D Plan) independent of Editor.viewMode, since either
// could technically be present, and drops into whichever one actually matches.
function dropAssetAtClientPoint(clientX, clientY, typeId, assetId){
  if(!Editor.room){ toast('Create a room first','error'); return; }
  let pt = null;
  if(Editor.viewMode==='2d') pt = computeDropPointFrom2D(clientX, clientY);
  else pt = computeDropPointFrom3D(clientX, clientY);
  if(!pt){ toast('Drop it in the room', 'error'); return; }
  if(typeId) addFurnitureToRoom(typeId, pt);
  else if(assetId) addCustomAssetToRoom(assetId, pt);
  if(Editor.viewMode==='2d') draw2DPlan();
}
// Custom drag-and-drop for asset-cards (furniture library + "My Assets"), using Pointer
// Events instead of native HTML5 drag-and-drop. Native drag-and-drop (draggable="true" +
// dragstart/dragover/drop) does not fire reliably on touch devices, and can also be
// blocked inside sandboxed/embedded iframes — both of which made the sidebar-to-3D-view
// drag silently fail for some users even though the drop handler itself was correct.
// Pointer Events fire consistently for mouse, touch and pen alike, so this single code
// path replaces the old native drag entirely.
function beginAssetPointerDrag(card, e, typeId, assetId, iconHtml, label){
  if(e.pointerType==='mouse' && e.button!==0) return;
  const startX=e.clientX, startY=e.clientY;
  const THRESHOLD = 6; // small movement tolerance so a plain tap/click still reaches the card's own click handler untouched
  let dragging=false, ghost=null, hoverEl=null;
  function setHover(clientX, clientY){
    let next=null;
    if(Editor.viewMode==='2d'){
      const c = $('#plan2d-canvas'); if(c){ const r=c.getBoundingClientRect();
        if(clientX>=r.left&&clientX<=r.right&&clientY>=r.top&&clientY<=r.bottom) next=c; }
    } else {
      const h = $('#three-canvas-holder'); if(h){ const r=h.getBoundingClientRect();
        if(clientX>=r.left&&clientX<=r.right&&clientY>=r.top&&clientY<=r.bottom) next=h; }
    }
    if(hoverEl && hoverEl!==next) hoverEl.classList.remove('drop-target-active');
    if(next && next!==hoverEl) next.classList.add('drop-target-active');
    hoverEl = next;
  }
  function onMove(ev){
    const dx=ev.clientX-startX, dy=ev.clientY-startY;
    if(!dragging){
      if(Math.hypot(dx,dy) < THRESHOLD) return;
      dragging = true;
      card.classList.add('dragging-source');
      ghost = el('div',{class:'asset-drag-ghost'}, el('span',{class:'a-icon', html:iconHtml}), el('span',null,label));
      document.body.appendChild(ghost);
    }
    ghost.style.left = ev.clientX+'px'; ghost.style.top = ev.clientY+'px';
    setHover(ev.clientX, ev.clientY);
  }
  function onUp(ev){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onCancel);
    card.classList.remove('dragging-source');
    if(hoverEl) hoverEl.classList.remove('drop-target-active');
    if(ghost) ghost.remove();
    if(dragging){
      Editor._suppressNextClick = true; // the pointerup below is followed by a synthetic 'click' on the source card; swallow that one so it doesn't ALSO add via the plain-tap handler
      dropAssetAtClientPoint(ev.clientX, ev.clientY, typeId, assetId);
    }
  }
  function onCancel(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onCancel);
    card.classList.remove('dragging-source');
    if(hoverEl) hoverEl.classList.remove('drop-target-active');
    if(ghost) ghost.remove();
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onCancel);
}

/* ---------------------------- WALKTHROUGH MODE ---------------------------- */
function isTouchDevice(){
  return ('ontouchstart' in window) || (navigator.maxTouchPoints>0) || (navigator.msMaxTouchPoints>0);
}
function enterWalkthrough(){
  if(!Editor.room){ toast('Create a room first','error'); return; }
  if(!requireThree('Walkthrough mode')) return;
  Editor.walkthrough = true; document.body.classList.add('walkthrough');
  Editor.controls.enabled = false; Editor.transformControls.detach(); deselectAll();
  Editor.camera.position.set(Editor.room.worldX||0, 1.65, (Editor.room.worldZ||0)+Editor.room.length/2-0.5);
  Editor.walkYaw = Math.PI; Editor.walkPitch = 0;
  Editor.walkTouchMode = isTouchDevice();
  const canvas = Editor.renderer.domElement;
  const hint = $('.walkthrough-hint');
  if(Editor.walkTouchMode){
    // Pointer lock + WASD are desktop-mouse concepts with no touch equivalent, so on
    // touch devices we skip pointer lock entirely and build an on-screen joystick
    // (movement) plus a drag-to-look surface, with an always-visible exit button
    // since there's no Escape key to fall back on.
    if(hint) hint.style.display = 'none';
    buildTouchWalkthroughControls();
  } else {
    if(hint){ hint.style.display=''; hint.textContent = 'WASD to move • Mouse to look • Esc to exit'; }
    canvas.requestPointerLock = canvas.requestPointerLock || canvas.mozRequestPointerLock;
    canvas.requestPointerLock();
    document.addEventListener('pointerlockchange', onPLChange);
    document.addEventListener('mousemove', onWalkMouseMove);
    document.addEventListener('keydown', onWalkKeyDown);
    document.addEventListener('keyup', onWalkKeyUp);
  }
}
function onPLChange(){
  if(document.pointerLockElement !== Editor.renderer.domElement && Editor.walkthrough){ exitWalkthrough(); }
}
function onWalkMouseMove(e){
  if(!Editor.walkthrough) return;
  Editor.walkYaw -= e.movementX*0.0022;
  Editor.walkPitch = clamp(Editor.walkPitch - e.movementY*0.0022, -1.2, 1.2);
}
function onWalkKeyDown(e){ Editor.walkKeys[e.key.toLowerCase()]=true; if(e.key==='Escape') exitWalkthrough(); }
function onWalkKeyUp(e){ Editor.walkKeys[e.key.toLowerCase()]=false; }
// Builds a bottom-left virtual joystick (movement) and a full-screen drag surface
// (look) behind it, plus an explicit exit button. Touch events are dispatched by the
// browser to whichever element a touch actually started on, so the joystick (higher
// z-index, small footprint) and the look surface (full screen, behind it) naturally
// receive independent, simultaneous touch streams — the standard two-thumb mobile
// FPS control scheme — without any manual hit-testing on our part.
function buildTouchWalkthroughControls(){
  const lookSurface = el('div',{id:'walk-look-surface', style:'position:fixed;inset:0;z-index:302;touch-action:none;'});
  const joyBase = el('div',{id:'walk-joy-base', style:'position:fixed;left:22px;bottom:26px;width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.3);z-index:303;touch-action:none;'});
  const joyNub = el('div',{id:'walk-joy-nub', style:'position:absolute;left:36px;top:36px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.6);pointer-events:none;transition:background .1s;'});
  joyBase.appendChild(joyNub);
  const exitBtn = el('button',{id:'walk-touch-exit', style:'position:fixed;top:16px;right:16px;z-index:304;background:rgba(23,36,58,.78);border:1px solid var(--line);color:#fff;padding:10px 16px;border-radius:999px;font-size:12.5px;backdrop-filter:blur(6px);'},'Exit Walkthrough ✕');
  exitBtn.addEventListener('click', exitWalkthrough);
  document.body.appendChild(lookSurface);
  document.body.appendChild(joyBase);
  document.body.appendChild(exitBtn);
  Editor.walkTouchEls = {lookSurface, joyBase, joyNub, exitBtn};
  Editor.walkJoyVec = {x:0, y:0};

  const maxNub = 36;
  let joyTouchId = null;
  const setNub = (dx,dy)=>{ joyNub.style.left=(36+dx)+'px'; joyNub.style.top=(36+dy)+'px'; };
  const updateJoy = (t)=>{
    const rect = joyBase.getBoundingClientRect();
    const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
    let dx = t.clientX-cx, dy = t.clientY-cy;
    const dist = Math.hypot(dx,dy);
    if(dist>maxNub){ dx = dx/dist*maxNub; dy = dy/dist*maxNub; }
    setNub(dx,dy);
    Editor.walkJoyVec = { x: dx/maxNub, y: dy/maxNub }; // each axis -1..1; y<0 = pushed up = forward
  };
  const endJoy = (e)=>{
    if(![...e.changedTouches].some(t=>t.identifier===joyTouchId)) return;
    joyTouchId=null; Editor.walkJoyVec={x:0,y:0}; setNub(0,0); joyNub.style.background='rgba(255,255,255,.6)';
  };
  joyBase.addEventListener('touchstart',(e)=>{ e.preventDefault(); const t=e.changedTouches[0]; joyTouchId=t.identifier; joyNub.style.background='var(--brass)'; updateJoy(t); }, {passive:false});
  joyBase.addEventListener('touchmove',(e)=>{ e.preventDefault(); const t=[...e.changedTouches].find(tt=>tt.identifier===joyTouchId); if(t) updateJoy(t); }, {passive:false});
  joyBase.addEventListener('touchend', endJoy);
  joyBase.addEventListener('touchcancel', endJoy);

  let lookTouchId = null, lastLookX=0, lastLookY=0;
  lookSurface.addEventListener('touchstart',(e)=>{ const t=e.changedTouches[0]; lookTouchId=t.identifier; lastLookX=t.clientX; lastLookY=t.clientY; }, {passive:true});
  lookSurface.addEventListener('touchmove',(e)=>{
    const t=[...e.changedTouches].find(tt=>tt.identifier===lookTouchId); if(!t) return;
    const dx=t.clientX-lastLookX, dy=t.clientY-lastLookY;
    lastLookX=t.clientX; lastLookY=t.clientY;
    Editor.walkYaw -= dx*0.0045;
    Editor.walkPitch = clamp(Editor.walkPitch - dy*0.0045, -1.2, 1.2);
  }, {passive:true});
  const endLook = (e)=>{ if([...e.changedTouches].some(t=>t.identifier===lookTouchId)) lookTouchId=null; };
  lookSurface.addEventListener('touchend', endLook);
  lookSurface.addEventListener('touchcancel', endLook);
}
function updateWalkthrough(){
  const speed = 0.045;
  const dir = new THREE.Vector3(Math.sin(Editor.walkYaw),0,Math.cos(Editor.walkYaw));
  const right = new THREE.Vector3(dir.z,0,-dir.x);
  let move = new THREE.Vector3();
  if(Editor.walkTouchMode){
    const v = Editor.walkJoyVec || {x:0,y:0};
    move.add(dir.clone().multiplyScalar(-v.y)); // nub pushed up (negative y) = forward
    move.add(right.clone().multiplyScalar(v.x));
    const len = move.length();
    if(len>1) move.divideScalar(len); // analog: preserve partial-push speed, just cap at full speed
  } else {
    if(Editor.walkKeys['w']) move.add(dir);
    if(Editor.walkKeys['s']) move.sub(dir);
    if(Editor.walkKeys['a']) move.sub(right);
    if(Editor.walkKeys['d']) move.add(right);
    if(move.lengthSq()>0) move.normalize();
  }
  if(move.lengthSq()>0.0001){ move.multiplyScalar(speed); Editor.camera.position.add(move); }
  if(Editor.room){
    const ox=Editor.room.worldX||0, oz=Editor.room.worldZ||0;
    Editor.camera.position.x = clamp(Editor.camera.position.x, ox-Editor.room.width/2+0.3, ox+Editor.room.width/2-0.3);
    Editor.camera.position.z = clamp(Editor.camera.position.z, oz-Editor.room.length/2+0.3, oz+Editor.room.length/2-0.3);
  }
  Editor.camera.position.y = 1.65;
  const look = new THREE.Vector3(Editor.camera.position.x+Math.sin(Editor.walkYaw)*Math.cos(Editor.walkPitch),
    Editor.camera.position.y+Math.sin(Editor.walkPitch), Editor.camera.position.z+Math.cos(Editor.walkYaw)*Math.cos(Editor.walkPitch));
  Editor.camera.lookAt(look);
}
function exitWalkthrough(){
  Editor.walkthrough = false; document.body.classList.remove('walkthrough');
  document.removeEventListener('mousemove', onWalkMouseMove);
  document.removeEventListener('keydown', onWalkKeyDown);
  document.removeEventListener('keyup', onWalkKeyUp);
  document.removeEventListener('pointerlockchange', onPLChange);
  if(document.exitPointerLock) document.exitPointerLock();
  if(Editor.walkTouchEls){
    Object.values(Editor.walkTouchEls).forEach(elm=>{ if(elm && elm.remove) elm.remove(); });
    Editor.walkTouchEls = null;
  }
  Editor.walkTouchMode = false;
  Editor.walkJoyVec = {x:0,y:0};
  const hint = $('.walkthrough-hint'); if(hint) hint.style.display='';
  if(!Editor.threeAvailable) return; // nothing further to restore — 3D scene was never live
  Editor.controls.enabled = true;
  setCameraMode('perspective');
}

/* ---------------------------- EXPORT ---------------------------- */
function openExportMenu(){
  const scrim = el('div',{class:'scrim'});
  const modal = el('div',{class:'modal', style:'width:340px'});

  const body = el('div',{class:'modal-body'});

  function exportRow(title,sub,fn){

// Exports the currently-selected real-3D-reconstructed object as a standalone .glb —
// the actual generated mesh (its own geometry + textured/solid materials), independent
// of the room around it, for use elsewhere or for a client presentation deliverable.
function exportSelectedAsGLB(){
  if(typeof THREE.GLTFExporter==='undefined'){ toast('3D export library failed to load — check your connection and reload.','error'); return; }
  const o = findObjInRoom(Editor.selectedId);
  const mesh = o && Editor.objectMeshes[o.id];
  if(!o || !mesh){ toast('Select a 3D-reconstructed object first','error'); return; }
  const exporter = new THREE.GLTFExporter();
  // export a clone at identity transform (its own local geometry) rather than the live
  // scene instance, so the .glb is a clean standalone asset, not baked into this room's
  // current position/rotation/scale.
  const clone = mesh.clone(true);
  clone.position.set(0,0,0); clone.rotation.set(0,0,0); clone.scale.set(1,1,1);
  exporter.parse(clone, (result)=>{
    const blob = new Blob([result instanceof ArrayBuffer ? result : JSON.stringify(result)], {type:'model/gltf-binary'});
    const url = URL.createObjectURL(blob);
    download(((def=>def&&def.name||'furniture')(Store.data.customAssets[o.assetId]))+'.glb', url);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast('3D model (.glb) downloaded','success');
  }, (err)=>{ console.error(err); toast('GLB export failed','error'); }, {binary:true});
}
// Wraps the project in a small envelope with a format version and any 2.5D custom
// furniture assets it actually references. Custom assets live in a separate global
// store (Store.data.customAssets) keyed by id — without bundling them here, exporting
// and re-importing a project would silently lose any uploaded/2.5D furniture, leaving
// behind only broken references.
function exportJSON(){
  const project = Editor.project;
  const usedAssetIds = new Set();
  Object.values(project.rooms).forEach(r=>{
    (r.objects||[]).forEach(o=>{ if(o.category==='custom' && o.assetId) usedAssetIds.add(o.assetId); });
  });
  const customAssets = {};
  usedAssetIds.forEach(aid=>{ if(Store.data.customAssets[aid]) customAssets[aid] = Store.data.customAssets[aid]; });
  const payload = { roomcraftExportVersion: 1, exportedAt: Date.now(), project, customAssets };
  const data = JSON.stringify(payload, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  download((Editor.project.name||'roomcraft')+'.json', url);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast('Project JSON downloaded','success');
}

/* ---------------------------- IMPORT PROJECT ---------------------------- */
// Opens a native file picker filtered to JSON, then hands the chosen file to
// importProjectFile(). Used from both the dashboard and the in-editor Export menu.
function openImportInput(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.addEventListener('change', (e)=>{
    const file = e.target.files && e.target.files[0];
    if(file) importProjectFile(file);
  });
  inp.click();
}
function importProjectFile(file){
  if(!file.name.toLowerCase().endsWith('.json') && file.type && file.type!=='application/json'){
    toast('Please choose a Roomcraft .json export file.','error'); return;
  }
  if(file.size > 25*1024*1024){ toast('That file is too large to import (max 25MB).','error'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    let raw;
    try{ raw = JSON.parse(e.target.result); }
    catch(err){ toast('That file is not valid JSON — it may be corrupted or not a Roomcraft export.','error'); return; }
    // accept both the current wrapped format ({roomcraftExportVersion, project, customAssets})
    // and a bare project object (older exports, or a project JSON edited/produced by hand)
    const projectData = (raw && typeof raw==='object' && raw.project) ? raw.project : raw;
    const bundledAssets = (raw && typeof raw==='object' && raw.customAssets) ? raw.customAssets : {};
    const project = sanitizeImportedProject(projectData);
    if(!project){ toast('That file does not look like a valid Roomcraft project.','error'); return; }
    let importedAssetCount = 0;
    Object.keys(bundledAssets).forEach(aid=>{
      const a = bundledAssets[aid];
      if(a && typeof a==='object' && typeof a.dataURL==='string' && a.dataURL.startsWith('data:image')){
        Store.data.customAssets[aid] = sanitizeCustomAsset(a, aid);
        importedAssetCount++;
      }
    });
    Store.data.projects[project.id] = project;
    if(!Store.data.projectOrder.includes(project.id)) Store.data.projectOrder.push(project.id);
    if(!Store.persist()){ toast('Import succeeded but saving failed — browser storage may be full.','error'); }
    const assetNote = importedAssetCount ? (' with '+importedAssetCount+' 2.5D asset'+(importedAssetCount!==1?'s':'')) : '';
    toast('Project imported'+assetNote, 'success', 3600);
    location.hash = '#/project/'+project.id;
  };
  reader.onerror = ()=> toast('Could not read that file.', 'error');
  reader.readAsText(file);
}
// Rebuilds a project record field-by-field with safe defaults/type checks rather than
// trusting the file wholesale — malformed, hand-edited, or partially corrupted JSON
// must never crash the app; unrecoverable pieces are dropped instead.
function sanitizeImportedProject(data){
  try{
    if(!data || typeof data!=='object') return null;
    const rawRooms = data.rooms && typeof data.rooms==='object' ? data.rooms : {};
    const roomOrderIn = Array.isArray(data.roomOrder) ? data.roomOrder : Object.keys(rawRooms);
    const rooms = {}; const roomOrder = [];
    roomOrderIn.forEach(rid=>{
      const sr = sanitizeRoom(rawRooms[rid]);
      if(sr){ rooms[sr.id]=sr; roomOrder.push(sr.id); }
    });
    if(roomOrder.length===0 && Object.keys(rawRooms).length>0) return null; // rooms existed but all failed validation — treat as corrupt rather than silently emptying the project
    assignRoomLayoutPositions(rooms, roomOrder);
    // give the import a fresh id unless the original id is free on this device, so importing
    // never silently overwrites an existing, unrelated project that happens to share an id
    const id = (typeof data.id==='string' && data.id && !Store.data.projects[data.id]) ? data.id : uid('proj');
    return {
      id,
      name: (typeof data.name==='string' && data.name.trim()) ? data.name.trim() : 'Imported Project',
      createdAt: Number(data.createdAt) || Date.now(),
      updatedAt: Date.now(),
      status: 'draft', // imported projects always land as drafts — any old shareId/publish state belonged to another device
      shareId: null,
      designerName: typeof data.designerName==='string' ? data.designerName : '',
      description: typeof data.description==='string' ? data.description : '',
      rooms, roomOrder,
      activeRoomId: roomOrder.includes(data.activeRoomId) ? data.activeRoomId : (roomOrder[0]||null),
      previewImage: (typeof data.previewImage==='string' && data.previewImage.startsWith('data:image')) ? data.previewImage : null,
      style: (typeof data.style==='string' && STYLE_PRESETS[data.style]) ? data.style : null,
    };
  }catch(e){ console.error('Project import failed', e); return null; }
}
function sanitizeRoom(r){
  try{
    if(!r || typeof r!=='object') return null;
    const objects = Array.isArray(r.objects)
      ? r.objects.map(sanitizeRoomObject).filter(Boolean)
      : [];
    return {
      id: (typeof r.id==='string' && r.id) ? r.id : uid('room'),
      name: (typeof r.name==='string' && r.name.trim()) ? r.name.trim() : 'Room',
      type: (typeof r.type==='string' && ROOM_TYPES.includes(r.type)) ? r.type : 'Custom Room',
      width: Number(r.width)>0.5 ? Number(r.width) : 4,
      length: Number(r.length)>0.5 ? Number(r.length) : 4,
      height: Number(r.height)>1 ? Number(r.height) : 2.7,
      thickness: Number(r.thickness)>0 ? Number(r.thickness) : 0.12,
      unit: ['ft','in','m','cm'].includes(r.unit) ? r.unit : 'ft',
      wallColor: typeof r.wallColor==='string' ? r.wallColor : '#f2efe9',
      floorColor: typeof r.floorColor==='string' ? r.floorColor : '#c9a877',
      wallMaterial: (typeof r.wallMaterial==='string' && MATERIAL_TYPES[r.wallMaterial]) ? r.wallMaterial : null,
      floorMaterial: (typeof r.floorMaterial==='string' && MATERIAL_TYPES[r.floorMaterial]) ? r.floorMaterial : null,
      ceilingOn: !!r.ceilingOn,
      // World-space placement of this room's origin (its local 0,0) within the shared
      // multi-room scene. null means "not yet placed" — assignRoomLayoutPositions()
      // (called right after sanitization, for every load/import path) fills these in
      // automatically so rooms never stack on top of each other. Once a room has a
      // real number here it's left alone, so this also preserves a user's existing
      // layout across reloads instead of re-flowing it every time.
      worldX: Number.isFinite(Number(r.worldX)) ? Number(r.worldX) : null,
      worldZ: Number.isFinite(Number(r.worldZ)) ? Number(r.worldZ) : null,
      // Vertical floor/level this room sits on — 0 is Ground Floor, positive numbers go
      // up, negative numbers are basements. Existing saved rooms (from before this
      // system existed) have no `floor` field, and default to Ground Floor here so they
      // keep rendering and behaving exactly as they did.
      floor: Number.isFinite(Number(r.floor)) ? Math.round(Number(r.floor)) : 0,
      objects,
      lighting: {
        ambientIntensity: Number(r.lighting && r.lighting.ambientIntensity) || 0.55,
        dirIntensity: Number(r.lighting && r.lighting.dirIntensity) || 0.85,
        mode: (r.lighting && ['day','evening','night'].includes(r.lighting.mode)) ? r.lighting.mode : 'day',
        pointLightsOn: !(r.lighting && r.lighting.pointLightsOn===false),
      },
    };
  }catch(e){ return null; }
}
// Assigns world-space positions to any room in roomOrder that doesn't have one yet
// (worldX/worldZ still null — a brand-new room, or one restored from a save made
// before multi-room layout existed). Rooms are laid out left-to-right with a gap
// between them, wrapping into a new row once a row gets too wide, so a project with
// many rooms doesn't end up as one enormous strip. Rooms that already have a valid
// position are left exactly where they are — this only fills gaps, it never
// reflows a layout the user (or a previous session) already settled on.
function assignRoomLayoutPositions(rooms, roomOrder){
  const GAP = 1.5, ROW_WIDTH_LIMIT = 22;
  // Each floor gets its own independent auto-flow cursor, starting fresh at (0,0) — a
  // room on First Floor auto-flowing into free space has nothing to do with how Ground
  // Floor happens to be laid out, and since different floors are allowed to share X/Z
  // (that's the whole point of stacking), there's no reason to offset one floor's flow
  // because of another floor's rooms.
  const byFloor = {};
  (roomOrder||[]).forEach(rid=>{
    const r = rooms[rid]; if(!r) return;
    const floor = Number.isFinite(r.floor) ? r.floor : 0; r.floor = floor;
    if(!byFloor[floor]) byFloor[floor] = { rowStartX:0, rowZ:0, rowMaxDepth:0, cursorX:0, rowHasRoom:false };
    const st = byFloor[floor];
    const hasPos = Number.isFinite(r.worldX) && Number.isFinite(r.worldZ);
    if(!hasPos){
      if(st.rowHasRoom && (st.cursorX-st.rowStartX) > ROW_WIDTH_LIMIT){
        // start a new row below the current one
        st.rowZ += st.rowMaxDepth + GAP; st.rowStartX = 0; st.cursorX = 0; st.rowMaxDepth = 0; st.rowHasRoom = false;
      }
      r.worldX = st.cursorX + r.width/2;
      r.worldZ = st.rowZ;
    }
    // whether newly placed or already positioned, fold this room into the running
    // layout cursor so anything placed after it never overlaps it (on the SAME floor)
    const rightEdge = r.worldX + r.width/2;
    st.cursorX = Math.max(st.cursorX, rightEdge + GAP);
    st.rowMaxDepth = Math.max(st.rowMaxDepth, r.length);
    st.rowHasRoom = true;
  });
}
// World-space bounding box of every room in the project, used to size the 2D plan
// view, the "Fit all rooms" camera, and the lighting rig's shadow coverage. Falls
// back to a small default box if the project has no rooms yet.
function computeLayoutBounds(project, floorFilter){
  let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;
  (project && project.roomOrder||[]).forEach(rid=>{
    const r = project.rooms[rid]; if(!r) return;
    if(floorFilter!==undefined && floorFilter!==null && floorFilter!=='all' && (Number.isFinite(r.floor)?r.floor:0)!==floorFilter) return;
    const ox=r.worldX||0, oz=r.worldZ||0;
    minX=Math.min(minX, ox-r.width/2); maxX=Math.max(maxX, ox+r.width/2);
    minZ=Math.min(minZ, oz-r.length/2); maxZ=Math.max(maxZ, oz+r.length/2);
  });
  if(!isFinite(minX)) return {minX:-2,maxX:2,minZ:-2,maxZ:2,width:4,depth:4,cx:0,cz:0};
  return {minX,maxX,minZ,maxZ, width:maxX-minX, depth:maxZ-minZ, cx:(minX+maxX)/2, cz:(minZ+maxZ)/2};
}
function sanitizeRoomObject(o){
  try{
    if(!o || typeof o!=='object') return null;
    const vec = (v,d)=>({
      x: Number.isFinite(Number(v && v.x)) ? Number(v.x) : d.x,
      y: Number.isFinite(Number(v && v.y)) ? Number(v.y) : d.y,
      z: Number.isFinite(Number(v && v.z)) ? Number(v.z) : d.z,
    });
    const base = {
      id: (typeof o.id==='string' && o.id) ? o.id : uid('obj'),
      position: vec(o.position, {x:0,y:0,z:0}),
      rotation: vec(o.rotation, {x:0,y:0,z:0}),
      scale: vec(o.scale, {x:1,y:1,z:1}),
    };
    if(base.scale.x<=0) base.scale.x=1; if(base.scale.y<=0) base.scale.y=1; if(base.scale.z<=0) base.scale.z=1;
    if(o.category==='custom'){
      base.category='custom';
      base.assetId = typeof o.assetId==='string' ? o.assetId : null;
      if(!base.assetId) return null; // a custom asset object with no asset reference can't render anything meaningful
      // per-instance color override for AI-matched parametric assets (see openImageToFurnitureModal) —
      // lets one placed copy be recolored without changing every other copy or the library asset itself
      base.color = typeof o.color==='string' ? o.color : null;
    } else {
      if(typeof o.type!=='string' || !findFurnitureDef(o.type)) return null; // drop unknown/legacy furniture types rather than crash the mesh builder later
      base.category='furniture';
      base.type = o.type;
      base.color = typeof o.color==='string' ? o.color : findFurnitureDef(o.type).color;
      base.materialId = (typeof o.materialId==='string' && findMaterialPreset(o.materialId)) ? o.materialId : null;
      if(typeof o.wall==='string' && ['back','front','left','right'].includes(o.wall)) base.wall = o.wall;
    }
    return base;
  }catch(e){ return null; }
}

/* ---------------------------- CLOUD SHARE STORAGE ----------------------------
   Publishing writes a self-contained snapshot (the project plus any 2.5D custom
   furniture it uses) to shared, cross-device storage keyed by the project's
   shareId, using the app's built-in persistent storage. That's what makes a
   published link genuinely open for anyone, on any device or browser — not just
   the one that published it. If that shared storage isn't available in this
   session (e.g. the file is opened outside Claude.ai), publishing still works
   as a local-only preview and the UI says so plainly instead of implying a real
   public link exists. */
function cloudStorageAvailable(){
  return !!(window.storage && typeof window.storage.set==='function' && typeof window.storage.get==='function');
}
async function cloudPublish(project){
  if(!cloudStorageAvailable()) return false;
  const usedAssetIds = new Set();
  Object.values(project.rooms).forEach(r=>(r.objects||[]).forEach(o=>{ if(o.category==='custom' && o.assetId) usedAssetIds.add(o.assetId); }));
  const customAssets = {};
  usedAssetIds.forEach(aid=>{ if(Store.data.customAssets[aid]) customAssets[aid]=Store.data.customAssets[aid]; });
  const payload = { roomcraftShareVersion:1, publishedAt:Date.now(), project, customAssets };
  try{
    const res = await window.storage.set('published:'+project.shareId, JSON.stringify(payload), true);
    return !!res;
  }catch(e){ console.error('Publish upload failed', e); return false; }
}
async function cloudFetchPublished(shareId){
  if(!cloudStorageAvailable()) return null;
  try{
    const res = await window.storage.get('published:'+shareId, true);
    if(!res || typeof res.value!=='string') return null;
    const raw = JSON.parse(res.value);
    const project = sanitizeStoredProject(raw.project, shareId);
    if(!project || project.status!=='published') return null;
    const customAssets = (raw.customAssets && typeof raw.customAssets==='object') ? raw.customAssets : {};
    return { project, customAssets };
  }catch(e){ return null; } // no key set yet (not published / storage unreachable) — treated as "not found" by the caller
}
async function cloudUnpublish(shareId){
  if(!shareId || !cloudStorageAvailable()) return;
  try{ await window.storage.delete('published:'+shareId, true); }catch(e){ /* already gone, or unreachable — nothing more we can do */ }
}

/* ---------------------------- PUBLISH / SHARE ---------------------------- */
function openShareModal(projectId){
  const project = getProject(projectId); if(!project) return;
  const cloudOK = cloudStorageAvailable();
  const scrim = el('div',{class:'scrim'});
  const modal = el('div',{class:'modal', style:'width:460px'});
  modal.appendChild(el('div',{class:'modal-head'}, el('h2',null,'Share Project'), el('p',null,'Publish a client-facing presentation of this design.')));
  const body = el('div',{class:'modal-body'});

  body.appendChild(el('div',{class:'field'}, el('label',null,'Designer name (shown to client)'),
    el('input',{type:'text', value:project.designerName||'', placeholder:'e.g. Studio Roomcraft', oninput:(e)=>{project.designerName=e.target.value;}, onchange:()=>touchProject()})));
  body.appendChild(el('div',{class:'field'}, el('label',null,'Project description'),
    el('textarea',{rows:3, placeholder:'A short note the client will see…', oninput:(e)=>{project.description=e.target.value;}, onchange:()=>touchProject()}, project.description||'')));

  const statusBox = el('div',{style:'background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-m);padding:12px 14px;font-size:12.5px;color:var(--text-dim);display:flex;flex-direction:column;gap:8px'});
  body.appendChild(statusBox);
  modal.appendChild(body);
  const foot = el('div',{class:'modal-foot'});
  modal.appendChild(foot);
  scrim.appendChild(modal); document.body.appendChild(scrim);
  scrim.addEventListener('click',(e)=>{ if(e.target===scrim) scrim.remove(); });
  refresh();

  function refresh(){
    statusBox.innerHTML=''; foot.innerHTML='';
    if(project.status==='published' && project.shareId){
      const url = location.origin+location.pathname+'#/view/'+project.shareId;
      if(cloudOK){
        statusBox.appendChild(el('div',{style:'display:flex;gap:6px;align-items:center;color:var(--text)'}, '🔗 This link is live — anyone with it can open this presentation, on any device or browser.'));
      } else {
        statusBox.appendChild(el('div',{class:'demo-banner', style:'border-radius:8px'}, 'No shared cloud storage is connected in this session, so right now this link only opens on this device/browser.'));
      }
      const urlInput = el('input',{type:'text', readonly:true, value:url, style:'flex:1;background:var(--panel-3);border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--text);font-size:11.5px'});
      statusBox.appendChild(el('div',{style:'display:flex;gap:6px;align-items:center'}, urlInput));
      const unpubBtn = el('button',{class:'btn danger',onclick: async ()=>{
        unpubBtn.disabled = true; unpubBtn.textContent='Unpublishing…';
        const shareId = project.shareId;
        project.status='draft'; project.shareId=null; touchProject();
        await cloudUnpublish(shareId);
        refresh(); toast('Project unpublished');
      }},'Unpublish');
      foot.appendChild(unpubBtn);
      foot.appendChild(el('button',{class:'btn',onclick: async ()=>{
        // Never claim success unconditionally — the Clipboard API can be missing
        // (insecure context, older browser) or reject (permission denied), and a
        // false "Link copied" toast leaves the user pasting nothing later with no
        // idea why. Fall back to selecting the text so they can copy manually.
        try{
          if(!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('Clipboard API unavailable');
          await navigator.clipboard.writeText(url);
          toast('Link copied','success');
        }catch(e){
          urlInput.focus(); urlInput.select();
          toast('Could not auto-copy — the link is selected, press Ctrl/Cmd+C to copy.','error',4200);
        }
      }, html:svgIcon('copy')+' Copy Link'}));
      foot.appendChild(el('button',{class:'btn primary',onclick:()=>{ scrim.remove(); location.hash='#/view/'+project.shareId; }},'Open Client View'));
    } else {
      statusBox.appendChild(el('div',null,'Publishing creates a shareable presentation link and generates a preview image from the current 3D view. Clients can rotate, zoom and switch rooms — but cannot edit.'));
      if(!cloudOK){
        statusBox.appendChild(el('div',{class:'demo-banner', style:'border-radius:8px'}, 'No shared cloud storage is connected in this session, so the link will only open on this device (local preview). Open this app from Claude to get a link anyone can open.'));
      }
      foot.appendChild(el('button',{class:'btn',onclick:()=>scrim.remove()},'Cancel'));
      const pubBtn = el('button',{class:'btn primary'},'Publish Project');
      pubBtn.addEventListener('click', async ()=>{
        pubBtn.disabled = true; pubBtn.textContent = cloudOK ? 'Publishing…' : 'Publishing (local)…';
        project.status='published'; project.shareId = project.shareId || uid('share'); markOnboarding('publish');
        capturePreview();
        touchProject();
        const uploaded = cloudOK ? await cloudPublish(project) : false;
        refresh();
        if(cloudOK && uploaded) toast('Project published — link works on any device','success');
        else if(cloudOK && !uploaded) toast('Published locally, but the cloud upload failed (project may be too large) — the link may not open elsewhere.','error',5000);
        else toast('Project published (local preview only)','success');
      });
      foot.appendChild(pubBtn);
    }
  }
  function capturePreview(){
    const img = capturePreviewImage();
    if(img){ project.previewImage = img; touchProject(); return true; }
    return false;
  }
}

/* ---------------------------- CLIENT-FACING VIEW ---------------------------- */
const ClientEditor = { room:null, project:null, roomId:null };
async function renderClientView(shareId){
  App.view='client';
  document.body.classList.remove('presenting','walkthrough');
  teardownEditorScene();
  const root = $('#app'); root.innerHTML='';
  root.appendChild(el('div',{id:'view-client-loading', class:'view', style:'align-items:center;justify-content:center'},
    el('div',{class:'empty-state'}, el('div',{class:'es-icon'},'🔗'), el('h3',null,'Loading presentation…'))));

  // Try the real cross-device cloud copy first — this is what makes the link work for
  // anyone, anywhere. Fall back to a local copy on this device only if there's no cloud
  // copy (e.g. no shared storage available in this session, or a stale local project).
  let project = null, cloudAssets = null;
  const cloud = await cloudFetchPublished(shareId);
  if(cloud){ project = cloud.project; cloudAssets = cloud.customAssets; }
  else{
    for(const id of Store.data.projectOrder){
      const p = Store.data.projects[id];
      if(p && p.status==='published' && p.shareId===shareId){ project=p; break; }
    }
  }
  // The user may have navigated elsewhere while this was loading — don't render a stale view.
  if(location.hash.slice(1) !== '/view/'+shareId) return;

function initClientThree(){
  const holder = $('#client-canvas-holder');
  if(typeof THREE==='undefined' || !THREE.WebGLRenderer){
    showThreeLoadError(holder);
    return;
  }
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0xdfe4e8);
  const camera = new THREE.PerspectiveCamera(50, holder.clientWidth/holder.clientHeight, 0.05, 500);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(holder.clientWidth, holder.clientHeight);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; // filmic highlight rolloff for a premium, camera-like render
  renderer.toneMappingExposure = 1.1;
  holder.appendChild(renderer.domElement);
  scene.environment = generateStudioEnvMap(renderer); // realistic ambient/reflected light on all materials
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0,1,0); controls.maxPolarAngle=Math.PI*0.49; controls.minDistance=1; controls.maxDistance=40;
  Editor.scene=scene; Editor.camera=camera; Editor.renderer=renderer; Editor.controls=controls;
  Editor.transformControls = {attach(){},detach(){},setMode(){}}; // no-op stand-in, client can't edit
  Editor.lightsGroup = new THREE.Group(); scene.add(Editor.lightsGroup);
  Editor.raycaster = new THREE.Raycaster();
  Editor.walkthrough=false; Editor.walkKeys={};
  // NOTE: resize is handled by the single global listener bound once near
  // teardownEditorScene (it already falls back to #client-canvas-holder), so we
  // deliberately do NOT register another one here — doing so on every visit to the
  // client view was leaking a listener per visit that was never removed.
  function animate(){
    if(App.view!=='client'){ Editor.animReq=null; return; }
    Editor.animReq = requestAnimationFrame(animate);
    if(Editor.walkthrough) updateWalkthrough();
    controls.update(); renderer.render(scene,camera);
  }
  animate();
}
function buildClientScene(){
  Editor.room = ClientEditor.room; Editor.project = ClientEditor.project;
  clearRoomGroup();
  const room = Editor.room; const W=room.width,D=room.length,H=room.height,T=room.thickness;
  const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(W,D), matTex(room.floorColor,room.floorMaterial||'floorwood',0.55,0.03,1.15,[Math.max(2,Math.round(W*1.3)),Math.max(2,Math.round(D*1.3))]));
  floorMesh.rotation.x=-Math.PI/2; floorMesh.receiveShadow=true; Editor.roomGroup.add(floorMesh); Editor.floorMesh=floorMesh;
  const wallMat=()=>matTex(room.wallColor,room.wallMaterial||'plaster',0.88,0.02,0.55,[Math.max(2,Math.round(W)),Math.max(1,Math.round(H))]);
  const wBack=new THREE.Mesh(new THREE.BoxGeometry(W+T,H,T),wallMat()); wBack.position.set(0,H/2,-D/2-T/2);
  const wFront=new THREE.Mesh(new THREE.BoxGeometry(W+T,H,T),wallMat()); wFront.position.set(0,H/2,D/2+T/2);
  const wLeft=new THREE.Mesh(new THREE.BoxGeometry(T,H,D+T),wallMat()); wLeft.position.set(-W/2-T/2,H/2,0);
  const wRight=new THREE.Mesh(new THREE.BoxGeometry(T,H,D+T),wallMat()); wRight.position.set(W/2+T/2,H/2,0);
  [wBack,wFront,wLeft,wRight].forEach(w=>{w.castShadow=true;w.receiveShadow=true;Editor.roomGroup.add(w);Editor.wallMeshes.push(w);});
  if(room.ceilingOn){ const ceil=new THREE.Mesh(new THREE.PlaneGeometry(W,D),matTex(room.wallColor,'plaster',0.95,0,0.3,[Math.max(2,Math.round(W)),Math.max(2,Math.round(D))])); ceil.material.side=THREE.DoubleSide; ceil.rotation.x=Math.PI/2; ceil.position.y=H; Editor.roomGroup.add(ceil); Editor.ceilingMesh=ceil; }
  room.objects.forEach(o=>instantiateObject(o));
  const dist = Math.max(W,D)*1.15+2;
  Editor.camera.position.set(dist*0.6, Math.max(H*1.8,3), dist*0.75);
  Editor.controls.target.set(0,H*0.35,0); Editor.controls.update();
  applyLightingToScene();
  if(Editor.__origRefreshMaterials) Editor.__origRefreshMaterials();
}

/* ============================================================================
   SMART EDITOR UX — floating contextual toolbar, multi-select, snapping/align
   guides, lock/hide, grouping, and copy/paste. Layered on top of the core
   selection/transform system above so a beginner never has to hunt through
   side panels: click something and the controls that matter appear right on it.
   ============================================================================ */
function setObjectLocked(id, locked){
  const o = findObjInRoom(id); if(!o) return;
  pushHistory();
  o.locked = locked;
  const m = Editor.objectMeshes[id]; if(m) applyObjectFlags(o,m);
  if(Editor.selectedIds.has(id)) applySelectionToScene();
  touchProject(); renderPropsPanel(); updateFloatingToolbar();
}
function setObjectHidden(id, hidden){
  const o = findObjInRoom(id); if(!o) return;
  pushHistory();
  o.hidden = hidden;
  const m = Editor.objectMeshes[id]; if(m) applyObjectFlags(o,m);
  if(Editor.selectedIds.has(id)) applySelectionToScene();
  touchProject(); renderPropsPanel(); updateFloatingToolbar();
}
function toggleLockSelected(){
  const objs = [...Editor.selectedIds].map(findObjInRoom).filter(Boolean);
  if(!objs.length) return;
  pushHistory();
  const anyUnlocked = objs.some(o=>!o.locked);
  objs.forEach(o=>{ o.locked = anyUnlocked; const m=Editor.objectMeshes[o.id]; if(m) applyObjectFlags(o,m); });
  applySelectionToScene();
  renderPropsPanel(); updateFloatingToolbar(); touchProject();
  toast(anyUnlocked ? 'Locked' : 'Unlocked');
}
function toggleHideSelected(){
  const objs = [...Editor.selectedIds].map(findObjInRoom).filter(Boolean);
  if(!objs.length) return;
  pushHistory();
  const anyVisible = objs.some(o=>!o.hidden);
  objs.forEach(o=>{ o.hidden = anyVisible; const m=Editor.objectMeshes[o.id]; if(m) applyObjectFlags(o,m); });
  applySelectionToScene();
  renderPropsPanel(); updateFloatingToolbar(); touchProject();
  toast(anyVisible ? 'Hidden' : 'Shown');
}
function groupSelected(){
  const objs = selectedObjects();
  if(objs.length<2){ toast('Select 2 or more items to group','error'); return; }
  pushHistory();
  const gid = uid('grp');
  objs.forEach(o=> o.groupId = gid);
  touchProject(); renderPropsPanel(); updateFloatingToolbar();
  toast('Grouped — click any piece to select the whole group');
}
function ungroupSelected(){
  const objs = selectedObjects().filter(o=>o.groupId);
  if(!objs.length) return;
  pushHistory();
  const gids = new Set(objs.map(o=>o.groupId));
  Editor.room.objects.forEach(o=>{ if(gids.has(o.groupId)) delete o.groupId; });
  touchProject(); renderPropsPanel(); updateFloatingToolbar();
  toast('Ungrouped');
}
// "Place against wall": slides the selected object(s) to touch whichever wall is
// currently nearest, without changing their facing — mirrors the logic used to snap
// doors/windows (snapStructureToWall) but works on movable furniture's rotated footprint.
function placeSelectedAgainstWall(){
  const objs = selectedObjects(); if(!objs.length || !Editor.room) return;
  releasePivotGroup();
  pushHistory();
  const room = Editor.room, W=room.width, D=room.length;
  objs.forEach(o=>{
    const fp = getFootprint(o); if(!fp) return;
    const rot=fp.rot||0, hw=fp.w/2, hd=fp.d/2;
    const cos=Math.abs(Math.cos(rot)), sin=Math.abs(Math.sin(rot));
    const halfX = hw*cos+hd*sin, halfZ = hw*sin+hd*cos;
    const distBack = (o.position.z-halfZ)-(-D/2);
    const distFront = (D/2)-(o.position.z+halfZ);
    const distLeft = (o.position.x-halfX)-(-W/2);
    const distRight = (W/2)-(o.position.x+halfX);
    const m = Math.min(distBack,distFront,distLeft,distRight);
    const clr = 0.02;
    if(m===distBack) o.position.z = -D/2+halfZ+clr;
    else if(m===distFront) o.position.z = D/2-halfZ-clr;
    else if(m===distLeft) o.position.x = -W/2+halfX+clr;
    else o.position.x = W/2-halfX-clr;
    const mesh = Editor.objectMeshes[o.id]; if(mesh) mesh.position.set(o.position.x,o.position.y,o.position.z);
  });
  applySelectionToScene();
  touchProject(); updateOverlapHighlight(); renderPropsPanel(); updateFloatingToolbar();
  toast(objs.length>1 ? 'Placed against nearest walls' : 'Placed against wall');
}
function centerSelectedInRoom(){
  const objs = selectedObjects(); if(!objs.length || !Editor.room) return;
  releasePivotGroup();
  pushHistory();
  if(objs.length===1){
    const o = objs[0]; o.position.x=0; o.position.z=0;
    const mesh = Editor.objectMeshes[o.id]; if(mesh) mesh.position.set(0,o.position.y,0);
  } else {
    // keep the group's relative arrangement, just move its centroid to the room center
    let cx=0, cz=0; objs.forEach(o=>{ cx+=o.position.x; cz+=o.position.z; }); cx/=objs.length; cz/=objs.length;
    objs.forEach(o=>{
      o.position.x -= cx; o.position.z -= cz;
      const mesh = Editor.objectMeshes[o.id]; if(mesh) mesh.position.set(o.position.x,o.position.y,o.position.z);
    });
  }
  applySelectionToScene();
  touchProject(); updateOverlapHighlight(); renderPropsPanel(); updateFloatingToolbar();
  toast('Centered in room');
}
// "Align with X" — matches the selection's position on one axis to a chosen piece of
// furniture already in the room, e.g. lining a side table up with a sofa.
function alignSelectedWith(targetId, axis){
  const objs = selectedObjects(); if(!objs.length) return;
  const target = findObjInRoom(targetId); if(!target) return;
  releasePivotGroup();
  pushHistory();
  objs.forEach(o=>{
    if(o.id===targetId) return;
    o.position[axis] = target.position[axis];
    const mesh = Editor.objectMeshes[o.id]; if(mesh) mesh.position.set(o.position.x,o.position.y,o.position.z);
  });
  applySelectionToScene();
  touchProject(); updateOverlapHighlight(); renderPropsPanel(); updateFloatingToolbar();
  toast('Aligned');
}

/* ---------------------------- FLOATING CONTEXTUAL TOOLBAR ---------------------------- */
function computeSelectionScreenAnchor(){
  if(!Editor.camera || !Editor.renderer || typeof THREE==='undefined') return null;
  let meshes;
  if(Editor.selectedIsStructure && Editor.structureMesh) meshes=[Editor.structureMesh];
  else meshes = [...Editor.selectedIds].map(id=>Editor.objectMeshes[id]).filter(Boolean);
  if(!meshes.length) return null;
  const box = new THREE.Box3();
  let any=false;
  meshes.forEach(m=>{ box.expandByObject(m); any=true; });
  if(!any || box.isEmpty()) return null;
  const topCenter = new THREE.Vector3((box.min.x+box.max.x)/2, box.max.y, (box.min.z+box.max.z)/2);
  const proj = topCenter.clone().project(Editor.camera);
  const holder = $('#three-canvas-holder'); if(!holder) return null;
  const rect = holder.getBoundingClientRect();
  return {
    x:(proj.x*0.5+0.5)*rect.width,
    y:(1-(proj.y*0.5+0.5))*rect.height,
    behindCamera: proj.z>1,
    rectWidth:rect.width, rectHeight:rect.height,
  };
}
function positionFloatingToolbar(){
  const bar = $('#floating-toolbar'); if(!bar || bar.classList.contains('hidden')) return;
  const anchor = computeSelectionScreenAnchor();
  if(!anchor || anchor.behindCamera){ bar.style.opacity='0'; return; }
  bar.style.opacity='1';
  const barW = bar.offsetWidth||220, barH = bar.offsetHeight||40;
  const left = clamp(anchor.x-barW/2, 8, Math.max(8,anchor.rectWidth-barW-8));
  const top = clamp(anchor.y-barH-16, 8, Math.max(8,anchor.rectHeight-barH-8));
  bar.style.left = left+'px';
  bar.style.top = top+'px';
}
function updateFloatingToolbar(){
  const bar = $('#floating-toolbar'); if(!bar) return;
  closeAlignMenu();
  if(Editor.selectedIsStructure || Editor.selectedIds.size===0 || !Editor.threeAvailable){
    bar.classList.add('hidden'); bar.innerHTML=''; return;
  }
  bar.classList.remove('hidden');
  bar.innerHTML='';
  const objs = [...Editor.selectedIds].map(findObjInRoom).filter(Boolean);
  if(!objs.length){ bar.classList.add('hidden'); return; }
  const multi = objs.length>1;
  const allLocked = objs.every(o=>o.locked);
  const anyHidden = objs.some(o=>o.hidden);
  const sameGroup = multi && objs.every(o=>o.groupId && o.groupId===objs[0].groupId);
  const ftBtn = (icon,title,fn)=>{ const b = el('button',{title, html:svgIcon(icon)}); b.addEventListener('click',fn); return b; };

  if(allLocked){
    bar.appendChild(el('span',{class:'ft-label'},(multi?objs.length+' items':'Item')+' locked'));
    bar.appendChild(ftBtn('unlock','Unlock (L)', toggleLockSelected));
    positionFloatingToolbar();
    return;
  }
  const toolSeg = el('div',{class:'ft-seg'});
  [['move','Move (1)'],['rotate','Rotate (2)'],['scale','Scale (3)']].forEach(([tool,title])=>{
    const b = el('button',{'data-tool':tool, class:tool===Editor.activeTool?'active':'', title, html:svgIcon(tool)});
    b.addEventListener('click',()=>setActiveTool(tool));
    toolSeg.appendChild(b);
  });
  bar.appendChild(toolSeg);
  bar.appendChild(el('div',{class:'ft-sep'}));
  bar.appendChild(ftBtn('align','Align & snap', openAlignMenu));
  bar.appendChild(ftBtn('copy','Duplicate (Ctrl+D)', duplicateSelected));
  bar.appendChild(ftBtn('lock','Lock (L)', toggleLockSelected));
  bar.appendChild(ftBtn(anyHidden?'eye':'eyeOff', anyHidden?'Show (H)':'Hide (H)', toggleHideSelected));
  if(multi) bar.appendChild(ftBtn(sameGroup?'ungroup':'group', sameGroup?'Ungroup (Ctrl+Shift+G)':'Group (Ctrl+G)', sameGroup?ungroupSelected:groupSelected));
  bar.appendChild(el('div',{class:'ft-sep'}));
  const delBtn = ftBtn('trash','Delete (Del)', deleteSelected); delBtn.classList.add('ft-danger');
  bar.appendChild(delBtn);
  positionFloatingToolbar();

function closeAlignMenu(){
