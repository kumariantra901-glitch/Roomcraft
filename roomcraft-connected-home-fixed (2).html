        'Editor.roomId':Editor.roomId, 'Editor.room===room':Editor.room===room, 'project.activeRoomId':Editor.project.activeRoomId});
      buildRoomScene(); refreshSidebarRoomsTab(); renderPropsPanel(); touchProjectNow();
      console.log('[RoomCraft] room persisted (immediate, not debounced)');
      toast('Room created — drag it into place on the 2D plan'); markOnboarding('room');
      setViewMode('2d'); // land the user right where the drag-to-place workflow happens
    }},'Create Room')
  ));
  scrim.appendChild(modal); document.body.appendChild(scrim);
  scrim.addEventListener('click',(e)=>{ if(e.target===scrim) scrim.remove(); });
}
// Positions `room` flush against `ref` on the given side, sharing the boundary edge
// exactly (no gap, no overlap) and centered along the perpendicular axis — this is what
// makes "Living Room → Bedroom" read as one connected home instead of two floating
// boxes. If the resulting spot would overlap a THIRD room, we back off and leave
// worldX/worldZ null so assignRoomLayoutPositions() falls back to its normal
// auto-flow placement instead of stacking two rooms on top of each other.
function placeRoomRelative(room, ref, side){
  if(!ref) return;
  let x, z;
  if(side==='right'){ x = ref.worldX + ref.width/2 + room.width/2; z = ref.worldZ; }
  else if(side==='left'){ x = ref.worldX - ref.width/2 - room.width/2; z = ref.worldZ; }
  else if(side==='below'){ x = ref.worldX; z = ref.worldZ + ref.length/2 + room.length/2; }
  else if(side==='above'){ x = ref.worldX; z = ref.worldZ - ref.length/2 - room.length/2; }
  else return;
  const candidate = {worldX:x, worldZ:z, width:room.width, length:room.length, floor:room.floor};
  const collides = Object.values(Editor.project.rooms).some(r=> r!==room && r.id!==ref.id && r.worldX!=null && roomsOverlapSameFloor(candidate, r));
  if(collides){ toast('That spot overlaps another room — placed it beside the layout instead','error'); return; }
  room.worldX = x; room.worldZ = z;
}
// Simple axis-aligned bounding-box overlap test between two rooms' world footprints,
// with a hair of tolerance so two rooms sharing a wall (touching exactly) don't count
// as overlapping each other.
function roomsOverlap(a,b){
  const EPS = 0.02;
  const aMinX=a.worldX-a.width/2, aMaxX=a.worldX+a.width/2, aMinZ=a.worldZ-a.length/2, aMaxZ=a.worldZ+a.length/2;
  const bMinX=b.worldX-b.width/2, bMaxX=b.worldX+b.width/2, bMinZ=b.worldZ-b.length/2, bMaxZ=b.worldZ+b.length/2;
  return (aMinX < bMaxX-EPS) && (aMaxX > bMinX+EPS) && (aMinZ < bMaxZ-EPS) && (aMaxZ > bMinZ+EPS);
}

/* ---------------------------- VERTICAL FLOOR / LEVEL SYSTEM ----------------------------
   Every room carries a `floor` number (0 = Ground Floor, 1 = First Floor, -1 = Basement,
   etc). Rooms on DIFFERENT floors are allowed to share the same worldX/worldZ footprint
   (e.g. a Bedroom directly above a Living Room) — collision/overlap logic below only
   compares rooms that are on the SAME floor, and the 3D scene offsets each floor's room
   group vertically by the accumulated height of every floor beneath it, so floors render
   as physically stacked levels instead of overlapping geometry. */
const DEFAULT_ROOM_HEIGHT = 2.7; // fallback room height in meters, matches sanitizeRoom()'s own default
// Same axis-aligned overlap test as roomsOverlap(), but first requires both rooms to be
// on the same floor — rooms on different floors are vertically separated and must never
// be treated as colliding no matter how their X/Z footprints line up.
function roomsOverlapSameFloor(a,b){
  const af = Number.isFinite(a.floor) ? a.floor : 0, bf = Number.isFinite(b.floor) ? b.floor : 0;
  if(af!==bf) return false;
  return roomsOverlap(a,b);
}
// Human-readable label for a floor number — used in the 2D floor selector, room list,
// and toolbar toasts. Falls back to an ordinal ("4th Floor") for anything past Third,
// and "Basement N" for anything below Basement (-1).
function floorLabel(f){
  f = Number.isFinite(f) ? f : 0;
  if(f===0) return 'Ground Floor';
  if(f===-1) return 'Basement';
  if(f<-1) return 'Basement '+Math.abs(f);
  const names = {1:'First Floor',2:'Second Floor',3:'Third Floor'};
  if(names[f]) return names[f];
  const s=['th','st','nd','rd'], v=f%100;
  return f+(s[(v-20)%10]||s[v]||s[0])+' Floor';
}
// Accumulated vertical (world Y) offset for the base of `floor`, computed from the
// tallest room already placed on each floor beneath it (so a project with an unusually
// tall Ground Floor room correctly pushes First Floor up further than the default room
// height would). Ground Floor (0) is always y=0; floors above stack upward, floors
// below (basements) stack downward. Uses the application's own room-height data rather
// than a hardcoded per-floor height, per the "use the actual defined height" requirement.
function floorBaseY(project, floor){
  floor = Number.isFinite(floor) ? floor : 0;
  if(floor===0) return 0;
  const heights = {};
  (project && project.roomOrder||[]).forEach(rid=>{
    const r = project.rooms[rid]; if(!r) return;
    const f = Number.isFinite(r.floor) ? r.floor : 0;
    heights[f] = Math.max(heights[f]||0, r.height||DEFAULT_ROOM_HEIGHT);
  });
  let y=0;
  if(floor>0){ for(let f=0; f<floor; f++) y += (heights[f]||DEFAULT_ROOM_HEIGHT); }
  else { for(let f=-1; f>=floor; f--) y -= (heights[f]||DEFAULT_ROOM_HEIGHT); }
  return y;
}
// Moves `room` onto the floor directly above (dir=1) or below (dir=-1) `ref`, preserving
// its X/Z footprint so it lands physically above/below `ref` in 3D. If that exact spot is
// already occupied by another room on the destination floor, the footprint is left
// unassigned so assignRoomLayoutPositions() finds it a free spot on that floor instead of
// silently overlapping — same "back off and auto-flow" pattern placeRoomRelative() uses
// for horizontal placement.
function placeRoomOnFloorRelative(room, ref, dir){
  if(!ref) return;
  const floor = (Number.isFinite(ref.floor)?ref.floor:0) + dir;
  const candidate = {worldX:ref.worldX, worldZ:ref.worldZ, width:room.width, length:room.length, floor};
  const collides = Object.values(Editor.project.rooms).some(r=> r!==room && r.id!==ref.id && r.worldX!=null && roomsOverlapSameFloor(candidate, r));
  room.floor = floor;
  if(collides){ room.worldX = null; room.worldZ = null; toast('That spot is already occupied on '+floorLabel(floor)+' — placed it beside the layout instead','error'); return; }
  room.worldX = ref.worldX; room.worldZ = ref.worldZ;
}

/* ---------------------------- UNDO / REDO ---------------------------- */
function snapshotRoom(){ return Editor.room ? JSON.parse(JSON.stringify(Editor.room)) : null; }
function pushHistory(){
  if(!Editor.room) return;
  Editor.history.push(snapshotRoom());
  if(Editor.history.length>40) Editor.history.shift();
  Editor.future = [];
  updateUndoRedoButtons();
}
function doUndo(){
  if(!Editor.history.length || !Editor.room) return;
  Editor.future.push(snapshotRoom());
  const prev = Editor.history.pop();
  Editor.project.rooms[Editor.room.id] = prev; Editor.room = prev;
  buildRoomScene(); renderPropsPanel(); touchProject(); updateUndoRedoButtons();
  // buildRoomScene() tears down and rebuilds every mesh from scratch, so any
  // overlap-highlight references from before the undo now point at disposed meshes —
  // without this, the 3D red-tint highlight silently goes stale (while the properties
  // panel's text warning, recomputed fresh each render, stays correct) until the next
  // drag or reselect.
  updateOverlapHighlight();
}
function doRedo(){
  if(!Editor.future.length || !Editor.room) return;
  Editor.history.push(snapshotRoom());
  const next = Editor.future.pop();
  Editor.project.rooms[Editor.room.id] = next; Editor.room = next;
  buildRoomScene(); renderPropsPanel(); touchProject(); updateUndoRedoButtons();
  updateOverlapHighlight();
}
function updateUndoRedoButtons(){
  const u = $('#undo-btn'), r = $('#redo-btn');
  if(u) u.disabled = Editor.history.length===0;
  if(r) r.disabled = Editor.future.length===0;
}

function handleImageUpload(file){
  if(!file.type.startsWith('image/')){ toast('Please upload an image file (PNG or JPG).','error'); return; }
  if(file.size > 8*1024*1024){ toast('Image is too large — please use a file under 8MB.','error'); return; }

  reader.onload = (e)=>{

// The "✨ Turn Image Into Furniture" flow. Three stages, shown as one evolving modal:
//   1) cutoutBackground() — client-side background removal + autocrop (always runs, instant).
//   2) classifyFurnitureWithAI() — sends the cutout to Claude for real recognition: what
//      catalog shape it matches, its real-world dimensions, and its color. Best-effort —
//      if it's unavailable or times out, the flow degrades gracefully to step 3b.
//   3a) If AI matched a catalog shape with reasonable confidence: offer to add it as real,
//       AI-sized 3D furniture (buildFurnitureMesh under the hood), editable before saving.
//   3b) Otherwise: fall back to the original flat 2.5D cutout billboard, still using
//       whatever the AI (or local color-extraction) could tell us about its color.
async function openImageToFurnitureModal(img, filename){
  const scrim = el('div',{class:'scrim'});
  const modal = el('div',{class:'modal', style:'width:420px'});
  modal.appendChild(el('div',{class:'modal-head'}, el('h2',null,'✨ Turn Image Into Furniture'), el('p',null,'Upload a photo — Design AI identifies the piece and builds it to scale.')));
  const body = el('div',{class:'modal-body', style:'align-items:center'});
  const stage = el('div',{style:'width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0'});
  const stepLabel = el('div',{style:'font-size:12.5px;color:var(--text-dim)'},'Removing background…');
  const spinner = el('div',{style:'width:36px;height:36px;border-radius:50%;border:3px solid var(--panel-3);border-top-color:var(--brass);animation:spin .8s linear infinite'});
  spinKeyframesStyle();
  stage.appendChild(spinner); stage.appendChild(stepLabel);
  body.appendChild(stage);
  modal.appendChild(body);
  const foot = el('div',{class:'modal-foot'}, el('button',{class:'btn',onclick:cancel},'Cancel'));
  modal.appendChild(foot);

  let cancelled = false;
  function cancel(){ cancelled = true; scrim.remove(); }
  scrim.addEventListener('click',(e)=>{ if(e.target===scrim) cancel(); });

  // Stage 1: background removal (fast, local, always succeeds — falls back to the
  // uncropped image if the flood fill can't find a clean background to remove).
  await new Promise(r=>setTimeout(r,220)); // brief pause so the step doesn't flash by unreadably
  if(cancelled) return;
  let cutout;
  try{ cutout = cutoutBackground(img); }
  catch(err){ console.error(err); if(!cancelled) scrim.remove(); toast('Could not process that image — try a different file.','error'); return; }

  // Stage 2: AI recognition. Shown as its own step since it's the part that takes real
  // time (a network round-trip) and can fail — the person should see what's happening
  // rather than staring at a generic spinner that might just hang.
  stepLabel.textContent = 'Consulting Design AI…';

  if(cancelled) return;

  // Stage 3: real AI 3D reconstruction — build actual volumetric geometry from the
  // photo's own silhouette. Independent of catalog matching (stage 2 above), so this is
  // attempted even when the AI couldn't confidently match a catalog shape. Uses the AI's

  if(cancelled) return;

// Robust-ish browser-only background removal: BFS flood-fills transparency inward from
// every border pixel rather than trusting a single sampled corner, so it copes with soft
// gradients and slightly uneven studio backdrops, not just flat single-color ones. Edge
// pixels get a partial-alpha feather instead of a hard cutoff, and the result is
// auto-cropped to the subject's bounding box so the asset's aspect ratio reflects the
// furniture itself rather than however much blank background padding it started with.
function cutoutBackground(img){
  const MAXDIM = 640;
  const scale = Math.min(1, MAXDIM/Math.max(img.width,img.height));
  const w = Math.max(1,Math.round(img.width*scale)), h = Math.max(1,Math.round(img.height*scale));
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d');
  ctx.drawImage(img,0,0,w,h);
  const imgData = ctx.getImageData(0,0,w,h);
  const px = imgData.data;
  const n = w*h;
  const isBg = new Uint8Array(n);
  const visited = new Uint8Array(n);
  const TOL = 26; // per-step color-distance tolerance between neighboring pixels during the flood fill
  const queue = new Int32Array(n);
  let qh=0, qt=0;
  const pushSeed = (idx)=>{ if(!visited[idx]){ visited[idx]=1; isBg[idx]=1; queue[qt++]=idx; } };
  for(let x=0;x<w;x++){ pushSeed(x); pushSeed((h-1)*w+x); }
  for(let y=0;y<h;y++){ pushSeed(y*w); pushSeed(y*w+w-1); }
  const colorAt = (idx)=>{ const i=idx*4; return [px[i],px[i+1],px[i+2]]; };
  while(qh<qt){
    const idx = queue[qh++];
    const x = idx % w, y = (idx / w) | 0;
    const [r,g,b] = colorAt(idx);
    const neighbors = [];
    if(x>0) neighbors.push(idx-1);
    if(x<w-1) neighbors.push(idx+1);
    if(y>0) neighbors.push(idx-w);
    if(y<h-1) neighbors.push(idx+w);
    for(const nb of neighbors){
      if(visited[nb]) continue;
      const [nr,ng,nb2] = colorAt(nb);
      const dist = Math.sqrt((nr-r)*(nr-r)+(ng-g)*(ng-g)+(nb2-b)*(nb2-b));
      visited[nb]=1;
      if(dist < TOL){ isBg[nb]=1; queue[qt++]=nb; }
    }
  }
  let fgCount=0;
  for(let i=0;i<n;i++) if(!isBg[i]) fgCount++;
  // if almost nothing survived as foreground, this probably isn't a clean product-style
  // photo (e.g. a busy real-room photo) — better to keep the whole image than cut it to nothing.
  const skipCutout = fgCount < n*0.02;
  let minX=w,minY=h,maxX=-1,maxY=-1;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const idx=y*w+x;
      const bg = !skipCutout && isBg[idx];
      const alphaIdx = idx*4+3;
      if(bg){ px[alphaIdx]=0; continue; }
      if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
      if(!skipCutout){
        // feather: foreground pixels touching background get a softer edge instead of a hard cutoff
        const nIdxs = [idx-1,idx+1,idx-w,idx+w];
        let touchesBg=false;
        for(const nb of nIdxs){ if(nb>=0 && nb<n && isBg[nb]){ touchesBg=true; break; } }
        if(touchesBg) px[alphaIdx] = 165;
      }
    }
  }
  ctx.putImageData(imgData,0,0);
  if(maxX<minX || maxY<minY){ minX=0;minY=0;maxX=w-1;maxY=h-1; }
  const pad = 2;
  const cx0 = Math.max(0,minX-pad), cy0 = Math.max(0,minY-pad);
  const cw = Math.min(w,maxX+pad+1)-cx0, ch = Math.min(h,maxY+pad+1)-cy0;
  const cropped = document.createElement('canvas'); cropped.width=cw; cropped.height=ch;
  cropped.getContext('2d').drawImage(c, cx0,cy0,cw,ch, 0,0,cw,ch);
  return { dataURL: cropped.toDataURL('image/png'), width:cw, height:ch, aspect: cw/ch, dominantColor: dominantForegroundColor(imgData,w,isBg,skipCutout), skipCutout };
}
// Cheap dominant-color estimate over the (non-background) foreground pixels, used as an
// immediate color hint even before/without an AI response — quantizes to a coarse RGB
// grid and returns the most common bucket's average color.
function dominantForegroundColor(imgData, w, isBg, skipCutout){
  const px = imgData.data;
  const buckets = new Map();
  for(let i=0;i<px.length;i+=4){
    const idx = i/4;
    if(!skipCutout && isBg[idx]) continue;
    if(px[i+3]<40) continue;
    const r=px[i],g=px[i+1],b=px[i+2];
    // skip near-white/near-black pixels — usually studio backdrop remnants or deep shadow, not the item's true color
    const lum = 0.299*r+0.587*g+0.114*b;
    if(lum>245 || lum<12) continue;
    const key = (r>>4)+','+(g>>4)+','+(b>>4);
    const bucket = buckets.get(key) || {r:0,g:0,b:0,count:0};
    bucket.r+=r; bucket.g+=g; bucket.b+=b; bucket.count++;
    buckets.set(key,bucket);
  }
  let best=null;
  buckets.forEach(b=>{ if(!best || b.count>best.count) best=b; });
  if(!best) return '#8a97a8';
  const toHex = v=>Math.round(v).toString(16).padStart(2,'0');
  return '#'+toHex(best.r/best.count)+toHex(best.g/best.count)+toHex(best.b/best.count);
}
/* ---------------------------- IMAGE -> REAL 3D RECONSTRUCTION ----------------------------
   Builds an actual volumetric GLB-exportable mesh from the uploaded photo's own silhouette,
   instead of picking a stock catalog shape (that's what the 'parametric' kind below still
   does, as the fallback). Pipeline, all client-side and synchronous-fast:
     1) re-rasterize the (already background-removed) cutout at a small working resolution
        and threshold its alpha channel into a binary foreground mask.
     2) keep only the largest connected foreground region (drops stray alpha noise).
     3) compute a distance transform of the mask — for every foreground pixel, its distance
        (in pixels) to the nearest background pixel. This is the key upgrade: it's a
        genuine, per-pixel measure of local silhouette *thickness* (a chair leg reads
        thin, a seat cushion reads thick), not just a flat outline.
     4) "inflate" that thickness field into a real depth profile — shaped with a gamma
        curve so the middle of each part reads as a rounded volume rather than a sharp
        cone — and sample it on a coarse quad grid to build a front bulge surface and a
        mirrored back bulge surface. Depth tapers smoothly to exactly zero at every
        silhouette edge, so the front and back surfaces meet there on their own: no flat
        front/back caps, no separate straight-walled sides, no "extruded cardboard" look.
        Grid cells with all four corners in background are skipped entirely, so genuine
        holes in the silhouette (the gap under a table between its legs, the negative
        space inside a chair's arm) become genuine holes in the mesh too.
     5) map it into real-world meters using the best available width/depth/height estimate,
        sitting flush on y=0 so it stands correctly on the floor.
   Any failure at any step (no usable silhouette, too little foreground, degenerate grid)
   returns null so the caller falls back to the AI-matched parametric catalog shape, and
   ultimately to the flat 2.5D cutout — this function must NEVER return a result that gets
   labeled as real 3D unless it actually built real volumetric geometry.
*/
const RECON_MASK_MAXDIM = 128;      // working resolution for silhouette + distance-field extraction
const RECON_ALPHA_THRESHOLD = 96;   // alpha value above which a pixel counts as foreground
const RECON_TARGET_GRID_VERTS = 850; // soft cap on mesh grid vertex count (bounds triangle count regardless of shape/aspect ratio)
const RECON_DEPTH_GAMMA = 0.55;     // <1 = rounder/fuller "plateaued" bulge instead of a sharp cone; 1 = linear cone
const RECON_BACK_DEPTH_RATIO = 0.82; // back surface bulges slightly less than the (photographed, known) front

// Loads a dataURL into an offscreen canvas at a small working size and returns its alpha
// channel as a binary Uint8Array mask (1 = foreground), plus the working w/h.
function reconGetAlphaMask(dataURL){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>{
      try{
        const scale = Math.min(1, RECON_MASK_MAXDIM/Math.max(img.width,img.height));
        const w = Math.max(1,Math.round(img.width*scale)), h = Math.max(1,Math.round(img.height*scale));
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        const ctx = c.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        const data = ctx.getImageData(0,0,w,h).data;
        const mask = new Uint8Array(w*h);
        for(let i=0;i<w*h;i++) mask[i] = data[i*4+3] >= RECON_ALPHA_THRESHOLD ? 1 : 0;
        resolve({mask, w, h});
      }catch(err){ reject(err); }
    };
    img.onerror = ()=>reject(new Error('image decode failed'));
    img.src = dataURL;
  });
}
// Keeps only the largest 4-connected foreground component — drops isolated alpha-noise
// specks left over from background removal so the distance field/mesh doesn't latch onto a stray pixel.
function reconLargestComponent(mask, w, h){
  const n=w*h;
  const labels = new Int32Array(n).fill(-1);
  let bestLabel=-1, bestSize=0, label=0;
  const stack = new Int32Array(n);
  for(let start=0; start<n; start++){
    if(mask[start]!==1 || labels[start]!==-1) continue;
    let sp=0; stack[sp++]=start; labels[start]=label;
    let size=0;
    while(sp>0){
      const idx = stack[--sp]; size++;
      const x = idx%w, y=(idx/w)|0;
      const nbs=[]; if(x>0) nbs.push(idx-1); if(x<w-1) nbs.push(idx+1); if(y>0) nbs.push(idx-w); if(y<h-1) nbs.push(idx+w);
      for(const nb of nbs){ if(mask[nb]===1 && labels[nb]===-1){ labels[nb]=label; stack[sp++]=nb; } }
    }
    if(size>bestSize){ bestSize=size; bestLabel=label; }
    label++;
  }
  if(bestLabel<0) return null;
  const out = new Uint8Array(n);
  for(let i=0;i<n;i++) if(labels[i]===bestLabel) out[i]=1;
  return {mask:out, size:bestSize};
}
// Approximate Euclidean distance transform (two-pass chamfer, 1 / √2 weights) — for every
// foreground pixel, its distance in pixels to the nearest background pixel. This is what
// turns a flat outline into real per-part thickness: thin regions of the silhouette (chair
// legs, armrests) come out with a small distance/thin bulge, broad regions (a seat cushion,
// a sofa back) come out thick — instead of every part of the object getting identical depth.
function reconDistanceTransform(mask, w, h){
  const n = w*h;
  const INF = 1e6;
  const dist = new Float32Array(n);
  for(let i=0;i<n;i++) dist[i] = mask[i] ? INF : 0;
  const D1=1, D2=Math.SQRT2;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const idx=y*w+x; if(!mask[idx]) continue;
      let d = dist[idx];
      if(x>0) d = Math.min(d, dist[idx-1]+D1);
      if(y>0) d = Math.min(d, dist[idx-w]+D1);
      if(x>0 && y>0) d = Math.min(d, dist[idx-w-1]+D2);
      if(x<w-1 && y>0) d = Math.min(d, dist[idx-w+1]+D2);
      dist[idx]=d;
    }
  }
  for(let y=h-1;y>=0;y--){
    for(let x=w-1;x>=0;x--){
      const idx=y*w+x; if(!mask[idx]) continue;
      let d = dist[idx];
      if(x<w-1) d = Math.min(d, dist[idx+1]+D1);
      if(y<h-1) d = Math.min(d, dist[idx+w]+D1);
      if(x<w-1 && y<h-1) d = Math.min(d, dist[idx+w+1]+D2);
      if(x>0 && y<h-1) d = Math.min(d, dist[idx+w-1]+D2);
      dist[idx]=d;
    }
  }
  return dist;
}
// Builds the actual inflated grid mesh (positions + uvs, front/back split) from the mask +
// distance field. Returns null if the grid degenerates (shape too small/thin to sample).
function reconBuildInflatedGeometry(mask, dist, w, h, dims){
  let dMax = 0;
  for(let i=0;i<w*h;i++) if(mask[i] && dist[i]>dMax) dMax = dist[i];
  if(dMax <= 0.5) return null; // nothing with any real thickness (e.g. a single-pixel-wide sliver)

  const stride = Math.max(1, Math.ceil(Math.sqrt((w*h)/RECON_TARGET_GRID_VERTS)));
  const gw = Math.floor((w-1)/stride)+1, gh = Math.floor((h-1)/stride)+1;
  if(gw<4 || gh<4) return null;

  const wM = Math.min(4, Math.max(0.05, dims.w||0.6));
  const hM = Math.min(3, Math.max(0.05, dims.h||0.75));
  const dM = Math.min(3, Math.max(0.05, dims.d||Math.min(wM,hM)*0.55));
  const halfD = dM/2;

  const inMask = new Uint8Array(gw*gh);
  const localX = new Float32Array(gw*gh), localY = new Float32Array(gw*gh);
  const depthFrac = new Float32Array(gw*gh);
  const uArr = new Float32Array(gw*gh), vArr = new Float32Array(gw*gh);
  for(let gy=0; gy<gh; gy++){
    for(let gx=0; gx<gw; gx++){
      const px = Math.min(w-1, gx*stride), py = Math.min(h-1, gy*stride);
      const idx = py*w+px, gi = gy*gw+gx;
      const fg = mask[idx]===1;
      inMask[gi] = fg?1:0;
      const dNorm = fg ? Math.min(1, dist[idx]/dMax) : 0;
      depthFrac[gi] = Math.pow(dNorm, RECON_DEPTH_GAMMA);
      localX[gi] = (px/w - 0.5) * wM;
      localY[gi] = (1 - py/h) * hM; // py=0 (top of photo) -> top of object; py=h -> floor (y=0), matches how the mesh is expected to sit
      uArr[gi] = px/w; vArr[gi] = 1 - py/h;
    }
  }

  const positions=[], uvs=[];
  const pushTri = (arr, ga,gb,gc, front)=>{
    [ga,gb,gc].forEach(gi=>{
      const z = (front?1:-1) * halfD * depthFrac[gi] * (front?1:RECON_BACK_DEPTH_RATIO);
      arr.push(localX[gi], localY[gi], z);
    });
  };
  let anyCell = false;
  for(let gy=0; gy<gh-1; gy++){
    for(let gx=0; gx<gw-1; gx++){
      const c00=gy*gw+gx, c10=gy*gw+gx+1, c01=(gy+1)*gw+gx, c11=(gy+1)*gw+gx+1;
      if(!(inMask[c00]||inMask[c10]||inMask[c01]||inMask[c11])) continue; // fully outside the silhouette — no geometry here at all (this is what gives holes/gaps their real openings)
      anyCell = true;
      // front bulge (+Z), CCW when viewed from +Z so normals point outward toward the camera/photo side
      pushTri(positions, c01,c11,c10, true); uvs.push(uArr[c01],vArr[c01], uArr[c11],vArr[c11], uArr[c10],vArr[c10]);
      pushTri(positions, c01,c10,c00, true); uvs.push(uArr[c01],vArr[c01], uArr[c10],vArr[c10], uArr[c00],vArr[c00]);
    }
  }
  if(!anyCell) return null;
  const frontVertCount = positions.length/3;
  for(let gy=0; gy<gh-1; gy++){
    for(let gx=0; gx<gw-1; gx++){
      const c00=gy*gw+gx, c10=gy*gw+gx+1, c01=(gy+1)*gw+gx, c11=(gy+1)*gw+gx+1;
      if(!(inMask[c00]||inMask[c10]||inMask[c01]||inMask[c11])) continue;
      // back bulge (-Z) — reversed winding vs. front so normals point outward the other way
      pushTri(positions, c01,c10,c11, false); uvs.push(0,0,0,0,0,0);
      pushTri(positions, c01,c00,c10, false); uvs.push(0,0,0,0,0,0);
    }
  }
  const bodyVertCount = positions.length/3 - frontVertCount;
  const totalTris = positions.length/9;
  if(totalTris > 3800) return null; // sanity cap — keeps every reconstruction well under the storage/GLB-export vertex budget

  return { positions, uvs, frontVertCount, bodyVertCount, dims:{w:wM,d:dM,h:hM}, vertexCount:positions.length/3, triangleCount:totalTris };
}
// Full pipeline: silhouette -> volumetric geometry data, in real-world meters, ready to
// store on a 'reconstructed3d' custom asset and hand straight to a THREE.BufferGeometry.
// Returns null (never a fake/half-built result) on any failure.
async function reconstructFurniture3D(cutout, dims){
  if(!cutout || cutout.skipCutout) return null; // background wasn't actually isolated — no real silhouette to build from
  try{
    const {mask,w,h} = await reconGetAlphaMask(cutout.dataURL);
    const comp = reconLargestComponent(mask,w,h);
    if(!comp || comp.size < (w*h*0.02)) return null;
    // if the surviving silhouette is basically the whole frame, background removal didn't
    // isolate a real subject shape — inflating a rectangle would be a fake-looking blob,
    // not a genuine reconstruction, so bail to the parametric/2.5D fallbacks instead.
    let minX=w,minY=h,maxX=-1,maxY=-1;
    for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(comp.mask[y*w+x]){ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
    if(maxX<minX) return null;
    if((maxX-minX) > w*0.985 && (maxY-minY) > h*0.985) return null;

    const dist = reconDistanceTransform(comp.mask, w, h);
    const built = reconBuildInflatedGeometry(comp.mask, dist, w, h, dims);
    if(!built) return null;

    return {
      positions: built.positions, uvs: built.uvs,
      frontVertCount: built.frontVertCount, bodyVertCount: built.bodyVertCount,
      bodyColor: (dims.color) || cutout.dominantColor || '#8a97a8',
      dims: built.dims,
      vertexCount: built.vertexCount,
      triangleCount: built.triangleCount,
    };
  }catch(err){
    console.warn('3D reconstruction failed, will fall back:', err);
    return null;
  }
}
// Builds a real THREE.BufferGeometry (non-indexed, per-face-shaded) from stored
// reconstruction data — used both right after generating it and when restoring a saved
// project. Kept separate from reconstructFurniture3D so save/restore never has to redo
// image processing, only geometry assembly.
function reconBuildGeometry(geomData){
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(geomData.positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(geomData.uvs, 2));
  const total = geomData.positions.length/3;
  geo.addGroup(0, geomData.frontVertCount, 0);
  geo.addGroup(geomData.frontVertCount, total-geomData.frontVertCount, 1);
  geo.computeVertexNormals();
  geo.computeBoundingBox();
  return geo;
}

// Real furniture recognition via Claude's vision. Calls this app's own backend at
// /api/classify-furniture — same as Copilot, never api.anthropic.com directly; the backend
// (server.js) holds the real key server-side. Best-effort: any failure (backend not running,
// offline, timeout, malformed response) resolves to null so the caller falls back to the plain
// 2.5D cutout rather than blocking the feature entirely.
async function classifyFurnitureWithAI(cutoutDataURL){
  const catalogLines = AI_MATCHABLE_ITEMS.map(it=>
    it.id+' — "'+it.name+'" ('+it.groupName+'), typical '+it.w+'m W × '+it.d+'m D × '+it.h+'m H'
  ).join('\n');
  const prompt = 'You are the furniture-recognition system for a 3D interior design app. Look at the attached photo (background already removed) and identify the piece of furniture.\n\n'
    + 'Catalog of buildable 3D shapes (id — name (category), typical dimensions):\n' + catalogLines + '\n\n'
    + 'Respond with ONLY a single JSON object, no markdown fences, no other text:\n'
    + '{"matchId": one catalog id above that best matches this item\'s shape category (pick the closest even if imperfect; use null only if nothing in the catalog is remotely similar), '
    + '"name": a short human-readable name for this specific item (max 4 words), '
    + '"width_m": your best estimate of its real-world width in meters, '
    + '"depth_m": your best estimate of its real-world depth (front-to-back) in meters, '
    + '"height_m": your best estimate of its real-world height in meters, '
    + '"color_hex": its dominant color as a 6-digit hex string like "#8a97a8", '
    + '"confidence": a number from 0 to 1 for how confident you are in matchId, '
    + '"reasoning": one short phrase, under 12 words}\n'
    + 'Base dimension estimates on typical real-world proportions for this type of object, not on the pixel size of the cutout.';
  const base64 = (cutoutDataURL.split(',')[1]) || '';
  if(!base64) return null;
  const controller = (typeof AbortController!=='undefined') ? new AbortController() : null;
  const timeoutId = controller ? setTimeout(()=>controller.abort(), 25000) : null;
  try{
    const response = await fetch((COPILOT_API_BASE||'') + '/api/classify-furniture', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      signal: controller ? controller.signal : undefined,
      body: JSON.stringify({ imageBase64: base64, prompt }),
    });
    if(timeoutId) clearTimeout(timeoutId);
    if(!response.ok) throw new Error('AI backend returned status '+response.status);
    const data = await response.json();
    const textBlock = (data.content||[]).find(b=>b && b.type==='text' && typeof b.text==='string');
    if(!textBlock) throw new Error('No text content in AI response');
    const jsonStr = textBlock.text.trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
    const parsed = JSON.parse(jsonStr);
    const clampNum = (v,def,min,max)=>{ const num=Number(v); return Number.isFinite(num) ? Math.min(max,Math.max(min,num)) : def; };
    const matchDef = (typeof parsed.matchId==='string') ? findFurnitureDef(parsed.matchId) : null;
    const matchId = (matchDef && !matchDef.struct) ? parsed.matchId : null;
    return {
      matchId,
      name: (typeof parsed.name==='string' && parsed.name.trim()) ? parsed.name.trim().slice(0,40) : null,
      dims: { w:clampNum(parsed.width_m,0.5,0.05,4), d:clampNum(parsed.depth_m,0.5,0.05,4), h:clampNum(parsed.height_m,0.5,0.02,3) },
      color: (typeof parsed.color_hex==='string' && /^#[0-9a-fA-F]{6}$/.test(parsed.color_hex)) ? parsed.color_hex : null,
      confidence: clampNum(parsed.confidence,0,0,1),
      reasoning: typeof parsed.reasoning==='string' ? parsed.reasoning.slice(0,120) : '',
    };
  }catch(err){
    if(timeoutId) clearTimeout(timeoutId);
    console.warn('Design AI furniture classification unavailable:', err);
    return null;
  }
}
function buildCustomAssetMesh(o){
  const asset = Store.data.customAssets[o.assetId];
  const g = new THREE.Group();
  if(!asset){
    const fallback = box(0.5,0.5,0.5,'#888'); g.add(fallback); g.userData.isCustomAsset=true; return g;
  }
  if(asset.kind==='reconstructed3d'){
    // Real AI 3D reconstruction: actual volumetric geometry built from the uploaded
    // photo's own silhouette (see reconstructFurniture3D), not a stock catalog shape and
    // not a flat billboard. Rebuilt from the stored position/uv arrays every time an
    // instance is created — geometry itself is stored on the asset (see
    // sanitizeCustomAsset), not regenerated from the image, so save/restore is exact.
    if(!asset.geometry){
      const fallback = box(0.5,0.5,0.5,'#888'); g.add(fallback); g.userData.isCustomAsset=true; return g;
    }
    const geo = reconBuildGeometry(asset.geometry);
    const tex = new THREE.TextureLoader().load(asset.dataURL);
    tex.encoding = THREE.sRGBEncoding;
    const frontMat = new THREE.MeshStandardMaterial({map:tex, transparent:true, alphaTest:0.05, side:THREE.DoubleSide, roughness:0.85});
    const bodyMat = new THREE.MeshStandardMaterial({color:(asset.geometry.bodyColor||'#8a97a8'), side:THREE.DoubleSide, roughness:0.9});
    const mesh = new THREE.Mesh(geo, [frontMat, bodyMat]);
    // sit flush on the floor: geometry is already built with its bottom at local y=0
    // (see reconstructFurniture3D's toLocal mapping), so no extra offset needed here.
    mesh.castShadow = true; mesh.receiveShadow = true;
    g.add(mesh);
    g.userData.isCustomAsset = true;
    g.userData.isReconstructedAsset = true;
    return g;
  }
  if(asset.kind==='parametric'){
    // AI-matched real 3D furniture: reuse the same parametric catalog builder as the
    // regular furniture library, but with the AI's estimated real-world dimensions and
    // color (or this instance's own color override) instead of the catalog default —
    // so it actually casts shadows, reads from every angle, and collides/measures like
    // a real piece of furniture rather than a flat photo cutout.
    const catalogDef = findFurnitureDef(asset.matchType) || {};
    const dims = asset.dims || {w:0.5,d:0.5,h:0.5};
    const color = o.color || asset.color || catalogDef.color || '#8a97a8';
    const inner = buildFurnitureMesh({...catalogDef, id:asset.matchType, w:dims.w, d:dims.d, h:dims.h, color});
    g.add(inner);
    g.userData.isCustomAsset = true;
    g.userData.isParametricAsset = true;
    return g;
  }
  const h = 0.9; const w = h*(asset.aspect||1);
  const tex = new THREE.TextureLoader().load(asset.dataURL);
  tex.encoding = THREE.sRGBEncoding;
  const geo = new THREE.PlaneGeometry(w,h);
  const m = new THREE.MeshStandardMaterial({map:tex, transparent:true, alphaTest:0.15, side:THREE.DoubleSide, roughness:0.9});
  const plane = new THREE.Mesh(geo,m); plane.position.y = h/2; plane.castShadow=true; plane.receiveShadow=true;
  g.add(plane);
  g.userData.isCustomAsset = true;
  return g;
}
function addCustomAssetToRoom(assetId, worldPos){
  if(!Editor.room){ toast('Create a room first','error'); return; }
  const asset = Store.data.customAssets[assetId]; if(!asset) return;
  pushHistory();
  const pos = worldPos || {x:0,y:0,z:0};
  const o = { id:uid('obj'), category:'custom', assetId, position:{x:pos.x,y:0,z:pos.z}, rotation:{x:0,y:0,z:0}, scale:{x:1,y:1,z:1} };
  if(asset.kind==='parametric') o.color = asset.color; // seed the per-instance override so the props-panel swatch starts in sync
  Editor.room.objects.push(o);
  instantiateObject(o);
  selectObject(o.id);
  touchProject(); updateEmptyHint();
  const kindLabel = asset.kind==='reconstructed3d' ? ' added (real reconstructed 3D model)' : asset.kind==='parametric' ? ' added (AI-matched 3D furniture)' : ' added (2.5D asset)';
  toast(asset.name+kindLabel);
}

/* ---------------------------- COPILOT PANEL (AI-powered, grounded in live room state) ----------------------------
   The panel calls the AI through this app's OWN backend at /api/copilot — never api.anthropic.com directly.
   The backend (server.js, shipped alongside this file) holds the real Anthropic API key server-side and
   proxies the request. The client builds a system prompt describing this room's actual dimensions, colors,
   lighting and furniture, plus the exact set of actions it's allowed to take, and sends that (no secrets) to
   /api/copilot. The model replies with structured JSON (a message + optional actions) which we validate
   against the real catalog/presets and then execute against the real editor state — so "apply a Scandinavian
   style" or "make it more spacious" genuinely changes the room, grounded in its real numbers, rather than
   just describing what to do. If the backend/API is unavailable, we fall back to the original deterministic
   rule-set so the panel still works offline. See README.md for how to run the backend. */
let copilotHistory = []; // {role:'user'|'assistant', content:string} — short rolling window for conversational context
let copilotBusy = false;
function buildCopilotPanel(){
  const panel = el('div',{id:'copilot-panel', class:'hidden'});

  ].forEach(p=>{
    const chip = el('button',{class:'sugg-chip', type:'button'}, p);
    // type:'button' stops it from ever behaving like a form submit; wrapped in try/catch so a
    // bug elsewhere in the app can never make a suggestion click silently do nothing.
    chip.addEventListener('click',(e)=>{
      e.preventDefault();

    });

  });

  const inputRow = el('div',{class:'copilot-input-row'});

  const send = ()=>{

  };
  input.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); send(); } });
  sendBtn.addEventListener('click',(e)=>{ e.preventDefault(); send(); });
  inputRow.appendChild(input);
  inputRow.appendChild(sendBtn);
  panel.appendChild(inputRow);
  return panel;
}
// Toggles the busy/loading affordance across every input surface of the panel: suggestion
// chips get dimmed + unclickable, the text input and send button are disabled, and the send
// button itself shows a spinner glyph — so there's always a visible sign a request is in
// flight, and no way to double-submit while one is pending.
function setCopilotBusyUI(busy){
  const chips = $('#copilot-chips'); if(chips) chips.classList.toggle('disabled', busy);
  const input = $('#copilot-input'); if(input) input.disabled = busy;
  const sendBtn = $('#copilot-send'); if(sendBtn){ sendBtn.disabled = busy; sendBtn.textContent = busy ? '…' : '➤'; }
}
// Small always-visible connection-status readout in the panel header: Idle / Sending request /
// Response received / API error / Parsing error / Timeout / Network error — per requirement #7,
// so a failure is never invisible even if a message bubble is missed. Also logs to console.
function setCopilotStatus(state, detail){
  const dot = $('#copilot-status-dot'); const label = $('#copilot-status-label');
  const map = {
    idle:       {text:'Idle', cls:''},
    sending:    {text:'Sending request…', cls:'busy'},
    received:   {text:'Response received', cls:'ok'},
    api_error:  {text:'API error', cls:'err'},
    parse_error:{text:'Parsing error', cls:'err'},
    timeout:    {text:'Timeout', cls:'err'},
    network_error:{text:'Network error', cls:'err'}
  };
  const m = map[state] || map.idle;
  if(dot) dot.className = 'cs-dot '+m.cls;
  if(label) label.textContent = m.text;
  if(state==='idle' || state==='sending' || state==='received'){ console.info('[Copilot]', m.text, detail||''); }
  else { console.error('[Copilot]', m.text, detail||''); }
}
function toggleCopilot(){
  Editor.copilotOpen = !Editor.copilotOpen;
  if(Editor.copilotOpen) markOnboarding('copilot');
  $('#copilot-panel').classList.toggle('hidden', !Editor.copilotOpen);

  }

function copilotSay(text, isUser){
  const msgs = $('#copilot-msgs'); if(!msgs) return null;
  const bubble = el('div',{class:'msg '+(isUser?'user':'bot')}, text);
  msgs.appendChild(bubble);
  msgs.scrollTop = msgs.scrollHeight;
  return bubble;
}
// Typed error used everywhere in the AI pipeline below so copilotAsk can show the *exact*
// real reason a request failed (HTTP status + response body, network failure, timeout, or a
// parsing problem) rather than a single generic "couldn't reach AI" message. Per requirement:
// never hide or replace a real failure with a vague one.
function CopilotError(kind, message){
  const e = new Error(message);
  e.name = 'CopilotError';
  e.kind = kind; // 'timeout' | 'network_error' | 'api_error' | 'parse_error'
  return e;
}
async function copilotAsk(text){
  if(copilotBusy){
    // Busy is also enforced by disabling the chips/input/send button in the UI, but the guard
    // stays here too (e.g. Enter key fired twice) — and it must never fail silently, so the
    // user always gets some acknowledgement rather than a click that appears to do nothing.
    copilotSay("Still working on your last question — one sec.");
    return;
  }
  // Make sure the panel is actually open and scrolled to the new messages, in case this was
  // triggered by something other than a direct click on a visible chip/input.
  if(!Editor.copilotOpen){ Editor.copilotOpen = true; $('#copilot-panel')?.classList.remove('hidden'); $('#copilot-toggle')?.classList.add('on'); }
  copilotSay(text, true);
  if(!Editor.room){
    copilotSay("Create a room first, then I can give you dimension-aware suggestions.");
    return;
  }
  copilotBusy = true;
  setCopilotBusyUI(true);
  setCopilotStatus('sending', text);
  const thinking = copilotSay('…thinking');
  if(thinking) thinking.classList.add('thinking');
  try{
    const reply = await copilotCallAI(text);
    if(thinking) thinking.remove();
    setCopilotStatus('received', reply);
    copilotSay(reply.message || "I'm not sure how to help with that — try asking about layout, colors, lighting or a style.");
    if(Array.isArray(reply.actions) && reply.actions.length){
      let applied = 0;
      reply.actions.forEach(a=>{
        try{ if(executeCopilotAction(a)) applied++; }
        catch(e){ console.error('[Copilot] action threw', a, e); }
      });
      if(applied < reply.actions.length){
        const skipped = reply.actions.length - applied;
        copilotSay(`(Note: ${skipped} of ${reply.actions.length} requested change${reply.actions.length>1?'s':''} couldn't be applied — the value wasn't recognized in this room's catalog/presets, so ${skipped>1?'they were':'it was'} skipped rather than risk a bad edit.)`);
      }
    }
    copilotHistory.push({role:'user', content:text});
    copilotHistory.push({role:'assistant', content: reply.message || ''});
    if(copilotHistory.length>16) copilotHistory = copilotHistory.slice(-16); // keep a short rolling window
  }catch(err){
    // Guaranteed, clearly-marked failure state showing the REAL reason (HTTP status + body,
    // network error, or timeout) — never a generic stand-in — followed by the deterministic
    // offline fallback so the user still gets a useful answer even when the AI is unreachable.
    if(thinking) thinking.remove();
    const kind = (err && err.kind) || (err && err.name==='AbortError' ? 'timeout' : 'network_error');
    setCopilotStatus(kind, err && err.message);
    let reason;
    if(kind==='timeout'){
      reason = `The AI request timed out after ${Math.round((err.timeoutMs||20000)/1000)}s with no response.`;
    } else if(kind==='api_error'){
      reason = err.message; // already contains "Copilot backend error <status> — <body>"
      if(/\b401\b/.test(reason) || /\b403\b/.test(reason) || /\b500\b/.test(reason)){
        reason += ' This means the backend (server.js) could not authenticate to Anthropic — check that ANTHROPIC_API_KEY is set in its environment and restart the server. See README.md.';
      }
    } else if(kind==='network_error'){
      reason = 'A network-level failure prevented the request from reaching this app\'s backend'+(err&&err.message?(' ('+err.message+')'):'')+'. This app must be served by server.js (run `npm start`) — it will not work if this HTML file is opened directly as file:// or if the backend process is not running. See README.md.';
    } else {
      reason = (err && err.message) || 'Unknown error.';
    }
    const bubble = copilotSay('⚠ AI request failed: '+reason);
    if(bubble) bubble.classList.add('error');
    copilotSay('Showing a built-in offline tip instead so you\'re not stuck:');
    try{
      copilotSay(copilotRespondFallback(text));
    }catch(fallbackErr){
      console.error('[Copilot] fallback responder also threw', fallbackErr);
      copilotSay("I couldn't generate a suggestion for that — please try rephrasing or ask about layout, colors, lighting, or a style.");
    }
  }finally{
    copilotBusy = false;
    setCopilotBusyUI(false);
    if(!copilotBusy) setTimeout(()=>{ if(!copilotBusy) setCopilotStatus('idle'); }, 4000);
  }
}
/* Builds a fresh, ground-truth description of the room every call — dimensions, current
   colors/lighting, placed furniture, and the exact catalog/preset vocabulary the model is
   allowed to use — so suggestions and actions are always anchored to what's really in the scene. */
function copilotBuildContext(){
  const room = Editor.room;
  const wft = fmtLen(room.width, room.unit), lft = fmtLen(room.length, room.unit), hft = fmtLen(room.height, room.unit);
  const objectsSummary = room.objects.map(o=>{
    const def = findFurnitureDef(o.type);
    return (def?def.name:o.type)+' at ('+o.position.x.toFixed(1)+', '+o.position.z.toFixed(1)+')';
  }).join('; ') || 'empty — no furniture placed yet';
  const catalog = FURNITURE_LIBRARY.map(g=> g.cat+': '+g.items.filter(i=>!i.struct).map(i=>i.id).join(', ')).join('\n');
  const styles = Object.entries(STYLE_PRESETS).map(([k,v])=> k+' ('+v.desc+')').join(', ');
  return `Current room: "${room.name}", type ${room.type}, ${wft} × ${lft}, ${hft} ceiling height (${(room.width*room.length).toFixed(1)} m² floor area).
Wall color: ${room.wallColor}. Floor color: ${room.floorColor}.
Lighting: mode=${room.lighting.mode}, ambient=${room.lighting.ambientIntensity}, directional=${room.lighting.dirIntensity}, point lights ${room.lighting.pointLightsOn!==false?'on':'off'}.
Current furniture: ${objectsSummary}.

Available furniture catalog IDs by category (use these exact IDs, never invent one):
${catalog}

Available style presets: ${styles}
Available wall color presets: ${WALL_PRESETS.map(w=>w.name+' ('+w.color+')').join(', ')}
Available floor color presets: ${FLOOR_PRESETS.map(f=>f.name+' ('+f.color+')').join(', ')}`;
}
function copilotSystemPrompt(){
  return `You are Design Copilot, an interior design assistant embedded in RoomCraft, a 3D room planner. Give specific, grounded advice using the room's real dimensions and current contents below, and make actual changes in the app by returning actions when the user asks for or clearly implies a change.

${copilotBuildContext()}

Respond with ONLY a single JSON object — no markdown code fences, no prose outside the JSON — in exactly this shape:
{"message": "<reply to the user, 1-4 sentences, warm and specific to this room's real numbers/colors>", "actions": [<zero or more action objects, only when actually warranted>]}

Valid action types (use only these; omit "actions" entirely, or use an empty array, for pure Q&A/advice):
{"type":"apply_style","style":"<one of the style preset keys above>"}
{"type":"suggest_layout"}
{"type":"set_wall_color","color":"<hex color, ideally one of the wall presets above>"}
{"type":"set_floor_color","color":"<hex color, ideally one of the floor presets above>"}
{"type":"adjust_lighting","mode":"day|evening|night","ambientIntensity":<number 0-1.5>,"dirIntensity":<number 0-2>}
{"type":"add_furniture","itemId":"<a valid catalog ID from above>","count":<integer 1-4>}

Rules:
- Only take actions the user actually asked for or clearly implied — don't apply a style just because they asked a question about it.
- Only use itemId/style/color values that appear in the lists above; never invent one.
- Keep "message" concise and specific to this room's real numbers — avoid generic design platitudes.
- If the request is unrelated to interior design, gently redirect back to the room, still as JSON.`;
}
/* Base URL for this app's OWN backend. Defaults to same-origin ('') so `/api/copilot` just works when
   this page is served BY server.js (the normal case — see README.md). If you ever host the static HTML
   separately from the backend (different origin/port), set window.COPILOT_API_BASE before this script
   runs, e.g. a script tag setting window.COPILOT_API_BASE='https://your-backend.example.com' — no API key
   goes here, ever, only the backend's URL. */
const COPILOT_API_BASE = (typeof window!=='undefined' && window.COPILOT_API_BASE) || '';
async function copilotCallAI(userText){
  // Hard timeout so a stalled/blocked connection (backend down, no network, a firewall silently
  // dropping the request, etc.) can never leave the UI stuck on "…thinking" forever — it always
  // resolves or fails within CALL_TIMEOUT_MS, which copilotAsk's catch block turns into a visible,
  // specific error + offline fallback.
  const CALL_TIMEOUT_MS = 20000;
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), CALL_TIMEOUT_MS);
  let res;
  try{
    // NOTE: this calls OUR OWN backend, never api.anthropic.com directly. The backend (server.js)
    // holds the real Anthropic API key server-side and forwards this request to Claude. No credential
    // of any kind lives in this HTML/JS — see README.md for how to run the backend.
    res = await fetch(COPILOT_API_BASE + '/api/copilot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: controller.signal,
      body: JSON.stringify({
        system: copilotSystemPrompt(),
        messages: [...copilotHistory, { role:'user', content:userText }]
      })
    });
  }catch(networkErr){
    if(networkErr && networkErr.name==='AbortError'){
      const e = CopilotError('timeout', 'Request aborted after '+CALL_TIMEOUT_MS+'ms with no response.');
      e.timeoutMs = CALL_TIMEOUT_MS;
      throw e;
    }
    throw CopilotError('network_error', (networkErr && networkErr.message) || String(networkErr));
  }finally{
    clearTimeout(timer);
  }
  if(!res.ok){
    let detail = '';
    try{ detail = (await res.text()).slice(0,400); }catch(_e){}
    throw CopilotError('api_error', 'Copilot backend error '+res.status+' ('+res.statusText+')'+(detail?(' — '+detail):''));
  }
  let data;
  try{ data = await res.json(); }
  catch(parseErr){ throw CopilotError('parse_error', 'Response body was not valid JSON: '+parseErr.message); }
  if(data && data.error){
    throw CopilotError('api_error', 'Copilot backend error — '+(typeof data.error==='string'?data.error:JSON.stringify(data.error)));
  }
  const raw = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
  if(!raw) throw CopilotError('api_error', 'Backend responded 200 OK but returned no text content: '+JSON.stringify(data).slice(0,300));
  const clean = raw.replace(/^```json\s*|^```\s*|```\s*$/gim,'').trim();
  try{ return JSON.parse(clean); }
  catch(e){
    console.warn('[Copilot] model reply was not valid JSON, showing raw text as the message', raw);
    return { message: raw, actions: [] };
  }
}
/* Executes one model-proposed action against the real room state. Every value is re-validated
   against the live catalog/presets before touching anything, so a malformed or hallucinated
   action is simply skipped rather than corrupting the room. Returns true if the action was
   recognized and applied, false if it was skipped (invalid/unknown type or value) — the caller
   uses this to tell the user when a requested change didn't actually happen. */
function executeCopilotAction(a){
  if(!a || !Editor.room || typeof a.type!=='string') return false;
  const room = Editor.room;
  const isHex = c => typeof c==='string' && /^#([0-9a-f]{3}){1,2}$/i.test(c);
  switch(a.type){
    case 'apply_style':
      if(STYLE_PRESETS[a.style]){ applyStyle(a.style); return true; }
      return false;
    case 'suggest_layout':
      suggestLayout();
      return true;
    case 'set_wall_color':
      if(isHex(a.color)){ pushHistory(); room.wallColor=a.color; buildRoomScene(); touchProject(); renderPropsPanel(); return true; }
      return false;
    case 'set_floor_color':
      if(isHex(a.color)){ pushHistory(); room.floorColor=a.color; buildRoomScene(); touchProject(); renderPropsPanel(); return true; }
      return false;
    case 'adjust_lighting':{
      const validMode = ['day','evening','night'].includes(a.mode);
      const validAmbient = typeof a.ambientIntensity==='number';
      const validDir = typeof a.dirIntensity==='number';
      if(!validMode && !validAmbient && !validDir) return false;
      pushHistory();
      if(validMode) room.lighting.mode = a.mode;
      if(validAmbient) room.lighting.ambientIntensity = clamp(a.ambientIntensity,0,1.5);
      if(validDir) room.lighting.dirIntensity = clamp(a.dirIntensity,0,2);
      applyLightingToScene(); renderPropsPanel(); touchProject();
      return true;
    }
    case 'add_furniture':
      if(findFurnitureDef(a.itemId)){
        const n = Math.max(1, Math.min(4, Number(a.count)||1));
        for(let i=0;i<n;i++){
          const jitterX = (Math.random()-0.5)*Math.min(room.width*0.4,2);
          const jitterZ = (Math.random()-0.5)*Math.min(room.length*0.4,2);
          addFurnitureToRoom(a.itemId, {x:jitterX,y:0,z:jitterZ});
        }
        return true;
      }
      return false;
    default:
      return false;
  }
}
/* Deterministic rule-based responder — kept only as an offline fallback if the API call fails. */
function copilotRespondFallback(q){
  const room = Editor.room;
  if(!room) return "Create a room first, then I can give you dimension-aware suggestions.";
  const ql = q.toLowerCase();
  const area = (room.width*room.length).toFixed(1);
  const wft = fmtLen(room.width, room.unit), lft = fmtLen(room.length, room.unit);

  if(/layout|arrange|sofa.*tv|tv.*sofa/.test(ql)){
    setTimeout(()=>{ suggestLayout(); }, 400);
    return `This room is ${wft} × ${lft} (${area} m²). I'll place the largest piece against the longest wall, keep a clear walking path of at least 0.9m, and float smaller pieces around it. Opening the layout suggestion now — you can Apply, Reject, or Try Another.`;
  }
  if(/spacious|bigger|larger/.test(ql)){
    return "To make the room feel more spacious: use a light wall color (try White or Warm White), a single large rug instead of several small ones, keep furniture legs visible (avoid skirted pieces), and mirror one wall to bounce light. I can apply a light Minimalist palette if you'd like — just say 'minimalist'.";
  }
  if(/color|colour|palette/.test(ql)){
    return "For this room I'd suggest a warm neutral base — Warm White or Beige walls with Light or Dark Wood flooring — then one accent color in textiles (rug, cushions, art). Sage and Blue both read calm; Dark Grey is striking in smaller doses. Open the Room Settings tab to try a style preset.";
  }
  if(/luxury|luxurious/.test(ql)){
    applyStyle('luxury');
    return "Applying a Luxury concept: dark grey walls, walnut flooring, and rich accent pieces. Add a floor lamp and a vase in brass tones to finish the look — drag them in from the Decoration category.";
  }
  if(/minimalist|minimal/.test(ql)){
    applyStyle('minimalist');
    return "Applying a Minimalist concept: light walls, pale marble-toned floor, and just a sofa, side table and plant. Resist adding more than 4-5 pieces — negative space is the point.";
  }
  if(/lighting|light/.test(ql)){
    return "For everyday use, keep Ambient around 0.5–0.6 and Directional around 0.8 in 'Day' mode. For evenings, switch to the 'Evening' preset and add a floor lamp or two — their warm point lights will do the rest. Open the Lighting tab in the bottom bar to adjust.";
  }
  if(/furniture|what should i add|add furniture/.test(ql)){
    const type = room.type||'Living Room';
    const suggestions = {'Living Room':'a sofa, coffee table, TV unit and a rug to anchor the seating area','Bedroom':'a bed sized for the room, two nightstands, and a wardrobe','Dining Room':'a dining table sized for the room width and matching chairs','Office':'a desk facing the window, an office chair, and a bookshelf'}[type] || 'a few anchor pieces and one accent item like a plant or lamp';
    return `For a ${type.toLowerCase()}, I'd start with ${suggestions}. Given this room is ${wft} × ${lft}, keep at least 0.9m of clear floor space for walking.`;
  }
  if(/scandinavian|japandi|industrial|contemporary|traditional|classic|cozy/.test(ql)){
    const key = Object.keys(STYLE_PRESETS).find(k=>ql.includes(k));
    if(key){ applyStyle(key); return `Applying a ${key} concept — ${STYLE_PRESETS[key].desc}.`; }
  }
  return "Here's a general tip: anchor the room with your largest piece first (usually the sofa or bed), keep a consistent color story across no more than 3 tones, and layer lighting at three heights — ceiling, table, and floor. Ask me about layout, colors, lighting, or a specific style (e.g. 'Scandinavian') for more detail.";
}

/* ---------------------------- SUGGEST LAYOUT (rule-based) ---------------------------- */
let pendingLayout = null;
// suggestLayout() is otherwise fully deterministic for a given room type/size — with no
// variant toggle, the "Try Another" button below was calling the exact same function and
// getting back the identical arrangement every time, i.e. doing nothing. keepVariant=true
// (passed only from "Try Another") flips to a mirrored layout instead of the canonical one,
// alternating on each click; a fresh suggestion (from the copilot) always starts canonical.
let layoutVariant = 0;
function suggestLayout(keepVariant){
  layoutVariant = keepVariant ? (layoutVariant+1)%2 : 0;
  const room = Editor.room; if(!room) return;
  const type = room.type || 'Living Room';
  const W=room.width, D=room.length;
  const margin = 0.15;
  let plan = [];
  if(type==='Bedroom'){
    plan = [
      {type:'bed_double', pos:{x:0,z:-D/2+1.1+margin}, rot:0},
      {type:'nightstand', pos:{x:-1.0,z:-D/2+0.9}, rot:0},
      {type:'nightstand', pos:{x:1.0,z:-D/2+0.9}, rot:0},
      {type:'wardrobe', pos:{x:W/2-0.4-margin, z:D/2-1.1}, rot:Math.PI/2},
      {type:'desk', pos:{x:-W/2+0.7+margin, z:D/2-0.4-margin}, rot:0},
    ];
  } else if(type==='Dining Room'){

    ];
  } else if(type==='Office'){

  } else { // Living Room / default

      {type:'coffee_table', pos:{x:-0.3, z:0.3}, rot:0},
      {type:'tv_unit', pos:{x:-0.3, z:-D/2+0.3+margin}, rot:0},
      {type:'rug', pos:{x:-0.3, z:0.0}, rot:0},

  if(layoutVariant===1) plan = plan.map(p=>({...p, pos:{x:-p.pos.x, z:p.pos.z}, rot:-p.rot}));
  plan = plan.filter(p=>Math.abs(p.pos.x)<W/2-0.1 && Math.abs(p.pos.z)<D/2-0.1);
  pendingLayout = plan;
  showLayoutPreviewToast();
