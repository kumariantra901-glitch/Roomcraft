/* ---------------------------- SNAPPING + ALIGNMENT GUIDES ---------------------------- */
function makeAxisGuide(axis, value){
  if(!Editor.room || !Editor.roomGroup) return;
  const room = Editor.room, y=0.015, ext=0.4;
  let a,b;
  if(axis==='x'){ a=new THREE.Vector3(value,y,-room.length/2-ext); b=new THREE.Vector3(value,y,room.length/2+ext); }
  else { a=new THREE.Vector3(-room.width/2-ext,y,value); b=new THREE.Vector3(room.width/2+ext,y,value); }
  const geo = new THREE.BufferGeometry().setFromPoints([a,b]);
  const mat = new THREE.LineDashedMaterial({color:0xF0783C, dashSize:0.08, gapSize:0.06, depthTest:false, transparent:true, opacity:0.85});
  const line = new THREE.Line(geo, mat);
  line.computeLineDistances();
  line.renderOrder = 999;
  Editor.roomGroup.add(line);
  Editor.snapGuideLines.push(line);
}
function clearSnapGuides(){
  (Editor.snapGuideLines||[]).forEach(l=>{
    if(Editor.roomGroup) Editor.roomGroup.remove(l);
    if(l.geometry) l.geometry.dispose();
    if(l.material) l.material.dispose();
  });
  Editor.snapGuideLines = [];
}
// Snaps the actively-dragged single object's position to nearby walls, the room
// center, and the edges/centers of other furniture — Figma-style — drawing a thin
// guide line for whatever it just caught on. Only runs for a single-object move drag;
// rotate/scale and multi-object (pivot) drags pass through untouched.
function onSmartObjectChange(){
  clearSnapGuides();
  if(!Editor.room || Editor.selectedIds.size!==1 || Editor.selectedIsStructure) return;
  if(!Editor.transformControls || Editor.transformControls.getMode()!=='translate') return;
  const id = Editor.selectedId;
  const mesh = Editor.objectMeshes[id];
  const o = findObjInRoom(id);
  if(!mesh || !o) return;
  const baseFp = getFootprint(o); if(!baseFp) return;
  const rot = mesh.rotation.y||0, hw=baseFp.w/2, hd=baseFp.d/2;
  const cos = Math.abs(Math.cos(rot)), sin = Math.abs(Math.sin(rot));
  const halfX = hw*cos+hd*sin, halfZ = hw*sin+hd*cos;
  const room = Editor.room, W=room.width, D=room.length;
  const THRESH = 0.07;
  let sx=mesh.position.x, sz=mesh.position.z, snappedX=false, snappedZ=false;
  const guides = [];
  const tryX=(val)=>{ if(!snappedX && Math.abs(sx-val)<THRESH){ sx=val; snappedX=true; guides.push({axis:'x',value:val}); } };
  const tryZ=(val)=>{ if(!snappedZ && Math.abs(sz-val)<THRESH){ sz=val; snappedZ=true; guides.push({axis:'z',value:val}); } };
  tryX(-W/2+halfX); tryX(W/2-halfX); tryX(0);
  tryZ(-D/2+halfZ); tryZ(D/2-halfZ); tryZ(0);
  room.objects.forEach(other=>{
    if(other.id===id || other.locked || other.hidden) return;
    const ofp = getFootprint(other); if(!ofp) return;
    tryX(ofp.cx); tryX(ofp.cx-ofp.w/2-halfX); tryX(ofp.cx+ofp.w/2+halfX);
    tryZ(ofp.cz); tryZ(ofp.cz-ofp.d/2-halfZ); tryZ(ofp.cz+ofp.d/2+halfZ);
  });
  if(snappedX) mesh.position.x = sx;
  if(snappedZ) mesh.position.z = sz;
  guides.forEach(g=> makeAxisGuide(g.axis, g.value));
  syncPropsFromObject();
}
function onSmartDraggingChanged(e){
  const bar = $('#floating-toolbar'); if(bar) bar.classList.toggle('ft-dragging', !!e.value);
  if(!e.value) clearSnapGuides();
}

/* ---------------------------- SETUP / FRAME LOOP ---------------------------- */
// Called once per editor entry (after initThree/buildRoomScene): wires the extra
// transform-controls listeners the snapping + floating toolbar need, and starts the
// lightweight per-frame loop that keeps the toolbar glued to the selection on screen
// while the camera orbits or the object is dragged.
function initSmartEditorUX(){
  if(!Editor.transformControls) return;
  Editor.transformControls.addEventListener('objectChange', onSmartObjectChange);
  Editor.transformControls.addEventListener('dragging-changed', onSmartDraggingChanged);
  updateFloatingToolbar();
  startSmartUXLoop();
}
function startSmartUXLoop(){
  if(Editor._smartUXReq) cancelAnimationFrame(Editor._smartUXReq);
  const step = ()=>{
    if(App.view!=='editor' || !$('#floating-toolbar')){ Editor._smartUXReq=null; return; }
    positionFloatingToolbar();
    Editor._smartUXReq = requestAnimationFrame(step);
  };
  step();
}

/* ---------------------------- BOOT ---------------------------- */
document.addEventListener('keydown', onEditorKeydown); // bound once; handler no-ops outside the editor view
Store.load();
if(!Store.data.seeded && Store.data.projectOrder.length===0){ seedSampleProject(); }
route();
</script>
