<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Roomcraft — 3D Interior Design Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#F7F5EF;
  --panel:#FFFFFF;
  --panel-2:#F1EEE7;
  --panel-3:#E6E1D5;
  --line:#DDD9D0;
  --line-soft:#EAE6DD;
  --text:#17243A;
  --text-dim:#6B6F73;
  --text-faint:#9DA0A2;
  --brass:#F0783C;
  --brass-hover:#F58F5C;
  --brass-dim:#C2571F;
  --brass-tint:#FCE9DC;
  --sage:#F5B18C;
  --sage-dim:#C97C4E;
  --sage-tint:#FCEFE4;
  --clay:#17243A;
  --danger:#D64545;
  --danger-tint:#FBE4E1;
  --canvas-day:#EDE9DF;
  --canvas-eve:#2b2436;
  --canvas-night:#0c0d12;
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:22px;
  --font-display:'Fraunces', serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
  --shadow-1: 0 1px 2px rgba(23,36,58,.07);
  --shadow-2: 0 24px 56px rgba(23,36,58,.18);
  --shadow-card: 0 1px 2px rgba(23,36,58,.06), 0 1px 1px rgba(23,36,58,.05);
  --shadow-card-hover: 0 16px 32px rgba(23,36,58,.14);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--ink);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--brass);color:#fff;}
a{color:inherit;}
.hidden{display:none !important;}
.scrim{position:fixed;inset:0;background:rgba(23,36,58,.45);backdrop-filter:blur(4px);z-index:80;display:flex;align-items:center;justify-content:center;}

/* ---------- Scrollbars ---------- */
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#DDD9D0;border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:#C6C1B3;}

/* ================= APP ROOT ================= */
#app{height:100vh;width:100vw;position:relative;}
.view{height:100%;width:100%;}

/* ================= TOASTS ================= */
#toast-stack{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast{
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  padding:10px 16px;border-radius:var(--radius-m);font-size:13px;box-shadow:var(--shadow-2);
  display:flex;align-items:center;gap:8px;animation:toastIn .22s ease-out;
}
.toast.success{border-color:var(--sage);}
.toast.error{border-color:var(--danger);}
.toast-action{background:none;border:none;color:var(--brass);font-weight:700;font-size:12.5px;cursor:pointer;padding:2px 4px;margin-left:2px;text-decoration:underline;text-underline-offset:2px;flex-shrink:0;}
.toast-action:hover{color:var(--brass-hover);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ================= TOP BAR (shared) ================= */
.topbar{
  height:56px;flex-shrink:0;display:flex;align-items:center;gap:14px;
  padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 var(--line-soft);position:relative;z-index:2;
}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-size:19px;letter-spacing:.1px;color:var(--text);user-select:none;}
.brand .mark{width:27px;height:27px;border-radius:8px;background:linear-gradient(150deg,var(--brass-hover),var(--brass-dim));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:var(--font-body);font-size:13px;box-shadow:0 2px 6px rgba(240,120,60,.35);}
.brand small{color:var(--text-faint);font-family:var(--font-body);font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;margin-left:2px;}

.tb-btn{
  display:flex;align-items:center;gap:6px;background:transparent;border:1px solid transparent;color:var(--text-dim);
  padding:7px 12px;border-radius:var(--radius-s);font-size:13px;cursor:pointer;transition:.15s;
}
.tb-btn:hover{background:var(--panel-2);color:var(--text);}
.tb-btn:disabled{opacity:.35;cursor:not-allowed;}
.tb-btn.primary{background:var(--brass);color:#fff;font-weight:600;border-color:var(--brass);box-shadow:0 1px 2px rgba(240,120,60,.25);}
.tb-btn.primary:hover{background:var(--brass-hover);}
.tb-btn.ghost-line{border-color:var(--line);}
.tb-icon{width:16px;height:16px;flex-shrink:0;}

/* ================= DASHBOARD ================= */
#view-dashboard{display:flex;flex-direction:column;}
.dash-body{flex:1;min-height:0;overflow-y:auto;padding:40px 48px 64px;}
.dash-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:30px;gap:20px;flex-wrap:wrap;}
.dash-title{font-family:var(--font-display);font-size:32px;font-weight:500;letter-spacing:-.3px;color:var(--text);}
.dash-sub{color:var(--text-dim);font-size:13.5px;margin-top:5px;}
.dash-controls{display:flex;gap:10px;align-items:center;}
.search-box{
  display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-m);padding:9px 13px;min-width:230px;box-shadow:var(--shadow-card);transition:.15s;
}
.search-box:focus-within{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-tint);}
.search-box input{background:none;border:none;outline:none;color:var(--text);font-size:13px;width:100%;}
.search-box svg{color:var(--text-faint);flex-shrink:0;}
.filter-pills{display:flex;gap:6px;}
.pill{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text-dim);font-size:12.5px;cursor:pointer;transition:.15s;}
.pill:hover{border-color:var(--brass);color:var(--brass);}
.pill.active{background:var(--brass);border-color:var(--brass);color:#fff;font-weight:600;}

.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;margin-top:24px;}
.new-project-card{
  border:1.5px dashed var(--line);border-radius:var(--radius-l);min-height:230px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;
  color:var(--text-dim);transition:.18s;background:var(--panel);
}
.new-project-card:hover{border-color:var(--brass);color:var(--brass);background:var(--brass-tint);}
.new-project-card .plus-circle{width:46px;height:46px;border-radius:50%;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-size:22px;transition:.18s;}
.new-project-card:hover .plus-circle{background:var(--brass);color:#fff;}

.project-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-l);overflow:hidden;
  display:flex;flex-direction:column;transition:.2s;cursor:pointer;position:relative;box-shadow:var(--shadow-card);
}
.project-card:hover{transform:translateY(-3px);border-color:#CFC9BD;box-shadow:var(--shadow-card-hover);}
.project-thumb{
  height:150px;background:linear-gradient(135deg,#F5F3EC,#EDEAE1);position:relative;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.project-thumb img{width:100%;height:100%;object-fit:cover;}
.project-thumb .thumb-fallback{color:var(--text-faint);font-family:var(--font-display);font-size:15px;}
.status-chip{
  position:absolute;top:10px;left:10px;font-size:10.5px;padding:4px 9px;border-radius:999px;font-weight:600;letter-spacing:.3px;
  text-transform:uppercase;backdrop-filter:blur(4px);
}
.status-chip.draft{background:rgba(245,177,140,.4);color:var(--brass-dim);border:1px solid var(--line);}
.status-chip.published{background:var(--text);color:#F7F5EF;}
.project-info{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column;gap:4px;}
.project-name{font-size:15px;font-weight:600;color:var(--text);}
.project-meta{color:var(--text-faint);font-size:12px;}
.project-actions{display:flex;gap:4px;padding:0 10px 12px;}
.icon-btn{
  width:30px;height:30px;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--panel-2);
  display:flex;align-items:center;justify-content:center;color:var(--text-dim);cursor:pointer;transition:.15s;
}
.icon-btn:hover{background:var(--panel-3);color:var(--text);}
.icon-btn.danger:hover{color:var(--danger);border-color:var(--danger);background:var(--danger-tint);}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:76px 20px;color:var(--text-dim);gap:10px;}
.empty-state .es-icon{font-size:32px;margin-bottom:6px;opacity:.85;}
.empty-state h3{font-family:var(--font-display);font-weight:500;font-size:19px;color:var(--text);margin:0;}
.empty-state p{font-size:13.5px;max-width:340px;margin:0;}

/* ================= MODALS ================= */
.modal{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-l);width:440px;max-width:92vw;
  box-shadow:var(--shadow-2);max-height:88vh;overflow-y:auto;
}
.modal-head{padding:22px 24px 4px;}
.modal-head h2{font-family:var(--font-display);font-weight:500;font-size:20px;margin:0 0 3px;color:var(--text);}
.modal-head p{color:var(--text-dim);font-size:12.5px;margin:0;}
.modal-body{padding:18px 24px;display:flex;flex-direction:column;gap:14px;}
.modal-foot{padding:14px 24px 24px;display:flex;justify-content:flex-end;gap:10px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
.field input[type=text],.field input[type=number],.field select,.field textarea{
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-s);padding:9px 11px;color:var(--text);font-size:13.5px;outline:none;transition:.15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brass);background:#FFFFFF;box-shadow:0 0 0 3px var(--brass-tint);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.unit-toggle{display:flex;gap:5px;}
.unit-toggle button{flex:1;padding:7px 4px;border:1px solid var(--line);background:var(--panel-2);color:var(--text-dim);border-radius:var(--radius-s);cursor:pointer;font-size:12px;}
.unit-toggle button.active{background:var(--brass);color:#fff;border-color:var(--brass);font-weight:600;}
.btn{padding:9px 16px;border-radius:var(--radius-s);font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--panel-2);color:var(--text);transition:.15s;font-weight:500;}
.btn:hover{background:var(--panel-3);}
.btn.primary{background:var(--brass);color:#fff;border-color:var(--brass);font-weight:600;box-shadow:0 1px 2px rgba(240,120,60,.25);}
.btn.primary:hover{background:var(--brass-hover);}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger);}
.btn.danger:hover{background:var(--danger-tint);}

/* ================= EDITOR ================= */
#view-editor{display:flex;flex-direction:column;}
.editor-body{flex:1;min-height:0;display:flex;overflow:hidden;position:relative;}

.sidebar{
  width:250px;flex-shrink:0;min-height:0;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;transition:margin .2s;box-shadow:1px 0 0 var(--line-soft);
}
.sidebar.collapsed-left{margin-left:-250px;}
.tabs-row{display:flex;border-bottom:1px solid var(--line);flex-shrink:0;background:var(--panel-2);}
.tab-btn{flex:1;padding:11px 4px;background:none;border:none;color:var(--text-faint);font-size:11.5px;font-weight:600;letter-spacing:.3px;cursor:pointer;border-bottom:2px solid transparent;text-transform:uppercase;transition:.15s;}
.tab-btn:hover{color:var(--text-dim);}
.tab-btn.active{color:var(--brass);border-bottom-color:var(--brass);background:var(--panel);}
.tab-panel{display:none;flex:1;min-height:0;overflow-y:auto;padding:14px;}
.tab-panel.active{display:flex;flex-direction:column;gap:16px;}
.cat-block h4{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-faint);margin:0 0 8px;font-weight:700;}
.asset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.asset-card{
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-m);padding:10px 8px;
  display:flex;flex-direction:column;align-items:center;gap:6px;cursor:grab;text-align:center;transition:.15s;user-select:none;
  touch-action:none; /* the pointer-based drag (beginAssetPointerDrag) handles all gesture movement itself —
    without this, touch browsers intercept the same gesture for page-scroll/zoom, which is what caused
    the drag to feel like it "moves, then sticks, then jumps" on touch devices */
}
.asset-card:hover{background:#FFFFFF;border-color:var(--brass);box-shadow:var(--shadow-card);}
.asset-card:active{cursor:grabbing;}
.asset-card.dragging-source{opacity:.45;}
.asset-card .a-icon{font-size:22px;}
.asset-card .a-name{font-size:11px;color:var(--text-dim);line-height:1.25;}
.asset-card .a-del{position:absolute;}
.asset-drag-ghost{
  position:fixed;top:0;left:0;z-index:400;transform:translate(-50%,-120%);pointer-events:none;
  background:var(--panel);border:1px solid var(--brass);border-radius:var(--radius-m);box-shadow:var(--shadow-2);
  padding:7px 12px;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--text);
  white-space:nowrap;
}
.asset-drag-ghost .a-icon{font-size:18px;line-height:1;display:flex;}
.drop-target-active{outline:2px dashed var(--brass);outline-offset:-2px;}
.room-list-item{
  display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:var(--radius-s);
  cursor:pointer;font-size:13px;color:var(--text-dim);gap:6px;transition:.15s;
}
.room-list-item:hover{background:var(--panel-2);}
.room-list-item.active{background:var(--brass-tint);color:var(--brass-dim);font-weight:600;}
.room-list-item .rli-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.small-icon-btn{width:22px;height:22px;border-radius:5px;border:none;background:transparent;color:var(--text-faint);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.small-icon-btn:hover{background:var(--panel-3);color:var(--text);}
.add-room-btn{margin-top:6px;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border:1.5px dashed var(--line);border-radius:var(--radius-m);color:var(--text-dim);font-size:12.5px;cursor:pointer;background:none;transition:.15s;}
.add-room-btn:hover{border-color:var(--brass);color:var(--brass);background:var(--brass-tint);}

.upload-zone{border:1.5px dashed var(--line);border-radius:var(--radius-m);padding:18px 10px;text-align:center;color:var(--text-dim);font-size:12px;cursor:pointer;transition:.15s;}
.upload-zone:hover{border-color:var(--brass);color:var(--brass);background:var(--brass-tint);}

.viewport-wrap{flex:1;position:relative;background:var(--canvas-day);min-width:0;}
#three-canvas-holder{position:absolute;inset:0;}
#three-canvas-holder canvas{display:block;width:100%;height:100%;touch-action:none;}
#plan2d-canvas{position:absolute;inset:0;background:#F5F3EC;display:none;touch-action:none;}

.viewport-topcontrols{position:absolute;top:12px;right:12px;display:flex;gap:6px;z-index:5;}
.vp-btn{
  width:34px;height:34px;border-radius:var(--radius-s);background:rgba(255,255,255,.88);border:1px solid var(--line);
  color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px);font-size:14px;box-shadow:var(--shadow-card);transition:.15s;
}
.vp-btn:hover{color:var(--text);background:#FFFFFF;}
.vp-btn.on{color:var(--brass);border-color:var(--brass);background:var(--brass-tint);}
.floor-selector{
  height:34px;border-radius:var(--radius-s);background:rgba(255,255,255,.92);border:1px solid var(--line);
  color:var(--text);padding:0 10px;font-size:12.5px;font-weight:600;cursor:pointer;backdrop-filter:blur(8px);box-shadow:var(--shadow-card);
}
.floor-selector:hover{background:#FFFFFF;}
.view-cube-row{position:absolute;top:12px;left:12px;display:flex;gap:6px;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:var(--radius-m);padding:4px;backdrop-filter:blur(8px);z-index:5;box-shadow:var(--shadow-card);}
.view-cube-row button{background:none;border:none;color:var(--text-dim);font-size:11.5px;padding:6px 10px;border-radius:var(--radius-s);cursor:pointer;}
.view-cube-row button.active,.view-cube-row button:hover{background:var(--panel-3);color:var(--text);}

.gizmo-toolbar{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:var(--radius-m);padding:4px;z-index:5;backdrop-filter:blur(8px);box-shadow:var(--shadow-card-hover);}
.gizmo-toolbar button{width:34px;height:34px;border-radius:var(--radius-s);background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:15px;}
.gizmo-toolbar button:hover{background:var(--panel-2);color:var(--text);}
.gizmo-toolbar button.active{background:var(--brass);color:#fff;}
.gizmo-toolbar .sep{width:1px;background:var(--line);margin:4px 2px;}

.empty-viewport-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:var(--text-faint);font-size:13.5px;text-align:center;flex-direction:column;gap:8px;}
/* dimmed + inert while the 3D engine hasn't loaded — see showThreeLoadError/refreshThreeDependentControls */
body.three-unavailable .three-dependent{opacity:.35;pointer-events:none;}
.empty-viewport-hint b{color:var(--text);font-family:var(--font-display);font-size:17px;font-weight:500;}

/* right properties panel */
.props-panel{width:270px;flex-shrink:0;min-height:0;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;transition:margin .2s;box-shadow:-1px 0 0 var(--line-soft);}
.props-panel.collapsed-right{margin-right:-270px;}
.props-empty{padding:40px 20px;text-align:center;color:var(--text-faint);font-size:12.5px;}
.props-section{padding:16px;border-bottom:1px solid var(--line-soft);}
.props-section h4{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-faint);margin:0 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
.props-title{padding:16px 16px 4px;font-family:var(--font-display);font-size:16px;font-weight:500;color:var(--text);display:flex;justify-content:space-between;align-items:center;}
.props-title .del-obj{color:var(--danger);cursor:pointer;font-size:12px;background:none;border:none;}

/* ---------------------------- FLOATING CONTEXTUAL TOOLBAR ---------------------------- */
.floating-toolbar{
  position:absolute; top:0; left:0; z-index:6;
  display:flex; align-items:center; gap:2px;
  background:rgba(255,255,255,.97); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:4px; box-shadow:var(--shadow-2); backdrop-filter:blur(10px);
  transition:opacity .12s ease; pointer-events:auto;
}
.floating-toolbar.hidden{display:none;}
.floating-toolbar.ft-dragging{opacity:0 !important; pointer-events:none;}
.floating-toolbar button{
  width:32px;height:32px;border-radius:var(--radius-s);background:none;border:none;
  color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.floating-toolbar button:hover{background:var(--panel-2);color:var(--text);}
.floating-toolbar button.active{background:var(--brass);color:#fff;}
.floating-toolbar button.ft-danger:hover{background:var(--danger-tint);color:var(--danger);}
.floating-toolbar .ft-seg{display:flex;gap:1px;background:var(--panel-2);border-radius:var(--radius-s);padding:2px;}
.floating-toolbar .ft-sep{width:1px;align-self:stretch;background:var(--line);margin:4px 2px;}
.floating-toolbar .ft-label{font-size:11.5px;color:var(--text-faint);padding:0 8px;white-space:nowrap;}
.ft-menu{
  position:absolute; z-index:7; width:236px; max-height:320px; overflow-y:auto;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:5px; box-shadow:var(--shadow-2);
}
.ft-menu-item{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:8px 9px; border-radius:var(--radius-s); background:none; border:none;
  color:var(--text); font-size:12.5px; cursor:pointer;
}
.ft-menu-item:hover{background:var(--panel-2);}
.ft-menu-item .ft-menu-icon svg{width:15px;height:15px;flex-shrink:0;}
.ft-menu-sep{height:1px;background:var(--line-soft);margin:5px 2px;}
.ft-menu-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);padding:6px 9px 3px;}
.ft-menu-row{display:flex;align-items:center;gap:4px;padding:3px 9px;}
.ft-menu-row-name{flex:1;font-size:12px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ft-menu-row button{width:24px;height:24px;border-radius:5px;background:var(--panel-2);border:none;color:var(--text-dim);cursor:pointer;font-size:12px;flex-shrink:0;}
.ft-menu-row button:hover{color:var(--brass);background:var(--brass-tint);}

/* ---------------------------- ROOM OBJECTS LIST ---------------------------- */
.obj-list{display:flex;flex-direction:column;gap:1px;}
.obj-list-row{display:flex;align-items:center;gap:2px;padding:5px 6px;border-radius:6px;}
.obj-list-row:hover{background:var(--panel-2);}
.obj-list-row.active{background:var(--brass-tint);}
.obj-list-row .oln{flex:1;font-size:12.5px;color:var(--text-dim);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 0;}
.obj-list-row.active .oln{color:var(--brass-dim);font-weight:600;}
.lock-badge{font-size:10.5px;color:var(--text-faint);padding:0 16px 8px;margin-top:-6px;display:flex;align-items:center;gap:5px;}
.vec3-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.vec3-field{display:flex;flex-direction:column;gap:3px;}
.vec3-field label{font-size:9.5px;color:var(--text-faint);text-transform:uppercase;}
.vec3-field input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;color:var(--text);padding:6px 6px;font-size:12px;text-align:center;}
.vec3-field input:focus{outline:none;border-color:var(--brass);background:#FFFFFF;}
.slider-row{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.slider-row .sr-label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-dim);}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:var(--panel-3);border-radius:2px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--brass);cursor:pointer;border:2px solid #fff;box-shadow:0 1px 3px rgba(23,36,58,.35);}
.color-swatches{display:flex;flex-wrap:wrap;gap:7px;}
.swatch{width:26px;height:26px;border-radius:7px;cursor:pointer;border:2px solid transparent;flex-shrink:0;box-shadow:0 0 0 1px var(--line-soft);}
/* Consistent, visible focus ring for custom (non-native) interactive elements —
   asset/project cards, swatches, room-list rows, etc. — made keyboard-operable via
   makeActivatable(). Browsers already show a default outline on these once they're
   focusable, but a themed ring reads more clearly against this bright UI. */
[role="button"]:focus-visible, [role="radio"]:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.swatch:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.swatch.selected{border-color:var(--brass);}
input[type=color]{width:34px;height:26px;border:1px solid var(--line);border-radius:6px;background:none;padding:0;cursor:pointer;}

/* Bottom bar */
.bottombar{height:42px;flex-shrink:0;display:flex;align-items:center;background:var(--panel);border-top:1px solid var(--line);padding:0 10px;gap:4px;box-shadow:0 -1px 0 var(--line-soft);}
.bb-btn{padding:8px 13px;background:none;border:none;color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;border-radius:var(--radius-s);letter-spacing:.2px;}
.bb-btn.active{color:var(--brass);background:var(--brass-tint);}
.bb-btn:hover{background:var(--panel-2);color:var(--text);}
.bb-sep{width:1px;height:20px;background:var(--line);margin:0 6px;}
.bb-status{margin-left:auto;font-size:11.5px;color:var(--text-faint);display:flex;align-items:center;gap:6px;}
.save-dot{width:6px;height:6px;border-radius:50%;background:var(--sage-dim);}
.save-dot.saving{background:var(--brass);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* Prominent AI Design Copilot launcher — a labeled pill (not just an icon) so it
   reads as a distinct, obvious entry point rather than blending into the small
   utility icons in the top-right corner. */
.copilot-fab{
  position:absolute; right:16px; bottom:16px; z-index:9;
  display:flex; align-items:center; gap:9px; height:46px; padding:0 18px 0 15px;
  border:none; border-radius:999px; cursor:pointer;
  background:linear-gradient(135deg,var(--brass-hover),var(--brass));
  color:#fff; font-family:var(--font-body); font-size:13.5px; font-weight:600; letter-spacing:.1px;
  box-shadow:0 10px 24px rgba(240,120,60,.35), 0 2px 6px rgba(240,120,60,.25);
  animation:copilotGlow 2.8s ease-in-out infinite;
  transition:transform .15s, box-shadow .15s, background .15s;
}
.copilot-fab:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(240,120,60,.4), 0 3px 8px rgba(240,120,60,.3);}
.copilot-fab svg{width:17px;height:17px;flex-shrink:0;}
.copilot-fab .cf-badge{
  font-size:9px;font-weight:700;letter-spacing:.4px;background:rgba(255,255,255,.22);
  padding:2px 6px;border-radius:999px;text-transform:uppercase;
}
.copilot-fab.on{background:linear-gradient(135deg,var(--brass-dim),var(--brass));animation:none;box-shadow:0 4px 14px rgba(240,120,60,.3);}
@keyframes copilotGlow{
  0%,100%{box-shadow:0 10px 24px rgba(240,120,60,.35), 0 2px 6px rgba(240,120,60,.25);}
  50%{box-shadow:0 10px 30px rgba(245,143,92,.55), 0 2px 10px rgba(245,143,92,.4);}
}
@media (prefers-reduced-motion: reduce){.copilot-fab{animation:none;}}

/* Copilot panel */
#copilot-panel{
  position:absolute;right:16px;bottom:74px;width:320px;max-height:60vh;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-l);box-shadow:var(--shadow-2);display:flex;flex-direction:column;overflow:hidden;z-index:20;
}
.copilot-head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:var(--panel-2);gap:8px;}
.copilot-status{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text-faint);margin-left:auto;margin-right:8px;white-space:nowrap;}
.cs-dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);flex-shrink:0;}
.cs-dot.busy{background:var(--brass);animation:copilotPulse 1s ease-in-out infinite;}
.cs-dot.ok{background:var(--sage-dim,#C97C4E);}
.cs-dot.err{background:var(--danger);}
.copilot-head b{font-family:var(--font-display);font-size:14.5px;font-weight:500;color:var(--text);}
.copilot-head span.tag{font-size:9.5px;background:var(--panel-3);color:var(--text-faint);padding:2px 7px;border-radius:999px;margin-left:7px;letter-spacing:.4px;}
.copilot-msgs{flex:1;min-height:0;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:12.8px;}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;line-height:1.45;}
.msg.bot{background:var(--panel-2);color:var(--text);align-self:flex-start;border-bottom-left-radius:3px;}
.msg.user{background:var(--brass);color:#fff;align-self:flex-end;border-bottom-right-radius:3px;}
.msg.thinking{color:var(--text-faint);font-style:italic;position:relative;padding-left:26px;}
.msg.thinking::before{content:'';position:absolute;left:10px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--brass);animation:copilotPulse 1s ease-in-out infinite;}
@keyframes copilotPulse{0%,100%{opacity:.25;transform:scale(.8);}50%{opacity:1;transform:scale(1.15);}}
.msg.error{background:rgba(214,69,69,.1);color:#A52F2F;border:1px solid rgba(214,69,69,.3);}
.copilot-suggestions.disabled .sugg-chip{opacity:.5;pointer-events:none;}
.copilot-input-row input:disabled,.copilot-input-row button:disabled{opacity:.5;cursor:not-allowed;}
.copilot-suggestions{padding:9px 12px;display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line-soft);}
.sugg-chip{background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);font-size:11px;padding:6px 10px;border-radius:999px;cursor:pointer;}
.sugg-chip:hover{border-color:var(--brass);color:var(--brass);background:var(--brass-tint);}
.copilot-input-row{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line);}
.copilot-input-row input{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:9px 13px;color:var(--text);font-size:12.5px;outline:none;}
.copilot-input-row button{width:34px;height:34px;border-radius:50%;background:var(--brass);border:none;color:#fff;cursor:pointer;font-size:14px;flex-shrink:0;}

/* Onboarding */
#onboarding{position:fixed;bottom:56px;left:20px;width:300px;max-height:min(420px,calc(100vh - 90px));overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-l);box-shadow:var(--shadow-2);z-index:150;}
.ob-head{padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:center;}
.ob-head b{font-family:var(--font-display);font-weight:500;font-size:15px;color:var(--text);}
.ob-close{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:16px;}
.ob-list{padding:6px 16px 16px;display:flex;flex-direction:column;gap:9px;}
.ob-item{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;color:var(--text-dim);}
.ob-item .ob-num{width:18px;height:18px;border-radius:50%;background:var(--panel-3);color:var(--text-dim);font-size:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;font-weight:700;}
.ob-item.done .ob-num{background:var(--sage-dim);color:#fff;}
.ob-item.done span.txt{color:var(--text-faint);text-decoration:line-through;}

/* Presentation mode */
body.presenting .sidebar,body.presenting .props-panel,body.presenting .bottombar,body.presenting .topbar{display:none !important;}
body.presenting .viewport-wrap{position:fixed;inset:0;z-index:300;}
/* client showcase page uses different class names for its equivalent regions */
body.presenting .client-topbar,body.presenting .client-hero,body.presenting .client-roomtabs,
body.presenting .client-section,body.presenting .client-footer,body.presenting .demo-banner{display:none !important;}
body.presenting .client-body{position:fixed;inset:0;overflow:hidden;}
body.presenting .client-stage{max-width:none;padding:0;height:100%;}
body.presenting .client-viewport{height:100%;border-radius:0;border:none;}
.present-exit{position:fixed;top:16px;right:16px;z-index:301;background:rgba(23,36,58,.75);border:1px solid rgba(255,255,255,.16);color:#fff;padding:9px 15px;border-radius:999px;cursor:pointer;font-size:12.5px;backdrop-filter:blur(8px);display:none;}
body.presenting .present-exit{display:block;}
.present-roomnav{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:301;display:none;gap:8px;background:rgba(23,36,58,.68);border:1px solid rgba(255,255,255,.14);padding:6px;border-radius:999px;backdrop-filter:blur(8px);}
body.presenting .present-roomnav{display:flex;}
.present-roomnav button{background:none;border:none;color:rgba(255,255,255,.65);font-size:12px;padding:7px 13px;border-radius:999px;cursor:pointer;}
.present-roomnav button.active{background:var(--brass);color:#fff;font-weight:600;}
.walkthrough-hint{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:301;background:rgba(23,36,58,.68);color:#fff;padding:8px 16px;border-radius:999px;font-size:12px;display:none;backdrop-filter:blur(8px);}
body.walkthrough .walkthrough-hint{display:block;}
/* Move/rotate/scale and camera-view controls are meaningless while walking through
   (nothing is selected, camera is first-person) and the grid-toggle/view-cube sit in
   the same top-right corner as the walkthrough exit button — hiding them avoids that
   visual collision and declutters the view the same way presentation mode already does. */
body.walkthrough .gizmo-toolbar,body.walkthrough .viewport-topcontrols,body.walkthrough .view-cube-row{display:none !important;}

/* ================= CLIENT VIEW ================= */
#view-client{display:flex;flex-direction:column;background:var(--ink);}
.client-topbar{padding:16px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);flex-shrink:0;background:var(--panel);}
.client-body{flex:1;min-height:0;overflow-y:auto;}
.client-hero{padding:54px 40px 32px;text-align:center;max-width:760px;margin:0 auto;}
.client-hero .eyebrow{color:var(--brass);font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;margin-bottom:12px;}
.client-hero h1{font-family:var(--font-display);font-size:38px;font-weight:500;letter-spacing:-.3px;margin:0 0 10px;color:var(--text);}
.client-hero p{color:var(--text-dim);font-size:14.5px;line-height:1.6;max-width:520px;margin:0 auto;}
.client-hero .designer-credit{margin-top:16px;font-size:12.5px;color:var(--text-faint);}
.client-stage{max-width:1180px;margin:0 auto;padding:0 24px 20px;}
.client-viewport{height:min(64vh,620px);background:linear-gradient(180deg,#F5F3EC,#EDEAE1);border-radius:var(--radius-l);border:1px solid var(--line);position:relative;overflow:hidden;box-shadow:var(--shadow-card);}
.client-roomtabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0 26px;}
.client-roomtabs button{padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text-dim);font-size:12.5px;cursor:pointer;transition:.15s;}
.client-roomtabs button:hover{border-color:var(--brass);color:var(--brass);}
.client-roomtabs button.active{background:var(--brass);color:#fff;border-color:var(--brass);font-weight:600;}
.client-section{max-width:1180px;margin:0 auto;padding:32px 24px;border-top:1px solid var(--line-soft);}
.client-section h3{font-family:var(--font-display);font-weight:500;font-size:19px;margin:0 0 16px;color:var(--text);}
.material-strip{display:flex;gap:12px;flex-wrap:wrap;}
.material-chip{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);padding:8px 14px 8px 8px;border-radius:999px;font-size:12.5px;color:var(--text-dim);}
.material-chip .sw{width:22px;height:22px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 1px var(--line-soft);}
.client-footer{text-align:center;padding:32px;color:var(--text-faint);font-size:11.5px;}
.demo-banner{background:var(--brass-tint);border:1px solid var(--brass);color:var(--brass-dim);font-size:12px;padding:9px 16px;text-align:center;}

/* misc */
.rot-drag-hint{cursor:pointer;}
@media (max-width: 980px){
  .sidebar{position:absolute;left:0;top:0;bottom:0;z-index:30;box-shadow:var(--shadow-2);}
  .sidebar.collapsed-left{margin-left:-250px;}
  .props-panel{position:absolute;right:0;top:0;bottom:0;z-index:30;box-shadow:var(--shadow-2);}
  .props-panel.collapsed-right{margin-right:-270px;}
  #copilot-panel{width:88vw;right:6vw;}
  .client-hero h1{font-size:28px;}
  .mobile-toggle{display:flex !important;}
  /* sidebar becomes a left-anchored overlay drawer on mobile — move onboarding to the
     right so the two don't stack and block each other */
  #onboarding{left:auto;right:16px;width:min(280px,calc(100vw - 32px));}
}
/* ---- Phone-width pass (was previously only handled by the 980px tablet breakpoint
   above, which left touch targets, panel widths, the dashboard grid, and modals
   untouched between a small phone and a 979px tablet). Placed after the 980px block
   so its overrides win on screens this narrow. ---- */
@media (max-width: 640px){
  /* Panels: fixed 250/270px overlays were nearly full-screen anyway on a narrow
     phone, but sized as vw so a sliver of the viewport stays visible behind them
     (signals "this is an overlay, tap outside/toggle to close" rather than feeling
     like a full page navigation) and so they never exceed the viewport itself. */
  .sidebar{width:min(86vw,320px);}
  .sidebar.collapsed-left{margin-left:min(-86vw,-320px);}
  .props-panel{width:min(86vw,320px);}
  .props-panel.collapsed-right{margin-right:min(-86vw,-320px);}

  /* Topbar: buttons keep full size (still tappable) but the bar scrolls
     horizontally instead of clipping or wrapping when everything doesn't fit. */
  .topbar{padding:0 10px;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .topbar::-webkit-scrollbar{display:none;}
  .topbar .tb-btn{flex-shrink:0;}
  .topbar input[type=text]{width:120px;flex-shrink:0;}
  .brand small{display:none;}

  /* Touch targets: 22px/30px controls are well under the ~40-44px a thumb needs.
     Bumped up only at this breakpoint so desktop density is unaffected. */
  .small-icon-btn{width:34px;height:34px;}
  .icon-btn{width:38px;height:38px;}
  .vp-btn{width:40px;height:40px;}
  .gizmo-toolbar button{width:40px;height:40px;}
  .swatch{width:32px;height:32px;}
  .tb-btn{padding:9px 13px;}

  /* Dashboard: the fixed 36px/44px padding and minmax(270px,…) grid track were
     wider than a narrow phone's own viewport, causing horizontal overflow/scroll
     instead of a clean single column. */
  .dash-body{padding:20px 16px 48px;}
  .dash-header{flex-direction:column;align-items:stretch;gap:14px;}
  .dash-controls{flex-direction:column;align-items:stretch;}
  .search-box{min-width:0;}
  .filter-pills{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .project-grid{grid-template-columns:1fr;gap:14px;}

  /* Modals and multi-column form rows: 3-across number inputs (room width/length/
     height) become unreadably narrow on a phone. */
  .modal-body{padding:14px 16px;}
  .modal-foot{padding:12px 16px 18px;}
  .field-row,.field-row3{grid-template-columns:1fr;}

  /* Asset library: 2 columns still fit at 86vw, but tighten the gap so card labels
     don't wrap awkwardly. */
  .asset-grid{gap:6px;}

  .gizmo-toolbar{bottom:60px;}
  .client-hero{padding:36px 20px 22px;}
  .client-hero h1{font-size:23px;}
  .client-section{padding:22px 16px;}
}
@media (max-width: 380px){
  /* Smallest phones (iPhone SE / older Android, 320–375px): even the 2-column
     asset grid and 2-column project grid get cramped once the panel itself is
     already near-full-width. */
  .asset-grid{grid-template-columns:1fr;}
  .new-project-card{min-height:170px;}
}
.mobile-toggle{display:none;}
</style>

<body>
<div id="app"></div>
<div id="toast-stack"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
<script>
/* =========================================================================
   ROOMCRAFT — single-file MVP
   Sections: STORE > UTILS > LIBRARY DATA > MESH BUILDERS > ROUTER >
             DASHBOARD > EDITOR (scene/selection/props/lighting/materials) >
             UPLOAD/2.5D ASSETS > COPILOT/LAYOUT > UNDO-REDO/SAVE >
             PUBLISH/CLIENT VIEW > PRESENTATION/WALKTHROUGH/2D/EXPORT > BOOT
   ========================================================================= */
// Global safety net: any uncaught exception or rejected promise anywhere in the app
// gets logged loudly with the [RoomCraft] prefix instead of failing silently. This is
// what makes bugs like "3D room build stops halfway with no visible error" diagnosable
// straight from the console instead of requiring guesswork.
window.addEventListener('error', (e)=>{ console.error('[RoomCraft] UNCAUGHT ERROR:', e.message, '\n  at', e.filename+':'+e.lineno+':'+e.colno, '\n ', e.error); });
window.addEventListener('unhandledrejection', (e)=>{ console.error('[RoomCraft] UNHANDLED PROMISE REJECTION:', e.reason); });

/* ---------------------------- UTILS ---------------------------- */
// BUILD MARKER — bump this on every real change and check it in the browser console
// (or the bottom-right corner of the app) to confirm the browser is actually running
// the file you just deployed, not a cached/stale copy. If this doesn't match what you
// expect after a deploy, the problem is caching/deployment, not the code.
const BUILD_TAG = 'roomcraft-2024-ceiling-toggle-undo-1';
console.log('[RoomCraft build]', BUILD_TAG);
const $ = (sel,root=document)=>root.querySelector(sel);
const $$ = (sel,root=document)=>Array.from(root.querySelectorAll(sel));
const uid = (p='id')=>p+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
function el(tag, attrs={}, ...children){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(attrs[k]===undefined || attrs[k]===null) continue;
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if(k==='style') e.setAttribute('style',attrs[k]);
    else if(k==='value' && (tag==='input'||tag==='textarea')) e.value=attrs[k];
    else if(typeof attrs[k]==='boolean'){ if(attrs[k]) e.setAttribute(k,''); }
    else e.setAttribute(k,attrs[k]);
  }
  children.flat().forEach(c=>{ if(c==null) return; e.appendChild((typeof c==='string'||typeof c==='number')?document.createTextNode(String(c)):c); });
  return e;
}
// Makes a plain, non-semantic element (a <div> standing in for a button/card) reachable
// and operable via keyboard and screen readers: focusable via Tab, exposed with the
// given role/label, and activatable with Enter or Space — matching native <button>
// behavior. Used throughout for asset cards, swatches, and list rows that need custom
// layout/drag-and-drop that a real <button> can't easily provide.
function makeActivatable(elm, handler, label, role){
  elm.setAttribute('tabindex','0');
  elm.setAttribute('role', role||'button');
  if(label) elm.setAttribute('aria-label', label);
  elm.addEventListener('keydown',(e)=>{
    if(e.target!==elm) return; // don't fire if the key event bubbled up from a nested focusable child (e.g. a button inside a card/row) — that child already handles its own Enter/Space
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); handler(e); }
  });

}
// `action` (optional) = {label, onClick} — renders an inline text-button (e.g. "Undo")
// inside the toast itself. Clicking it fires onClick() and dismisses the toast early;
// otherwise it auto-dismisses after `ms` like a normal toast. Used to give a real,
// visible way to reverse a destructive action right after it happens (see deleteRoom).
function toast(msg, type='default', ms=2600, action=null){
  const t = el('div',{class:'toast '+(type!=='default'?type:'')}, msg);
  if(action && action.label && action.onClick){
    const btn = el('button',{class:'toast-action', type:'button'}, action.label);
    btn.addEventListener('click',()=>{ action.onClick(); dismiss(); });
    t.appendChild(btn);
  }
  $('#toast-stack').appendChild(t);
  let dismissed = false;
  function dismiss(){ if(dismissed) return; dismissed=true; t.style.transition='opacity .25s'; t.style.opacity='0'; setTimeout(()=>t.remove(),260); }
  setTimeout(dismiss, ms);
}
// Custom confirm/prompt dialogs — used instead of window.confirm()/window.prompt()
// everywhere in the app. Native confirm()/prompt() are blocked (or silently return
// false/null with no error) in sandboxed iframes, which is exactly how this app is
// often previewed/embedded — the result was that Delete/Rename buttons appeared to
// do nothing at all, with no visible error, because the code took the "cancelled"
// branch every time. These build the same yes/no or text-input flow as an in-page
// modal (same .scrim/.modal pattern used elsewhere in the app), so it always works
// regardless of the surrounding embed/sandbox.
function confirmDialog(message, onConfirm, opts={}){
  const scrim = el('div',{class:'scrim'});
  const modal = el('div',{class:'modal', style:'width:360px'});
  modal.appendChild(el('div',{class:'modal-head'}, el('h2',null, opts.title||'Please confirm')));
  modal.appendChild(el('div',{class:'modal-body'}, el('div',{style:'font-size:13px;color:var(--text-dim);line-height:1.5'}, message)));
  const confirmBtn = el('button',{class:'btn'+(opts.danger?' danger':' primary'), onclick:()=>{ scrim.remove(); onConfirm(); }}, opts.confirmLabel||'Delete');
  modal.appendChild(el('div',{class:'modal-foot'},
    el('button',{class:'btn',onclick:()=>scrim.remove()}, opts.cancelLabel||'Cancel'),
    confirmBtn
  ));
  scrim.appendChild(modal); document.body.appendChild(scrim);
  scrim.addEventListener('click',(e)=>{ if(e.target===scrim) scrim.remove(); });
  confirmBtn.focus();
}
function promptDialog(title, defaultValue, onSubmit){
  const scrim = el('div',{class:'scrim'});

function fmtDate(ts){
  const d = new Date(ts); const now = new Date();
  const sameDay = d.toDateString()===now.toDateString();
  if(sameDay) return 'today, '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  const diffDays = Math.floor((now-d)/86400000);
  if(diffDays===1) return 'yesterday';
  if(diffDays<7) return diffDays+' days ago';
  return d.toLocaleDateString([], {month:'short', day:'numeric', year: d.getFullYear()!==now.getFullYear()?'numeric':undefined});
}

const UNIT_TO_M = { ft: 0.3048, in: 0.0254, m: 1, cm: 0.01 };

// Formats a length (given in meters) for display, in whichever unit the room is
// currently set to — defaults to 'ft' when no unit is passed (e.g. contexts with
// no room in scope), matching the previous hardcoded behavior.
function fmtLen(m, unit){
  unit = unit || 'ft';
  if(unit==='m') return (Math.round(m*100)/100)+' m';
  if(unit==='cm') return Math.round(m*100)+' cm';
  if(unit==='in') return (Math.round((m/0.0254)*10)/10)+'"';
  const ft = m/0.3048; const wholeFt = Math.floor(ft); const inch = Math.round((ft-wholeFt)*12);
  if(inch===12) return (wholeFt+1)+"' 0\"";
  return wholeFt+"' "+inch+'"';
}

/* ---------------------------- STORE ---------------------------- */
const STORAGE_KEY = 'roomcraft_state_v1';
const Store = {
  data: null,
  load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        this.data = sanitizePersistedData(JSON.parse(raw));
        console.log('[RoomCraft] project loaded from localStorage', {projects:Object.keys(this.data.projects).length,
          rooms: Object.values(this.data.projects).reduce((n,p)=>n+Object.keys(p.rooms||{}).length,0)});
        return;
      }
      console.log('[RoomCraft] no saved state found in localStorage — starting fresh');
    }catch(e){ console.warn('[RoomCraft] state load FAILED — starting with a fresh, empty workspace', e); }
    this.data = { projects:{}, projectOrder:[], customAssets:{}, onboardingDismissed:false, onboardingFlags:{}, seeded:false };
  },
  persist(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data));
      console.log('[RoomCraft] project saved', {projects:Object.keys(this.data.projects).length});
      return true;
    }
    catch(e){ console.error('[RoomCraft] persist FAILED', e); toast('Could not save — browser storage may be full.', 'error'); return false; }
  },
  saveDebounced: null,
};
// Repairs the whole persisted blob after JSON.parse. localStorage can end up holding
// partially-broken data (a browser crash mid-write, a hand-edited value, a future/older
// app version's shape, etc.) — one bad project record must never crash the entire app
// on boot. Anything unusable is dropped or defaulted at the field level; sanitizeRoom /
// sanitizeRoomObject (used by both this and JSON import, below) do the same for rooms
// and furniture so a single bad piece of furniture can't take a whole room down with it.
// Shared sanitizer for one custom-asset record, used at boot (localStorage) and on
// JSON import. Handles both kinds of image-derived asset: the original flat 'billboard'
// cutout, and the newer AI-matched 'parametric' kind (see openImageToFurnitureModal),
// which references a real catalog builder (matchType) plus AI-estimated real-world
// dims/color instead of just a flat textured plane.
// Validates a stored reconstruction geometry payload — flat numeric arrays of sane
// length and magnitude — so a corrupted/hand-edited/future-format blob degrades to the
// placeholder-box fallback in buildCustomAssetMesh rather than crashing the app.
function sanitizeReconGeometry(geo){
  if(!geo || typeof geo!=='object') return null;
  const isNumArray = (arr, maxLen)=> Array.isArray(arr) && arr.length>0 && arr.length<=maxLen && arr.every(v=>typeof v==='number' && Number.isFinite(v));
  if(!isNumArray(geo.positions, 3*3*4200)) return null;
  if(geo.positions.length % 9 !== 0) return null; // must be whole triangles (3 verts × 3 comps)
  if(!isNumArray(geo.uvs, geo.positions.length/3*2 + 8)) return null;
  if(geo.uvs.length !== (geo.positions.length/3)*2) return null;
  const frontVertCount = Number(geo.frontVertCount);
  if(!Number.isFinite(frontVertCount) || frontVertCount<0 || frontVertCount>geo.positions.length/3 || frontVertCount%3!==0) return null;
  const d = geo.dims || {};
  const clamp=(v,def,min,max)=> Number.isFinite(Number(v)) ? Math.min(max,Math.max(min,Number(v))) : def;
  return {
    positions: geo.positions, uvs: geo.uvs, frontVertCount,
    bodyVertCount: Number(geo.bodyVertCount)||0,
    bodyColor: (typeof geo.bodyColor==='string' && /^#[0-9a-fA-F]{6}$/.test(geo.bodyColor)) ? geo.bodyColor : '#8a97a8',
    dims: { w:clamp(d.w,0.5,0.05,4), d:clamp(d.d,0.5,0.05,3), h:clamp(d.h,0.75,0.05,3) },
    vertexCount: geo.positions.length/3,
    triangleCount: geo.positions.length/9,
  };
}
function sanitizeCustomAsset(a, aid){
  const kind = (a.kind==='reconstructed3d' && sanitizeReconGeometry(a.geometry)) ? 'reconstructed3d'
             : (a.kind==='parametric' ? 'parametric' : 'billboard');
  const out = {
    id: aid,
    kind,
    name: typeof a.name==='string' ? a.name.slice(0,60) : 'Custom Furniture',
    dataURL: a.dataURL,
    thumbnail: typeof a.thumbnail==='string' ? a.thumbnail : a.dataURL,
    aspect: Number(a.aspect)>0 ? Number(a.aspect) : 1,
    createdAt: Number(a.createdAt) || Date.now(),
  };
  if(kind==='reconstructed3d'){
    out.geometry = sanitizeReconGeometry(a.geometry);
  }
  if(kind==='parametric'){
    out.matchType = (typeof a.matchType==='string' && findFurnitureDef(a.matchType)) ? a.matchType : 'coffee_table';
    const d = a.dims || {};
    const clamp = (v,def,min,max)=> Number.isFinite(Number(v)) ? Math.min(max,Math.max(min,Number(v))) : def;
    out.dims = { w: clamp(d.w,0.5,0.05,5), d: clamp(d.d,0.5,0.05,5), h: clamp(d.h,0.5,0.02,3) };
    out.color = (typeof a.color==='string' && /^#[0-9a-fA-F]{6}$/.test(a.color)) ? a.color : '#8a97a8';
  }
  return out;
}
function sanitizePersistedData(data){
  const empty = { projects:{}, projectOrder:[], customAssets:{}, onboardingDismissed:false, onboardingFlags:{}, seeded:false };
  if(!data || typeof data!=='object') return empty;
  const projectsIn = (data.projects && typeof data.projects==='object') ? data.projects : {};
  const sourceOrder = Array.isArray(data.projectOrder) ? data.projectOrder : Object.keys(projectsIn);
  const projects = {}; const projectOrder = []; const seen = new Set();
  const tryAdd = (id)=>{
    if(seen.has(id)) return;
    const fixed = sanitizeStoredProject(projectsIn[id], id);
    if(fixed){ projects[fixed.id]=fixed; projectOrder.push(fixed.id); }
    seen.add(id);
  };
  sourceOrder.forEach(tryAdd);
  // catch any project present in the map but missing from a corrupted/truncated order array,
  // so saved work never silently disappears just because the order list got out of sync
  Object.keys(projectsIn).forEach(tryAdd);
  const customAssetsIn = (data.customAssets && typeof data.customAssets==='object') ? data.customAssets : {};
  const customAssets = {};
  Object.keys(customAssetsIn).forEach(aid=>{
    const a = customAssetsIn[aid];
    if(a && typeof a==='object' && typeof a.dataURL==='string' && a.dataURL.startsWith('data:image')){
      customAssets[aid] = sanitizeCustomAsset(a, aid);
    }
  });
  return {
    projects, projectOrder, customAssets,
    onboardingDismissed: !!data.onboardingDismissed,
    onboardingFlags: (data.onboardingFlags && typeof data.onboardingFlags==='object') ? data.onboardingFlags : {},
    seeded: !!data.seeded,
  };
}
// Like sanitizeImportedProject (defined further down, used for JSON import) but keeps
// the project's original id/publish status/shareId, since this is data that already
// lives on this device rather than an incoming file.
function sanitizeStoredProject(p, fallbackId){
  try{
    if(!p || typeof p!=='object') return null;
    const rawRooms = (p.rooms && typeof p.rooms==='object') ? p.rooms : {};
    const roomOrderIn = Array.isArray(p.roomOrder) ? p.roomOrder : Object.keys(rawRooms);
    const rooms = {}; const roomOrder = [];
    roomOrderIn.forEach(rid=>{
      const sr = sanitizeRoom(rawRooms[rid]);
      if(sr){ rooms[sr.id]=sr; roomOrder.push(sr.id); }
    });
    assignRoomLayoutPositions(rooms, roomOrder);
    const id = (typeof p.id==='string' && p.id) ? p.id : (fallbackId || uid('proj'));
    return {
      id,
      name: (typeof p.name==='string' && p.name.trim()) ? p.name.trim() : 'Untitled Project',
      createdAt: Number(p.createdAt) || Date.now(),
      updatedAt: Number(p.updatedAt) || Number(p.createdAt) || Date.now(),
      status: p.status==='published' ? 'published' : 'draft',
      shareId: typeof p.shareId==='string' ? p.shareId : null,
      designerName: typeof p.designerName==='string' ? p.designerName : '',
      description: typeof p.description==='string' ? p.description : '',
      rooms, roomOrder,
      activeRoomId: roomOrder.includes(p.activeRoomId) ? p.activeRoomId : (roomOrder[0]||null),
      previewImage: (typeof p.previewImage==='string' && p.previewImage.startsWith('data:image')) ? p.previewImage : null,
      style: (typeof p.style==='string' && STYLE_PRESETS[p.style]) ? p.style : null,
    };
  }catch(e){ console.warn('Dropping corrupted project record', fallbackId, e); return null; }
}
Store.saveDebounced = debounce(()=>{
  setSaveStatus('saving');
  const ok = Store.persist();
  setTimeout(()=> setSaveStatus(ok?'saved':'error'), 260);
}, 500);
// Store.saveDebounced() waits 500ms before actually writing to localStorage (so rapid
// drag/edit actions don't hammer disk on every frame). That's fine for normal editing,
// but it means a hard refresh within that 500ms window of the LAST change silently loses
// it — the UI can even still say "Saved" optimistically before the real write happens.
// This flushes any pending write immediately, synchronously, right before the page
// actually unloads, so "I refreshed right after creating a room" can never lose data.
window.addEventListener('beforeunload', ()=>{ if(Store.data) Store.persist(); });
// Structural, one-off actions (creating/deleting a room, not a live drag) save immediately
// instead of waiting on the debounce — call this instead of touchProject() right after
// something the user would consider "done" and might refresh right after.
function touchProjectNow(){
  Editor.project.updatedAt = Date.now();
  setSaveStatus('saving');
  const ok = Store.persist();
  setTimeout(()=> setSaveStatus(ok?'saved':'error'), 150);
  if(App.view==='editor' && Editor.viewMode==='2d') draw2DPlan();
}
function setSaveStatus(state){
  const dot = $('.save-dot'); const label = $('#save-label');
  if(!dot||!label) return;
  if(state==='saving'){ dot.classList.add('saving'); label.textContent='Saving…'; }
  else if(state==='error'){ dot.classList.remove('saving'); label.textContent='Save failed'; }
  else { dot.classList.remove('saving'); label.textContent='Saved'; }
}

// Each builder returns a THREE.Group centered on its own local origin at floor level (y=0 = base).
// The main "colorable" mesh(es) are tagged userData.colorable = true so property panel color picker works.
function mat(color, rough=0.75, metal=0.05, envInt=1){
  const m = new THREE.MeshStandardMaterial({ color: new THREE.Color(color), roughness: rough, metalness: metal });
  m.envMapIntensity = envInt; // reflects the studio environment map for realistic material response
  return m;
}
// ---------------------------------------------------------------------------
// STUDIO ENVIRONMENT MAP — builds a small self-lit "softbox" scene (bright
// ceiling panel + warm/cool fill panels + a dim floor bounce) and bakes it
// into a PMREM environment map. Assigning this to scene.environment gives
// every MeshStandardMaterial realistic ambient/reflected light and subtle
// highlights without needing any external HDRI asset or extra network call.
function buildStudioEnvScene(){
  const s = new THREE.Scene();
  function panel(w,h,d,x,y,z,color,intensity){
    const c = new THREE.Color(color).multiplyScalar(intensity);
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshBasicMaterial({color:c}));
    m.position.set(x,y,z);
    s.add(m);
  }
  panel(9,0.15,9, 0, 6.5, 0, 0xffffff, 3.2);   // broad overhead softbox
  panel(0.15,5,5, -6, 2, 0, 0xffe1bd, 2.0);    // warm key fill (left)
  panel(0.15,5,5,  6, 2, 0, 0xcfe3ff, 1.1);    // cool ambient fill (right)
  panel(9,0.15,9,  0,-4, 0, 0x40434a, 0.5);    // dim floor bounce
  return s;
}
function generateStudioEnvMap(renderer){
  try{
    const pmrem = new THREE.PMREMGenerator(renderer);
    // sigma (2nd arg, radians) of 0.06 exceeds what this PMREMGenerator will do without
    // clipping in three.js r128 — it silently caps at ~20 samples and logs a "sigmaRadians
    // ... too large" warning every time this runs. 0.035 stays under that cap while still
    // giving a soft, blurred studio reflection (rather than a sharp mirror of the panels).
    const rt = pmrem.fromScene(buildStudioEnvScene(), 0.035);
    pmrem.dispose();
    return rt.texture;
  }catch(e){ return null; } // older/limited GPUs: fall back gracefully, lights alone still render fine
}
function box(w,h,d,color,rough,metal,type){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), type?matTex(color,type,rough,metal):mat(color,rough,metal));
  m.castShadow = true; m.receiveShadow = true; if(type) m.userData.matFamily = type; return m;
}
function cyl(rt,rb,h,color,seg=20,rough,metal,type){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), type?matTex(color,type,rough,metal):mat(color,rough,metal));
  m.castShadow = true; m.receiveShadow = true; if(type) m.userData.matFamily = type; return m;
}

// PROCEDURAL MATERIAL TEXTURES
// Small canvas-baked "grain" textures (wood grain, fabric weave, leather
// pores, brushed metal, stone speckle, rug pile, wall plaster...) used as
// neutral, near-grey multiply maps. Because they're neutral, a mesh's own
// material.color still fully controls hue — the existing color-picker /
// recolor code (which only ever touches material.color) keeps working
// exactly as before, but now that color is modulated by real surface detail
// instead of being a flat, textureless fill.
const __texCache = {};
function __makeCanvas(size){ const c=document.createElement('canvas'); c.width=c.height=size; return c; }
function __clamp255(v){ return v<0?0:v>255?255:v; }
function __applyGrain(ctx,size,amount,seed){
  const img = ctx.getImageData(0,0,size,size); const d = img.data;
  let s = seed*104729+1; // small deterministic LCG so repeated builds are stable, no Math.random() drift needed here
  for(let i=0;i<d.length;i+=4){
    s = (s*1103515245+12345)&0x7fffffff;
    const n = ((s/0x7fffffff)-0.5)*amount*255;
    d[i]=__clamp255(d[i]+n); d[i+1]=__clamp255(d[i+1]+n); d[i+2]=__clamp255(d[i+2]+n);
  }
  ctx.putImageData(img,0,0);
}
function texWood(size=256){
  const c=__makeCanvas(size), ctx=c.getContext('2d');
  ctx.fillStyle='#c9c9c9'; ctx.fillRect(0,0,size,size);
  for(let i=0;i<70;i++){
    let px = Math.random()*size;
    const shade = 165+Math.random()*70;
    ctx.strokeStyle = `rgba(${shade|0},${shade|0},${shade|0},${(0.22+Math.random()*0.32).toFixed(2)})`;
    ctx.lineWidth = 0.6+Math.random()*2.2;
    ctx.beginPath(); ctx.moveTo(px,0);
    for(let y=8;y<=size;y+=8){ px += (Math.random()-0.5)*6; ctx.lineTo(px,y); }
    ctx.stroke();
  }
  for(let i=0;i<2;i++){
    const kx=Math.random()*size, ky=Math.random()*size, kr=6+Math.random()*9;
    const grad = ctx.createRadialGradient(kx,ky,0,kx,ky,kr);
    grad.addColorStop(0,'rgba(120,120,120,0.45)'); grad.addColorStop(1,'rgba(120,120,120,0)');
    ctx.fillStyle=grad; ctx.beginPath(); ctx.ellipse(kx,ky,kr,kr*1.6,0,0,Math.PI*2); ctx.fill();
  }
  __applyGrain(ctx,size,0.045,3);
  return new THREE.CanvasTexture(c);
}
function texFloorWood(size=512){
  const c=__makeCanvas(size), ctx=c.getContext('2d');
  ctx.fillStyle='#c9c9c9'; ctx.fillRect(0,0,size,size);
  const planks=8, plankH=size/planks;
  for(let p=0;p<planks;p++){
    const y=p*plankH;
    const base = 195+Math.random()*35;
    ctx.fillStyle=`rgb(${base|0},${base|0},${base|0})`;
    ctx.fillRect(0,y+1,size,plankH-2);
    for(let i=0;i<9;i++){
      let gy = y+2+Math.random()*(plankH-4);
      const gshade = 160+Math.random()*70;
      ctx.strokeStyle=`rgba(${gshade|0},${gshade|0},${gshade|0},${(0.2+Math.random()*0.28).toFixed(2)})`;
      ctx.lineWidth = 0.8+Math.random()*1.5;
      ctx.beginPath(); ctx.moveTo(0,gy);
      for(let x=10;x<=size;x+=10){ gy += (Math.random()-0.5)*2.2; ctx.lineTo(x,gy); }
      ctx.stroke();
    }
    ctx.strokeStyle='rgba(0,0,0,0.28)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(size,y); ctx.stroke();
  }

function texFabric(size=256){

  for(let y=0;y<=size;y+=step){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(size,y); ctx.stroke(); }

  // distinct from clear glass under the same lighting.

  const fn = BUILDERS[def.id] || BUILDERS.coffee_table;

  return g;
}

/* ---------------------------- ROUTER ---------------------------- */
const App = { view:null, currentProjectId:null, };
function route(){
  $$('.scrim').forEach(s=>s.remove()); // close any open modal before navigating to a new view
  const hash = location.hash.slice(1) || '/';
  const parts = hash.split('/').filter(Boolean);
  if(parts[0]==='project' && parts[1]){
    renderEditor(parts[1]);
  } else if(parts[0]==='view' && parts[1]){
    renderClientView(parts[1]);
  } else {
    renderDashboard();
  }
}
window.addEventListener('hashchange', route);

// Room and furniture ids inside the clone are regenerated too, not just the project's
// own id — JSON.parse(JSON.stringify()) alone leaves them byte-for-byte identical to
// the source. Nothing currently does a *cross-project* id lookup, so this isn't
// causing an observable bug today, but every other clone/duplicate/import path in this
// app (duplicateRoom, JSON import) already treats ids as globally unique; leaving this
// one path inconsistent is a landmine for any future feature that assumes the same.
function duplicateProject(id){
  const src = Store.data.projects[id]; if(!src) return;
  const clone = JSON.parse(JSON.stringify(src));
  clone.id = uid('proj'); clone.name = src.name+' (Copy)'; clone.status='draft'; clone.shareId=null;
  clone.createdAt = Date.now(); clone.updatedAt = Date.now();
  const idMap = {};
  const newRooms = {};
  (clone.roomOrder||[]).forEach(oldRid=>{
    const room = clone.rooms[oldRid]; if(!room) return;
    const newRid = uid('room'); idMap[oldRid] = newRid;
    room.id = newRid;
    (room.objects||[]).forEach(o=>{ o.id = uid('obj'); });
    newRooms[newRid] = room;
  });
  clone.rooms = newRooms;
  clone.roomOrder = clone.roomOrder.map(oldRid=>idMap[oldRid]).filter(Boolean);
  clone.activeRoomId = idMap[clone.activeRoomId] || clone.roomOrder[0] || null;
  Store.data.projects[clone.id]=clone; Store.data.projectOrder.push(clone.id);
  Store.persist(); renderDashboard(); toast('Project duplicated');
}
function deleteProject(id){

    Store.persist(); renderDashboard(); toast('Project deleted');
  }, {title:'Delete project', danger:true});
}

function getProject(id){ return Store.data.projects[id]; }
// Single source of truth for "which room is active": Editor.roomId is the id, and this
// derives Editor.room (and keeps project.activeRoomId aligned) from the canonical
// project.rooms map every time it's called, instead of trusting a possibly-stale object
// reference. Called defensively at the top of every function that renders "the active
// room" (buildRoomScene, renderPropsPanel) so a room can never show as selected in the
// list while the viewport/props panel disagree.
function syncActiveRoom(){
  const project = Editor.project;
  if(!project){ Editor.room = null; return; }
  if(Editor.roomId && !project.rooms[Editor.roomId]){
    // the previously-active room id no longer exists (deleted) — fall back to the first
    // remaining room rather than silently pointing at nothing.
    Editor.roomId = project.roomOrder && project.roomOrder.length ? project.roomOrder[0] : null;
  }
  project.activeRoomId = Editor.roomId;
  Editor.room = Editor.roomId ? (project.rooms[Editor.roomId]||null) : null;
}

function duplicateRoom(rid){
  const src = Editor.project.rooms[rid]; const clone = JSON.parse(JSON.stringify(src));
  clone.id = uid('room'); clone.name = src.name+' (Copy)';
  clone.objects.forEach(o=>o.id=uid('obj'));
  clone.worldX = null; clone.worldZ = null; // let assignRoomLayoutPositions() find it a free spot beside the rest
  Editor.project.rooms[clone.id]=clone; Editor.project.roomOrder.push(clone.id);
  assignRoomLayoutPositions(Editor.project.rooms, Editor.project.roomOrder);
  buildRoomScene(); // the clone needs to actually appear in the 3D/2D scene right away, not just the room list
  refreshSidebarRoomsTab(); touchProjectNow(); toast('Room duplicated');

function deleteRoom(rid){
  if(Editor.project.roomOrder.length<=1){ toast('A project needs at least one room','error'); return; }
  const room = Editor.project.rooms[rid]; if(!room) return;
  confirmDialog('Delete "'+room.name+'"? You\u2019ll get a few seconds to undo it afterward.', ()=>{
    // Snapshot the full room (including its objects) and its exact position in
    // roomOrder BEFORE removing it, so the "Undo" toast action below can put it back
    // exactly where it was — same id, same objects, same spot in the room list —
    // rather than just re-creating an empty room with the same name.
    const snapshot = JSON.parse(JSON.stringify(room));
    const wasActive = Editor.roomId===rid;
    const orderIndex = Editor.project.roomOrder.indexOf(rid);

    delete Editor.project.rooms[rid];
    Editor.project.roomOrder = Editor.project.roomOrder.filter(x=>x!==rid);
    if(wasActive){ Editor.roomId = Editor.project.roomOrder[0]; Editor.project.activeRoomId=Editor.roomId; Editor.room=Editor.project.rooms[Editor.roomId]; Editor.history=[]; Editor.future=[]; updateUndoRedoButtons(); renderPropsPanel(); }
    buildRoomScene(); // always rebuild — even deleting a room that WASN'T active must remove its group from the scene
    refreshSidebarRoomsTab(); touchProjectNow();
    updateRoomFloatingToolbar();

    toast('Room deleted', 'default', 6000, { label:'Undo', onClick:()=>{
      if(Editor.project.rooms[snapshot.id]) return; // guard against double-click / stale toast
      Editor.project.rooms[snapshot.id] = snapshot;
      const insertAt = Math.min(orderIndex, Editor.project.roomOrder.length);
      Editor.project.roomOrder.splice(insertAt, 0, snapshot.id);
      if(wasActive){ Editor.roomId = snapshot.id; Editor.project.activeRoomId = snapshot.id; Editor.room = snapshot; Editor.history=[]; Editor.future=[]; updateUndoRedoButtons(); renderPropsPanel(); }
      buildRoomScene(); refreshSidebarRoomsTab(); touchProjectNow(); updateRoomFloatingToolbar();
      toast('Room restored', 'success');
    }});
  }, {title:'Delete room', danger:true});
}
// Rotates a room 90° clockwise in place: its footprint swaps width<->length (so a
// 4x6 room becomes 6x4), and every placed object rotates around the room's own center
// along with it — position remapped (x,z)->(-z,x) and its own rotation.y bumped by 90°
// — so furniture stays correctly oriented relative to the room instead of ending up
// sideways or outside the new bounds. Door/window wall attachments are remapped through
// the same clockwise cycle (back->right->front->left->back) so they stay on a real wall.
// The room's center (worldX/worldZ) is left untouched, matching the "keep position
// stable while changing dimensions" behavior the width/length fields already have.
function rotateRoom90(rid){
  const room = Editor.project.rooms[rid]; if(!room) return;
  pushHistory();
  const oldW = room.width, oldL = room.length;
  room.width = oldL; room.length = oldW;
  const wallCycle = {back:'right', right:'front', front:'left', left:'back'};
  room.objects.forEach(o=>{
    const x = o.position.x, z = o.position.z;
    o.position.x = -z; o.position.z = x;
    o.rotation.y = (o.rotation.y||0) + Math.PI/2;
    if(o.wall && wallCycle[o.wall]) o.wall = wallCycle[o.wall];
  });
  resnapStructuresToWalls(room);
  buildRoomScene(); touchProjectNow();
  if(Editor.viewMode==='2d') draw2DPlan();
  toast(room.name+' rotated 90°');
}
// Toolbar entry point for "Place Above"/"Place Below" on the currently-selected room.
// dir=1 stacks it onto the floor above a reference room, dir=-1 onto the floor below.
// If there's exactly one other room in the project it's used automatically (this is the
// common case — the whole point of the feature is "put this room over/under that one");
// with more than one candidate, the user is asked which room to stack relative to.
function placeRoomVertical(rid, dir){
  const room = Editor.project.rooms[rid]; if(!room) return;
  const others = Editor.project.roomOrder.filter(id=>id!==rid).map(id=>Editor.project.rooms[id]).filter(Boolean);
  if(others.length===0){ toast('Add another room first — Place Above/Below stacks this room on top of (or under) an existing one','error'); return; }
  if(others.length===1){ doPlaceRoomVertical(room, others[0], dir); return; }
  openReferenceRoomPicker(room, others, dir);
}
// Actually performs the floor move: puts `room` on the floor directly above/below `ref`,
// copying ref's X/Z footprint so it lands physically over/under it in 3D. Falls back to
// auto-flow placement on the destination floor if that exact spot is already taken there.
function doPlaceRoomVertical(room, ref, dir){
  pushHistory();
  const destFloor = (Number.isFinite(ref.floor)?ref.floor:0) + dir;
  placeRoomOnFloorRelative(room, ref, dir);
  Editor.plan2d.planFloor = room.floor; // jump the 2D view to the floor the room just moved to, so the result is immediately visible
  assignRoomLayoutPositions(Editor.project.rooms, Editor.project.roomOrder); // fills in worldX/Z if placeRoomOnFloorRelative backed off due to a collision
  buildRoomScene(); refreshSidebarRoomsTab(); renderPropsPanel(); touchProjectNow();
  if(Editor.viewMode==='2d') draw2DPlan();
  if(room.worldX===ref.worldX && room.worldZ===ref.worldZ) toast(room.name+' placed '+(dir>0?'above':'below')+' '+ref.name+' on '+floorLabel(destFloor));
}
// Small modal listing every OTHER room in the project so the user can pick which one to
// stack `room` above/below, for the (less common) case where more than one candidate
// exists and it can't just be inferred.
function openReferenceRoomPicker(room, others, dir){
  const scrim = el('div',{class:'scrim'});
  const modal = el('div',{class:'modal', style:'width:340px'});
  modal.appendChild(el('div',{class:'modal-head'}, el('h2',null, dir>0?'Place Above Which Room?':'Place Below Which Room?')));
  const body = el('div',{class:'modal-body'});
  const sel = el('select');
  others.forEach(r=> sel.appendChild(el('option',{value:r.id}, r.name+' ('+floorLabel(r.floor)+')')));
  body.appendChild(el('div',{class:'field'}, el('label',null, room.name+' will move to the floor '+(dir>0?'above':'below')+' this room, at its same X/Z position:'), sel));
  modal.appendChild(body);
  modal.appendChild(el('div',{class:'modal-foot'},
    el('button',{class:'btn',onclick:()=>scrim.remove()},'Cancel'),
    el('button',{class:'btn primary',onclick:()=>{ const ref = Editor.project.rooms[sel.value]; scrim.remove(); if(ref) doPlaceRoomVertical(room, ref, dir); }},'Place Room')
  ));
  scrim.appendChild(modal); document.body.appendChild(scrim);
  scrim.addEventListener('click',(e)=>{ if(e.target===scrim) scrim.remove(); });
}
// "Resize" reuses the existing Room Settings panel (right sidebar) rather than
// duplicating a second width/length editor — it just surfaces that panel and focuses
// the width field, exactly like selecting the room's own settings would.
function toggleRoomResizePopover(){
  deselectAll();
  setActiveRightTab('room');
  requestAnimationFrame(()=>{
    const panel = $('#props-panel'); if(!panel) return;
    const widthInput = panel.querySelector('input[type=number]');
    if(widthInput){ widthInput.focus(); widthInput.select(); }
  });
}
// Positions the room selection toolbar above the active room's on-screen footprint in
// the 2D plan, using the pan/zoom transform draw2DPlan() last stashed on Editor.plan2d
// — same approach as positionFloatingToolbar() uses for the 3D furniture toolbar, just
// against the 2D canvas's own coordinate space instead of a 3D->screen projection.
function positionRoomFloatingToolbar(){
  const bar = $('#room-floating-toolbar'); if(!bar || bar.classList.contains('hidden')) return;
  const room = Editor.room; const wrap = $('#viewport-wrap');
  if(!room || !wrap) return;
  const scale = Editor.plan2d.screenScale||40, ox=Editor.plan2d.screenOx||0, oz=Editor.plan2d.screenOz||0;
  const topPx = oz + ((room.worldZ||0) - room.length/2)*scale;
  const centerPx = ox + (room.worldX||0)*scale;
  const barW = bar.offsetWidth||220, barH = bar.offsetHeight||40;
  const left = clamp(centerPx-barW/2, 8, Math.max(8, wrap.clientWidth-barW-8));
  const top = clamp(topPx-barH-12, 8, Math.max(8, wrap.clientHeight-barH-8));
  bar.style.left = left+'px'; bar.style.top = top+'px';
}
// Builds/refreshes the room selection toolbar's contents — only visible in the 2D plan
// (dragging the room directly is the "Move" tool; there's nothing to toggle for it, it
// always works), showing Rotate / Resize / Duplicate / Delete for whichever room is
// currently active. Called whenever the active room, room list, or view mode changes.
function updateRoomFloatingToolbar(){
  const bar = $('#room-floating-toolbar'); if(!bar) return;
  const activeRoomFloor = Editor.room ? (Number.isFinite(Editor.room.floor)?Editor.room.floor:0) : null;
  const onVisibleFloor = Editor.plan2d.planFloor==='all' || activeRoomFloor===Editor.plan2d.planFloor;
  if(Editor.viewMode!=='2d' || !Editor.room || !Editor.project || !Editor.project.roomOrder.length || !onVisibleFloor){
    bar.classList.add('hidden'); bar.innerHTML=''; return;
  }
  bar.classList.remove('hidden');
  bar.innerHTML='';
  const ftBtn = (icon,title,fn,extraClass)=>{ const b = el('button',{title, class:extraClass||'', html:svgIcon(icon)}); b.addEventListener('click',fn); return b; };
  bar.appendChild(el('span',{class:'ft-label'}, Editor.room.name+' · '+floorLabel(activeRoomFloor)));
  bar.appendChild(el('div',{class:'ft-sep'}));
  const moveBtn = el('button',{class:'active', title:'Move — click and drag the room anywhere on the plan', html:svgIcon('move')});
  // This button doesn't toggle a mode (dragging the room body on the canvas always
  // works, with no tool to switch on first) — but leaving it with no handler at all
  // makes it look broken when clicked, indistinguishable from a dead control, since it's
  // styled identically to Rotate/Resize/Duplicate/Delete right next to it which DO act
  // on click. Give it a click handler that surfaces the real instruction instead of
  // silently doing nothing.
  moveBtn.addEventListener('click', ()=> toast('Click and drag the room itself on the plan to move it'));
  bar.appendChild(moveBtn);
  bar.appendChild(ftBtn('rotate','Rotate 90°', ()=>rotateRoom90(Editor.roomId)));
  bar.appendChild(ftBtn('scale','Resize', toggleRoomResizePopover));
  bar.appendChild(ftBtn('copy','Duplicate', ()=>duplicateRoom(Editor.roomId)));
  // Vertical floor placement — moves the selected room onto the floor directly above/
  // below another room, preserving its X/Z footprint so it lands physically over/under
  // it in 3D instead of just changing its 2D position.
  bar.appendChild(el('div',{class:'ft-sep'}));
  bar.appendChild(ftBtn('arrow-up','Place Above — move to the floor above another room', ()=>placeRoomVertical(Editor.roomId,1)));
  bar.appendChild(ftBtn('arrow-down','Place Below — move to the floor below another room', ()=>placeRoomVertical(Editor.roomId,-1)));
  bar.appendChild(ftBtn('trash','Delete', ()=>deleteRoom(Editor.roomId), 'ft-danger'));
  positionRoomFloatingToolbar();
}

function refreshCustomAssetGrid(grid){
  grid = grid || $('#custom-asset-grid');

  const ids = Object.keys(Store.data.customAssets);

    const badgeText = isReconstructed ? '◆ REAL 3D MODEL' : (isParametric ? '✨ AI 3D MATCH' : '2.5D ASSET');
    const a11yTag = isReconstructed ? ' (real reconstructed 3D model)' : (isParametric ? ' (AI-matched 3D furniture)' : ' (2.5D asset)');

    card.addEventListener('pointerdown',(e)=> beginAssetPointerDrag(card, e, null, aid, ghostIcon, asset.name));
    card.addEventListener('click',()=>{ if(Editor._suppressNextClick){ Editor._suppressNextClick=false; return; } addCustomAssetToRoom(aid, null); });
    makeActivatable(card, ()=> addCustomAssetToRoom(aid, null), 'Add '+asset.name+' to room'+a11yTag);
    const delBtn = el('button',{class:'small-icon-btn', style:'position:absolute;top:4px;right:4px;background:rgba(23,36,58,.65)', title:'Delete this 2.5D asset', 'aria-label':'Delete '+asset.name, html:svgIcon('trash')});
    delBtn.addEventListener('click',(e)=>{ e.stopPropagation(); deleteCustomAsset(aid); });
