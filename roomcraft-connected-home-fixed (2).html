// Removes an uploaded 2.5D asset from the library. It's destructive (the original
// image is gone, and it can't be un-deleted the way object edits can via undo — this
// isn't part of the room's undo history since it's a cross-project library asset, not
// room state), so it's confirmed the same way project/room deletion already is.
// Any furniture already placed using this asset (in this room or any other project)
// isn't deleted — it already renders via buildCustomAssetMesh()'s graceful fallback
// (a plain placeholder box) whenever its assetId can't be resolved, so nothing breaks;
// the user is just told up front if that's about to happen for the room they're in.
function deleteCustomAsset(aid){
  const asset = Store.data.customAssets[aid]; if(!asset) return;
  const usedHere = Editor.room ? Editor.room.objects.filter(o=>o.category==='custom' && o.assetId===aid).length : 0;
  const warning = usedHere>0
    ? ('Delete "'+asset.name+'"? '+usedHere+' item'+(usedHere!==1?'s':'')+' in this room use it and will show as a placeholder box afterward. This cannot be undone.')
    : ('Delete "'+asset.name+'"? This cannot be undone.');
  confirmDialog(warning, ()=>{
    delete Store.data.customAssets[aid];
    Store.persist();
    refreshCustomAssetGrid();
    if(usedHere>0) buildRoomScene(); // repaint the now-orphaned instances as placeholders immediately, rather than leaving stale meshes until the next unrelated rebuild
    toast('Custom asset deleted');
  }, {title:'Delete asset', danger:true});
}

function setActiveTool(tool){
  Editor.activeTool = tool;
  // select by data-tool rather than positional index into every toolbar button (which
  // also includes Duplicate/Delete) — that indexing only worked because of DOM order
  // and would silently pick the wrong button if the toolbar were ever reordered.
  $$('.gizmo-toolbar button[data-tool]').forEach(b=>b.classList.toggle('active', b.dataset.tool===tool));
  $$('.floating-toolbar [data-tool]').forEach(b=>b.classList.toggle('active', b.dataset.tool===tool));
  // THREE.TransformControls only recognizes 'translate'/'rotate'/'scale' — our own
  // Editor.activeTool keeps the friendlier 'move' name for buttons/shortcuts/state.
  if(Editor.transformControls) Editor.transformControls.setMode(tool==='move'?'translate':tool);
}

function setViewMode(mode){

// Keeps the 2D plan live-synced with room state (dimension edits, furniture added/moved/
// deleted, undo/redo, style changes, AI Copilot actions, ...) without needing every one of
// those call sites to individually remember to redraw the plan. Mirrors the pattern already
// used by the 3D animate() loop, and self-stops once we leave the editor or the 2D view.
function startPlan2DLoop(){
  if(Editor.plan2d.animReq) return;
  function loop(){
    if(App.view!=='editor' || Editor.viewMode!=='2d'){ Editor.plan2d.animReq=null; return; }
    Editor.plan2d.animReq = requestAnimationFrame(loop);
    draw2DPlan();
  }
  loop();
}

/* ---------------------------- THREE.JS: INIT ---------------------------- */
function initThree(){
  const holder = $('#three-canvas-holder');
  if(typeof THREE==='undefined' || !THREE.WebGLRenderer){
    console.error('[RoomCraft] initThree() FAILED — THREE.js did not load (typeof THREE:', typeof THREE, '). '+
      'This is almost always the cdn.jsdelivr.net <script> tags being blocked (ad blocker, corporate/network firewall, '+
      'CSP, or offline). The 3D viewport and "No room yet" state cannot update without this loading successfully — '+
      'check the Network tab for failed requests to cdn.jsdelivr.net/npm/three@0.128.0.');
    showThreeLoadError(holder);
    Editor.threeAvailable = false;
    refreshThreeDependentControls();
    return;
  }
  console.log('[RoomCraft] initThree() succeeded, THREE r'+(THREE.REVISION||'?'));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xdfe4e8);
  const camera = new THREE.PerspectiveCamera(50, holder.clientWidth/holder.clientHeight, 0.05, 500);
  camera.position.set(5,5,7);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(holder.clientWidth, holder.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; // filmic highlight rolloff for a premium, camera-like render
  renderer.toneMappingExposure = 1.1;
  holder.appendChild(renderer.domElement);
  scene.environment = generateStudioEnvMap(renderer); // realistic ambient/reflected light on all materials

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0,1,0); controls.maxPolarAngle = Math.PI*0.49; controls.minDistance=1; controls.maxDistance=40;
  controls.update();

  const tcontrols = new THREE.TransformControls(camera, renderer.domElement);
  tcontrols.setSize(0.9);
  tcontrols.addEventListener('dragging-changed', (e)=>{
    controls.enabled = !e.value;
    if(!e.value){ commitTransform(); Editor._suppressClick = true; setTimeout(()=>{ Editor._suppressClick=false; }, 80); }
  });
  tcontrols.addEventListener('objectChange', ()=>{ syncPropsFromObject(); updateOverlapHighlight(); });
  scene.add(tcontrols);

  const grid = new THREE.GridHelper(40,80,0x999999,0xcccccc); grid.position.y=0.001; scene.add(grid);
  Editor.gridHelper = grid;

  Editor.scene=scene; Editor.camera=camera; Editor.renderer=renderer; Editor.controls=controls; Editor.transformControls=tcontrols;
  Editor.raycaster = new THREE.Raycaster();
  Editor.lightsGroup = new THREE.Group(); scene.add(Editor.lightsGroup);
  Editor.threeAvailable = true;
  refreshThreeDependentControls();

  renderer.domElement.addEventListener('click', onCanvasClick);
  renderer.domElement.addEventListener('dragover',(e)=>e.preventDefault());
  renderer.domElement.addEventListener('drop', onCanvasDrop);
  renderer.domElement.addEventListener('pointerdown', on3DRoomPointerDown);
  renderer.domElement.addEventListener('pointermove', on3DRoomPointerMove);
  renderer.domElement.addEventListener('pointerup', on3DRoomPointerUp);
  renderer.domElement.addEventListener('pointercancel', on3DRoomPointerUp);

  function animate(){
    if(App.view!=='editor'){ Editor.animReq=null; return; }
    Editor.animReq = requestAnimationFrame(animate);
    if(Editor.walkthrough) updateWalkthrough();
    Editor.controls.update();
    Editor.renderer.render(Editor.scene, Editor.camera);
  }
  animate();
}
// Recursively frees GPU resources (geometries, materials, textures) for everything
// under obj. THREE.Object3D removal from the scene graph does NOT free these on its
// own — skipping this on every room rebuild/switch is what leaks memory over a long
// editing session.
function disposeObject3D(obj){
  if(!obj || !obj.traverse) return;
  obj.traverse(o=>{
    if(o.isMesh || o.isLine || o.isPoints){
      if(o.geometry) o.geometry.dispose();
      const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
      mats.forEach(disposeMaterial);
    }
  });
}
// Disposes a single material and its own (non-shared-cache) textures — the same
// rule disposeObject3D() applies per-mesh, factored out so any code path that
// swaps out just one material (material-preset changes on furniture, floor, or
// walls) can release the old one correctly instead of leaking its texture.
function disposeMaterial(m){
  if(!m) return;
  ['map','normalMap','roughnessMap','metalnessMap','alphaMap','emissiveMap','aoMap','bumpMap'].forEach(k=>{
    const tx = m[k];
    // sharedCache textures (see getTexture()) are the small, fixed-size,
    // session-global material-grain cache reused across every piece of
    // furniture of that type — never dispose those here, only per-instance
    // textures (repeat-tiled clones, uploaded 2.5D custom-asset images) that
    // genuinely belong to just this one mesh/material.
    if(tx && tx.dispose && !(tx.userData && tx.userData.sharedCache)) tx.dispose();
  });
  if(m.dispose) m.dispose();
}
function teardownEditorScene(){
  if(Editor.animReq) cancelAnimationFrame(Editor.animReq);
  Editor.animReq=null;
  if(Editor.scene){
    disposeObject3D(Editor.scene);
    // scene.environment (the PMREM studio env map) is a texture assigned directly on
    // the Scene object, not part of the Object3D graph — disposeObject3D's traverse()
    // never reaches it. Without this, every re-entry into the editor or client view
    // generates a brand new render-target texture via generateStudioEnvMap() while the
    // previous one is silently abandoned on the GPU.
    if(Editor.scene.environment && Editor.scene.environment.dispose){ try{ Editor.scene.environment.dispose(); }catch(e){} }
  }
  if(Editor.renderer){
    if(Editor.renderer.dispose){ try{ Editor.renderer.dispose(); }catch(e){} }
    try{
      const canvas = Editor.renderer.domElement;
      if(canvas && canvas.parentNode) canvas.parentNode.removeChild(canvas);
    }catch(e){}
  }
  Editor.scene=null; Editor.renderer=null; Editor.controls=null; Editor.transformControls=null;
  Editor.roomGroup=null; Editor.objectMeshes={}; Editor.wallMeshes=[]; Editor.floorMesh=null; Editor.ceilingMesh=null;
  Editor.roomGroups={}; Editor.roomMeshCache={};
  Editor.lightsGroup=null; Editor.gridHelper=null;
}
// bound once; reads the live Editor/ClientEditor renderer so it works for both the
// editor viewport and the client presentation viewport without re-registering per load
window.addEventListener('resize', ()=>{
  if((App.view!=='editor' && App.view!=='client') || !Editor.renderer || !Editor.camera) return;
  const h = $('#three-canvas-holder') || $('#client-canvas-holder'); if(!h || h.clientWidth===0) return;
  Editor.camera.aspect = h.clientWidth/h.clientHeight; Editor.camera.updateProjectionMatrix();
  Editor.renderer.setSize(h.clientWidth,h.clientHeight);
  if(App.view==='editor' && Editor.viewMode==='2d') draw2DPlan();
});

/* ---------------------------- ROOM BUILD ---------------------------- */
function clearRoomGroup(){
  if(Editor.roomGroup){
    Editor.scene.remove(Editor.roomGroup);
    disposeObject3D(Editor.roomGroup); // free the outgoing room's meshes before building the next one
  }
  Editor.roomGroup = new THREE.Group(); Editor.scene.add(Editor.roomGroup);
  Editor.objectMeshes = {}; Editor.wallMeshes=[]; Editor.floorMesh=null; Editor.ceilingMesh=null;
  Editor.selectedId=null; Editor.selectedIds=new Set(); Editor.pivotGroup=null;
  Editor.transformControls && Editor.transformControls.detach();
  clearSnapGuides();
  if(Editor.measureLine){ Editor.scene.remove(Editor.measureLine); Editor.measureLine=null; }
  Editor.measurePoints = [];
}
// Disposes and removes every room's group from the scene (all of Editor.roomGroups),
// not just the active one. This is the multi-room counterpart to clearRoomGroup() above
// — buildRoomScene() uses this so it can safely rebuild ALL rooms from scratch on every
// call without leaking the previous build's meshes/textures.
function clearAllRoomGroups(){
  Object.values(Editor.roomGroups||{}).forEach(grp=>{
    if(!grp) return;
    if(Editor.scene) Editor.scene.remove(grp);
    disposeObject3D(grp);
  });
  Editor.roomGroups = {}; Editor.roomMeshCache = {};
  Editor.roomGroup = null; Editor.objectMeshes = {}; Editor.wallMeshes=[]; Editor.floorMesh=null; Editor.ceilingMesh=null;
  Editor.selectedId=null; Editor.selectedIds=new Set(); Editor.pivotGroup=null;
  Editor.transformControls && Editor.transformControls.detach();
  clearSnapGuides();
  if(Editor.measureLine){ Editor.scene.remove(Editor.measureLine); Editor.measureLine=null; }
  Editor.measurePoints = [];
}
// matTex() builds a canvas-baked procedural texture per material family. If that ever
// throws (bad material key, a canvas/texture edge case, etc.) we do NOT want the whole
// room build to die silently mid-function — that would leave floor/walls/ceiling
// partially or entirely un-added with no visible error, which is exactly the "empty
// grid, no room" symptom this used to be able to produce. Every material call in
// buildOneRoomGeometry() goes through this wrapper so a texture failure degrades to a
// flat color instead of nuking the whole room.
function safeMatTex(color, type, roughOverride, metalOverride, envInt, repeat){
  try{
    return matTex(color, type, roughOverride, metalOverride, envInt, repeat);
  }catch(err){
    console.error('[RoomCraft] matTex() failed for type="'+type+'" — falling back to flat material', err);
    try{ return mat(color, roughOverride, metalOverride, envInt); }
    catch(err2){ console.error('[RoomCraft] flat material fallback also failed — using MeshBasicMaterial', err2); return new THREE.MeshBasicMaterial({color: new THREE.Color(color)}); }
  }
}
// Builds the floor/walls/ceiling/furniture for ONE room into whatever Editor.roomGroup
// currently points at, tracking the meshes it creates into Editor.wallMeshes/floorMesh/
// ceilingMesh/objectMeshes (also whatever they currently point at). This is deliberately
// unaware of which room is "active" or where it sits in world space — the caller
// (buildRoomScene) is responsible for pointing Editor.roomGroup at the right THREE.Group
// (already positioned at the room's worldX/worldZ) before calling this, and for stashing
// the resulting registries afterward. That separation is what lets the exact same
// per-room build logic run once per room in a loop, instead of only ever running once
// for a single hardcoded "the room".
// Returns false (and leaves an empty group) if the room's dimensions are invalid.
function buildOneRoomGeometry(room){
  const W = room.width, D = room.length, H = room.height, T = room.thickness;
  if(!(W>0) || !(D>0) || !(H>0)){
    console.error('[RoomCraft] buildOneRoomGeometry() ABORTED for room', room && room.id, '— invalid/non-positive dimensions', {W,D,H});
    return false;
  }
  try{
    // floor
    const floorGeo = new THREE.PlaneGeometry(W,D);
    const floorMesh = new THREE.Mesh(floorGeo, safeMatTex(room.floorColor,room.floorMaterial||'floorwood',0.55,0.03,1.15,[Math.max(2,Math.round(W*1.3)),Math.max(2,Math.round(D*1.3))]));
    floorMesh.rotation.x=-Math.PI/2; floorMesh.receiveShadow=true; floorMesh.userData.isFloor=true;
    Editor.roomGroup.add(floorMesh); Editor.floorMesh = floorMesh;
  }catch(err){
    console.error('[RoomCraft] FLOOR creation failed — building a guaranteed fallback floor with a plain material', err);
    const fallbackFloor = new THREE.Mesh(new THREE.PlaneGeometry(W,D), new THREE.MeshStandardMaterial({color:0xc9a877}));
    fallbackFloor.rotation.x=-Math.PI/2; fallbackFloor.receiveShadow=true; fallbackFloor.userData.isFloor=true;
    Editor.roomGroup.add(fallbackFloor); Editor.floorMesh = fallbackFloor;
  }
  // walls (4) — back(-z) front(+z) left(-x) right(+x). All four always generated and
  // visible per spec: a wall is only ever omitted by an explicit door/window opening on
  // it (doors/windows are separate objects placed against the wall), never just because
  // the camera happens to be positioned inside/near the room.
  try{
    const wallMat = ()=>safeMatTex(room.wallColor,room.wallMaterial||'plaster',0.88,0.02,0.55,[Math.max(2,Math.round(W)),Math.max(1,Math.round(H))]);
    const wBack = new THREE.Mesh(new THREE.BoxGeometry(W+T,H,T), wallMat()); wBack.position.set(0,H/2,-D/2-T/2); wBack.userData.isWall='back';
    const wFront = new THREE.Mesh(new THREE.BoxGeometry(W+T,H,T), wallMat()); wFront.position.set(0,H/2,D/2+T/2); wFront.userData.isWall='front';
    const wLeft = new THREE.Mesh(new THREE.BoxGeometry(T,H,D+T), wallMat()); wLeft.position.set(-W/2-T/2,H/2,0); wLeft.userData.isWall='left';
    const wRight = new THREE.Mesh(new THREE.BoxGeometry(T,H,D+T), wallMat()); wRight.position.set(W/2+T/2,H/2,0); wRight.userData.isWall='right';
    [wBack,wFront,wLeft,wRight].forEach(w=>{ w.castShadow=true; w.receiveShadow=true; Editor.roomGroup.add(w); Editor.wallMeshes.push(w); });
  }catch(err){
    console.error('[RoomCraft] WALLS creation failed — building guaranteed fallback walls with a plain material', err);
    const fm = new THREE.MeshStandardMaterial({color:0xefe6d8});
    const wBack = new THREE.Mesh(new THREE.BoxGeometry(W+T,H,T), fm); wBack.position.set(0,H/2,-D/2-T/2);
    const wFront = new THREE.Mesh(new THREE.BoxGeometry(W+T,H,T), fm); wFront.position.set(0,H/2,D/2+T/2);
    const wLeft = new THREE.Mesh(new THREE.BoxGeometry(T,H,D+T), fm); wLeft.position.set(-W/2-T/2,H/2,0);
    const wRight = new THREE.Mesh(new THREE.BoxGeometry(T,H,D+T), fm); wRight.position.set(W/2+T/2,H/2,0);
    [wBack,wFront,wLeft,wRight].forEach(w=>{ w.castShadow=true; w.receiveShadow=true; Editor.roomGroup.add(w); Editor.wallMeshes.push(w); });
  }
  if(room.ceilingOn){
    try{
      const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W,D), safeMatTex(room.wallColor,'plaster',0.95,0,0.3,[Math.max(2,Math.round(W)),Math.max(2,Math.round(D))]));
      // DoubleSide is required here: after the 90° rotation this plane's front-face
      // normal points straight down (correct for viewing it from inside the room,
      // looking up) but the app's default camera framing looks down INTO the room
      // from above/outside, i.e. at the ceiling's back face — which THREE.FrontSide
      // (the material default) culls entirely. Without this the "Show ceiling" toggle
      // silently does nothing from the app's own default viewing angle.
      ceil.material.side = THREE.DoubleSide;
      ceil.rotation.x=Math.PI/2; ceil.position.y=H; ceil.receiveShadow=true; ceil.userData.isCeiling=true;
      Editor.roomGroup.add(ceil); Editor.ceilingMesh = ceil;
    }catch(err){
      console.error('[RoomCraft] CEILING creation failed — skipping ceiling (floor/walls unaffected)', err);
    }
  }
  // objects
  try{
    room.objects.forEach(o=> instantiateObject(o));
  }catch(err){
    console.error('[RoomCraft] instantiating placed objects failed partway through — room shell (floor/walls) is unaffected', err);
  }
  return true;
}
// Adds a faint orange edge outline around a room's floor footprint to mark it as the
// currently-active/selected room, without touching its materials (so recoloring the
// active room's walls/floor for editing purposes is unaffected by this). Inactive rooms
// get no outline — they're still fully rendered and lit, just not marked as selected.
function applyRoomHighlight(room, group, isActive){
  if(!isActive) return;
  try{
    const W=room.width, D=room.length;
    const pts = [[-W/2,-D/2],[W/2,-D/2],[W/2,D/2],[-W/2,D/2],[-W/2,-D/2]].map(([x,z])=>new THREE.Vector3(x,0.02,z));
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({color:0xF0783C, linewidth:2}));
    line.userData.isActiveRoomOutline = true;
    group.add(line);
  }catch(err){ console.error('[RoomCraft] active-room outline failed (non-fatal)', err); }
}
// Renders EVERY room in the project simultaneously — rooms[] drives what's in the
// scene, Editor.roomId/Editor.room only drives which one is selected/editable/
// highlighted. Each room gets its own THREE.Group positioned at (room.worldX,0,
// room.worldZ) so they never overlap; all groups stay in the scene together regardless
// of which one is active. After the loop, the singular Editor.roomGroup/objectMeshes/
// wallMeshes/floorMesh/ceilingMesh are repointed at the ACTIVE room's registries, so
// every other function in this file that edits/selects "the current room" (furniture
// add/drag/delete, wall recolor, transform controls, etc.) keeps working unmodified —
// it's just always looking at the active room's own group now instead of the only group.
function buildRoomScene(){
  console.log('[RoomCraft] buildRoomScene() called', {'Editor.scene exists':!!Editor.scene, 'Editor.roomId':Editor.roomId, 'Editor.room before sync':Editor.room && Editor.room.id});
  if(!Editor.scene){ console.warn('[RoomCraft] buildRoomScene() aborted — Editor.scene is not set. This means initThree() has not run or failed (check for a Three.js load error above).'); return; }
  syncActiveRoom(); // defensive: re-derive the active room from the canonical project.rooms map
                     // by id, rather than trusting whatever Editor.room happens to already hold.
  clearAllRoomGroups();
  refreshSidebarRoomsTab();
  const project = Editor.project;
  const hint = $('#empty-hint');
  if(!project || !project.roomOrder || project.roomOrder.length===0){
    if(hint){ hint.classList.remove('hidden'); hint.querySelector('b').textContent='No room yet'; hint.querySelector('span').textContent='Create a room from the Rooms tab to begin.'; }
    applyLightingToScene();
    if(Editor.viewMode==='2d') draw2DPlan();
    updateRoomFloatingToolbar();
    updateFloorSelectorUI();
    return;
  }
  assignRoomLayoutPositions(project.rooms, project.roomOrder); // fills in worldX/worldZ for any room that doesn't have one yet
  let activeOk = false, anyBuilt = false;
  project.roomOrder.forEach(rid=>{
    const room = project.rooms[rid]; if(!room) return;
    const isActive = rid===Editor.roomId;
    const group = new THREE.Group();
    group.name = 'roomgroup_'+rid;
    // Y offset comes from the room's floor/level — rooms on a higher floor stack
    // physically above rooms beneath them using the real accumulated room heights,
    // rather than sharing Y=0 and just overlapping in space.
    group.position.set(room.worldX||0, floorBaseY(project, room.floor), room.worldZ||0);
    Editor.scene.add(group);
    Editor.roomGroups[rid] = group;
    // point the shared "current working room" globals at THIS room's group/registries
    // while we build it — buildOneRoomGeometry()/instantiateObject() read these.
    Editor.roomGroup = group;
    Editor.objectMeshes = {}; Editor.wallMeshes = []; Editor.floorMesh = null; Editor.ceilingMesh = null;
    const ok = buildOneRoomGeometry(room);
    applyRoomHighlight(room, group, isActive);
    // stash this room's own registry snapshot so switching rooms later doesn't need a rebuild
    Editor.roomMeshCache[rid] = { objectMeshes:Editor.objectMeshes, wallMeshes:Editor.wallMeshes, floorMesh:Editor.floorMesh, ceilingMesh:Editor.ceilingMesh };
    if(ok) anyBuilt = true;
    if(isActive) activeOk = ok;
  });
  // repoint the shared globals at the ACTIVE room's own registry for every other
  // function (selection, furniture add/drag, material edits, etc.) to use from here on
  const activeCache = Editor.roomMeshCache[Editor.roomId];
  Editor.roomGroup = Editor.roomGroups[Editor.roomId] || null;
  Editor.objectMeshes = (activeCache && activeCache.objectMeshes) || {};
  Editor.wallMeshes = (activeCache && activeCache.wallMeshes) || [];
  Editor.floorMesh = (activeCache && activeCache.floorMesh) || null;
  Editor.ceilingMesh = (activeCache && activeCache.ceilingMesh) || null;
  console.log('[RoomCraft] scene children after multi-room generation:', Editor.scene.children.length, '| rooms built:', Object.keys(Editor.roomGroups).length);
  // camera framing — fits the ACTIVE room (the "Fit all rooms" button/control is the
  // explicit way to frame the whole multi-room layout instead)
  try{ frameRoomCamera(); }
  catch(err){ console.error('[RoomCraft] frameRoomCamera() failed — camera left at previous position, room geometry is still in the scene', err); }
  try{ applyLightingToScene(); }
  catch(err){ console.error('[RoomCraft] applyLightingToScene() failed', err); }
  if(!Editor.room){
    if(hint){ hint.classList.remove('hidden'); hint.querySelector('b').textContent='No room yet'; hint.querySelector('span').textContent='Create a room from the Rooms tab to begin.'; }
  } else if(!activeOk){
    if(hint){ hint.classList.remove('hidden'); hint.querySelector('b').textContent='Room has invalid dimensions'; hint.querySelector('span').textContent='Edit the room\'s width/length/height to fix the 3D view.'; }
  } else {
    updateEmptyHint(); // restores the normal "this room is empty" hint text/visibility, in case a previous build left the invalid-dimensions message showing
  }
  console.log('[RoomCraft] 3D render complete');
  // keep the 2D floor plan (if that's the active view) in lockstep with whatever
  // just changed — dimension edits, style application, undo/redo, layout suggestions,
  // adding/deleting/duplicating a room, etc. all funnel through buildRoomScene(), so
  // this one hook is enough to guarantee 2D never goes stale without hunting down every
  // call site. The room selection toolbar rides along the same hook, for the same reason.
  if(Editor.viewMode==='2d') draw2DPlan();
  updateRoomFloatingToolbar();
  updateFloorSelectorUI();
}
// Frames the camera to the current room's full extent. Factored out of buildRoomScene()
// so it can also be triggered on demand (the "Fit room" viewport button) without doing a
// full scene rebuild — e.g. after the user has manually orbited/panned/zoomed away.
function frameRoomCamera(){
  if(!Editor.room || !Editor.camera || !Editor.controls) return;
  const W = Editor.room.width, D = Editor.room.length, H = Editor.room.height;
  const ox = Editor.room.worldX||0, oz = Editor.room.worldZ||0;
  const baseY = floorBaseY(Editor.project, Editor.room.floor);
  const dist = Math.max(W,D)*1.15+2;
  Editor.camera.position.set(ox+dist*0.6, baseY+Math.max(H*1.8,3), oz+dist*0.75);
  Editor.controls.target.set(ox, baseY+H*0.35, oz); Editor.controls.update();
}
// Frames the camera to the full extent of EVERY room in the project (their combined
// world-space bounding box), rather than just the active one — this is what backs the
// "Fit all rooms" control, giving a full-layout overview instead of a single-room fit.
function frameAllRoomsCamera(){
  if(!Editor.project || !Editor.camera || !Editor.controls) return;
  const b = computeLayoutBounds(Editor.project);
  const H = (Editor.room && Editor.room.height) || DEFAULT_ROOM_HEIGHT;
  // account for every floor in the project so a multi-level layout frames its full
  // vertical extent, not just the height of one room
  let minFloor=0, maxFloor=0;
  (Editor.project.roomOrder||[]).forEach(rid=>{
    const r = Editor.project.rooms[rid]; if(!r) return;
    const f = Number.isFinite(r.floor)?r.floor:0;
    minFloor = Math.min(minFloor,f); maxFloor = Math.max(maxFloor,f);
  });
  const topY = floorBaseY(Editor.project, maxFloor) + H;
  const bottomY = floorBaseY(Editor.project, minFloor);
  const vSpan = Math.max(topY-bottomY, H);
  const dist = Math.max(b.width, b.depth, vSpan)*1.15+3;
  Editor.camera.position.set(b.cx+dist*0.6, Math.max(bottomY+vSpan*1.1,bottomY+4), b.cz+dist*0.85);
  Editor.controls.target.set(b.cx, bottomY+vSpan*0.3, b.cz); Editor.controls.update();
}
function updateEmptyHint(){
  const hint = $('#empty-hint'); if(!hint || !Editor.room) return;
  const has = Editor.room.objects.length>0;
  hint.classList.toggle('hidden', has);
  hint.querySelector('b').textContent='This room is empty';
  hint.querySelector('span').textContent='Drag furniture from the left panel, or click an item to add it.';
}
function instantiateObject(o){
  const group = instantiateObjectBase(o);
  applyObjectFlags(o, group);
  return group;
}
// Visualizes the persisted lock/hidden state on a freshly built mesh — kept as a thin
// wrapper around the original builder so every call site (initial load, duplicate,
// undo/redo, room switch, material rebuilds) picks it up automatically.
function applyObjectFlags(o, group){
  group.visible = !o.hidden;
  group.userData.locked = !!o.locked;
  group.userData.hidden = !!o.hidden;
}
function instantiateObjectBase(o){
  const isCustom = o.category==='custom';
  let group;
  if(isCustom) group = buildCustomAssetMesh(o);
  else {
    const def = findFurnitureDef(o.type)||{};
    group = buildFurnitureMesh({...def, id:o.type, color:o.color||def.color||'#8a97a8'});
    // Re-applies a saved material preset (if any) on top of the freshly-built,
    // correctly-shaped mesh — covers initial load, duplicate, undo/redo and
    // room-switch, since they all funnel through instantiateObject.
    if(o.materialId) applyMaterialOverrideToGroup(group, o.materialId, o.color);
  }
  group.position.set(o.position.x,o.position.y,o.position.z);
  group.rotation.set(o.rotation.x,o.rotation.y,o.rotation.z);
  group.scale.set(o.scale.x,o.scale.y,o.scale.z);
  group.userData.objId = o.id;
  Editor.roomGroup.add(group);
  Editor.objectMeshes[o.id]=group;
  return group;
}
// Fully rebuilds the mesh for a room object (used when clearing a material
// preset back to the furniture's default look, since parts can span several
// baked-in material families that a simple in-place swap can't cleanly undo).
// Mirrors the dispose+instantiate pattern already used by deleteSelected/duplicateSelected.
function rebuildObjectMesh(o){
  const wasSelected = Editor.selectedId===o.id;
  const old = Editor.objectMeshes[o.id];
  if(old){ Editor.roomGroup.remove(old); disposeObject3D(old); delete Editor.objectMeshes[o.id]; }
  const g = instantiateObject(o);
  if(wasSelected) selectObject(o.id);
  return g;
}

/* ---------------------------- SELECTION / TRANSFORM ---------------------------- */
function onCanvasClick(e){
  if(Editor.walkthrough) return;
  if(Editor._suppressClick) return;
  if(Editor.measureMode){ handleMeasureClick(e); return; }
  const holder = $('#three-canvas-holder'); const rect = holder.getBoundingClientRect();
  Editor.mouse.x = ((e.clientX-rect.left)/rect.width)*2-1;
  Editor.mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
  Editor.raycaster.setFromCamera(Editor.mouse, Editor.camera);
  const targets = Object.values(Editor.objectMeshes).filter(m=>m.visible);
  const hits = Editor.raycaster.intersectObjects(targets, true);
  if(hits.length){
    let g = hits[0].object; while(g.parent && !g.userData.objId) g = g.parent;
    if(g.userData.objId) selectObject(g.userData.objId, e.shiftKey);
    return;
  }
  // wall/floor selection
  const structTargets = [...Editor.wallMeshes.filter(w=>w.visible), Editor.floorMesh].filter(Boolean);
  const shits = Editor.raycaster.intersectObjects(structTargets, false);
  if(shits.length){ selectStructure(shits[0].object); return; }
  deselectAll();
}
// Selects an object. `additive` (shift-click) adds/removes it from the current
// multi-selection instead of replacing it. If the object belongs to a group, the
// whole group is selected/deselected together — clicking any member acts on the unit.
function selectObject(id, additive){
  const o = findObjInRoom(id);
  const groupIds = (o && o.groupId) ? Editor.room.objects.filter(x=>x.groupId===o.groupId).map(x=>x.id) : [id];
  if(!additive){
    Editor.selectedIds = new Set(groupIds);
  } else if(groupIds.every(gid=>Editor.selectedIds.has(gid))){
    groupIds.forEach(gid=>Editor.selectedIds.delete(gid)); // shift-click an already-selected item/group to remove it
  } else {
    groupIds.forEach(gid=>Editor.selectedIds.add(gid));
  }
  Editor.selectedId = Editor.selectedIds.has(id) ? id : ([...Editor.selectedIds][0]||null);
  Editor.selectedIsStructure=false;
  if(Editor.selectedIds.size===0){ deselectAll(); return; }
  applySelectionToScene();
  renderPropsPanel();
  updateOverlapHighlight();
  updateFloatingToolbar();
  autoOpenPropsOnMobile();
}
// Attaches the transform gizmo to the current Editor.selectedIds. A single selected
// object gets the gizmo directly; multiple objects get a shared temporary pivot (at
// their centroid) so they move/rotate/scale together as one unit, Figma-group style.
function applySelectionToScene(){
  releasePivotGroup();
  if(!Editor.transformControls) return;
  const ids = [...Editor.selectedIds].filter(id=>Editor.objectMeshes[id]);
  const unlockedIds = ids.filter(id=>{ const o=findObjInRoom(id); return !o || !o.locked; });
  if(unlockedIds.length===0){ Editor.transformControls.detach(); return; }
  if(unlockedIds.length===1){
    Editor.transformControls.attach(Editor.objectMeshes[unlockedIds[0]]);
  } else if(THREE && THREE.Group){
    const pivot = new THREE.Group();
    const center = new THREE.Vector3();
    unlockedIds.forEach(id=> center.add(Editor.objectMeshes[id].position));
    center.divideScalar(unlockedIds.length);
    pivot.position.copy(center);
    Editor.roomGroup.add(pivot);
    unlockedIds.forEach(id=> pivot.attach(Editor.objectMeshes[id])); // attach() preserves world transform across the reparent
    Editor.pivotGroup = pivot;
    Editor.transformControls.attach(pivot);
  }
  Editor.transformControls.setMode(Editor.activeTool==='move'?'translate':Editor.activeTool);
}
// Un-parents any meshes currently grouped under the multi-select pivot (writing their
// resulting world transform back into the persisted room data first) and removes the
// pivot itself. Safe to call even when there's no active pivot.
function releasePivotGroup(){
  if(!Editor.pivotGroup) return;
  const pivot = Editor.pivotGroup;
  [...pivot.children].forEach(mesh=>{
    Editor.roomGroup.attach(mesh);
    writeBackMeshWorldTransform(mesh);
  });
  Editor.roomGroup.remove(pivot);
  Editor.pivotGroup = null;
}
function writeBackMeshWorldTransform(mesh){
  mesh.updateMatrixWorld(true);
  const pos = new THREE.Vector3(), quat = new THREE.Quaternion(), scl = new THREE.Vector3();
  mesh.matrixWorld.decompose(pos, quat, scl);
  const euler = new THREE.Euler().setFromQuaternion(quat, 'XYZ');
  const o = findObjInRoom(mesh.userData.objId);
  if(!o) return;
  o.position = {x:pos.x, y:pos.y, z:pos.z};
  o.rotation = {x:euler.x, y:euler.y, z:euler.z};
  o.scale = {x:scl.x, y:scl.y, z:scl.z};
}
function selectStructure(mesh){
  Editor.selectedIds = new Set();
  Editor.selectedId = mesh.userData.isFloor?'__floor__':('__wall_'+mesh.userData.isWall+'__');
  Editor.selectedIsStructure = true; Editor.structureMesh = mesh;
  releasePivotGroup();
  Editor.transformControls && Editor.transformControls.detach();
  clearOverlapHighlight();
  renderPropsPanel();
  updateFloatingToolbar();
  autoOpenPropsOnMobile();
}
function autoOpenPropsOnMobile(){
  if(window.innerWidth>=980 || !$('#props-panel')) return;
  Editor.rightOpen = true; Editor.leftOpen = false;
  $('#props-panel').classList.remove('collapsed-right');
  $('#sidebar') && $('#sidebar').classList.add('collapsed-left');
}
function deselectAll(){
  releasePivotGroup();
  Editor.selectedId=null; Editor.selectedIsStructure=false;
  Editor.selectedIds = new Set();
  Editor.transformControls && Editor.transformControls.detach();
  clearOverlapHighlight();
  renderPropsPanel();
  updateFloatingToolbar();
}
// Live-updates the numeric fields in the properties panel while the gizmo is being
// dragged, without rebuilding the panel (which would steal focus mid-drag).
function syncPropsFromObject(){
  if(!Editor.selectedId || Editor.selectedIsStructure || Editor.selectedIds.size!==1) return;
  const mesh = Editor.objectMeshes[Editor.selectedId];
  const panel = $('#props-panel');
  if(!mesh || !panel) return;
  const rows = $$('.vec3-row', panel);
  if(rows.length < 3) return;
  const setRow = (row, values)=>{
    const inputs = $$('input', row);
    inputs.forEach((inp,i)=>{ if(document.activeElement!==inp) inp.value = values[i].toFixed(2); });
  };
  setRow(rows[0], [mesh.position.x, mesh.position.y, mesh.position.z]);
  setRow(rows[1], [mesh.rotation.x*180/Math.PI, mesh.rotation.y*180/Math.PI, mesh.rotation.z*180/Math.PI]);
  setRow(rows[2], [mesh.scale.x, mesh.scale.y, mesh.scale.z]);
}
function commitTransform(){
  if(Editor.selectedIsStructure) return;
  if(Editor.pivotGroup){
    pushHistory();
    Editor.pivotGroup.children.forEach(writeBackMeshWorldTransform);
    touchProject();
    updateOverlapHighlight();
    renderPropsPanel();
    return;
  }
  if(!Editor.selectedId) return;
  const mesh = Editor.objectMeshes[Editor.selectedId];
  const o = findObjInRoom(Editor.selectedId);
  if(!o || !mesh) return;
  pushHistory();
  o.position = {x:mesh.position.x,y:mesh.position.y,z:mesh.position.z};
  o.rotation = {x:mesh.rotation.x,y:mesh.rotation.y,z:mesh.rotation.z};
  o.scale = {x:mesh.scale.x,y:mesh.scale.y,z:mesh.scale.z};
  touchProject();
  updateOverlapHighlight();
  renderPropsPanel();
}
function findObjInRoom(id){ return Editor.room ? Editor.room.objects.find(o=>o.id===id) : null; }
/* ---------------------------- FURNITURE OVERLAP DETECTION ---------------------------- */
// Computes an object's floor footprint (center + rotated width/depth) for overlap
// checks. Doors/windows are wall-mounted rather than floor-standing, so they're
// excluded — a door doesn't "overlap" the room the way two chairs would.
// Real-world footprint (w,d,name) for a custom/uploaded asset. A 'parametric' asset
// (AI-matched to a real catalog shape) carries its own AI-estimated dims, so overlap
// detection and the 2D floor plan can use its true size instead of a guessed default —
// a flat 'billboard' cutout still has no real depth, so it keeps the placeholder footprint.
function customAssetFootprint(assetId){
  const asset = Store.data.customAssets[assetId];
  if(asset && asset.kind==='reconstructed3d' && asset.geometry && asset.geometry.dims) return { w:asset.geometry.dims.w, d:asset.geometry.dims.d, name:asset.name };
  if(asset && asset.kind==='parametric' && asset.dims) return { w:asset.dims.w, d:asset.dims.d, name:asset.name };
  return { w:0.6, d:0.6, name: asset?asset.name:'Item' };
}
function getFootprint(o){
  const def = o.category==='custom' ? customAssetFootprint(o.assetId) : findFurnitureDef(o.type);
  if(!def || def.struct) return null;
  return { cx:o.position.x, cz:o.position.z, w:(def.w||0.5)*Math.abs(o.scale.x||1), d:(def.d||0.5)*Math.abs(o.scale.z||1), rot:o.rotation.y||0 };
}
// Separating Axis Theorem overlap test for two rotated rectangles in the XZ (floor)
// plane — needed because furniture can be rotated, so a plain axis-aligned box check
// would be wrong for anything not facing forward.
function rectsOverlap(a,b){
  const corners = (r)=>{
    const hw=r.w/2, hd=r.d/2, cos=Math.cos(r.rot), sin=Math.sin(r.rot);
    return [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(([lx,lz])=>({x:r.cx+lx*cos-lz*sin, z:r.cz+lx*sin+lz*cos}));
  };
  const axesOf = (r)=>{ const cos=Math.cos(r.rot), sin=Math.sin(r.rot); return [{x:cos,z:sin},{x:-sin,z:cos}]; };
  const ca=corners(a), cb=corners(b);
  for(const axis of [...axesOf(a), ...axesOf(b)]){
    const projA = ca.map(p=>p.x*axis.x+p.z*axis.z);
    const projB = cb.map(p=>p.x*axis.x+p.z*axis.z);
    if(Math.max(...projA) < Math.min(...projB) || Math.max(...projB) < Math.min(...projA)) return false; // this axis separates them
  }
  return true;
}
// Furniture whose footprint genuinely overlaps targetO's. Both rectangles are shrunk
// slightly first so pieces that are merely flush/touching (a nightstand pushed right
// up against a bed, chairs around a table) aren't flagged — only real interpenetration is.
function findOverlappingObjects(targetO){
  if(!Editor.room) return [];
  const tfp = getFootprint(targetO); if(!tfp) return [];
  const shrink = (r)=>({...r, w:Math.max(0.02,r.w-0.08), d:Math.max(0.02,r.d-0.08)});
  const stfp = shrink(tfp);
  return Editor.room.objects.filter(o=>{
    if(o.id===targetO.id) return false;
    const fp = getFootprint(o); if(!fp) return false;
    return rectsOverlap(stfp, shrink(fp));
  });
}
// Visual-only feedback (a warm red emissive tint) on the selected object and anything
// it overlaps — live during gizmo drag, not just after committing. This is a warning,
// not a hard block: per-spec, placement should never be prevented outright, just flagged.
function updateOverlapHighlight(){
  clearOverlapHighlight();
  if(!Editor.selectedId || !Editor.room) return;
  const o = findObjInRoom(Editor.selectedId); if(!o) return;
  const overlaps = findOverlappingObjects(o);
  if(overlaps.length===0) return;
  const meshes = [Editor.objectMeshes[o.id], ...overlaps.map(ov=>Editor.objectMeshes[ov.id])].filter(Boolean);
  Editor._overlapMeshes = meshes;
  meshes.forEach(mesh=>{
    mesh.traverse(m=>{
      if(m.isMesh && m.material && m.material.emissive){
        if(m.userData._overlapPrevEmissive===undefined){
          m.userData._overlapPrevEmissive = m.material.emissive.getHex();
          // lamps/fixtures bake a permanent warm glow via emissiveIntensity (~0.3–0.4);
          // without also saving/overriding it, the red warning tint would render at
          // 30–40% strength on those pieces — easy to miss next to a full-strength
          // warning on ordinary furniture. Force full intensity while flagged, restore after.
          m.userData._overlapPrevEmissiveIntensity = m.material.emissiveIntensity;
        }
        m.material.emissive.setHex(0x5c1912);
        m.material.emissiveIntensity = 1;
      }
    });
  });
}
function clearOverlapHighlight(){
  (Editor._overlapMeshes||[]).forEach(mesh=>{
    mesh.traverse(m=>{
      if(m.isMesh && m.material && m.material.emissive && m.userData._overlapPrevEmissive!==undefined){
        m.material.emissive.setHex(m.userData._overlapPrevEmissive);
        if(m.userData._overlapPrevEmissiveIntensity!==undefined) m.material.emissiveIntensity = m.userData._overlapPrevEmissiveIntensity;
        delete m.userData._overlapPrevEmissive;
        delete m.userData._overlapPrevEmissiveIntensity;
      }
    });
  });
  Editor._overlapMeshes = [];
}
function onEditorKeydown(e){
  if(App.view!=='editor' || Editor.walkthrough) return;
  const t = e.target;
  const tag = (t.tagName||'').toLowerCase();
  if(tag==='input' || tag==='textarea' || t.isContentEditable) return;
  // Furniture cards, color swatches, and room-list rows are keyboard-focusable
  // (tabindex + role) for accessibility — without this check, tabbing to one and
  // pressing Backspace/Delete would unexpectedly delete whatever 3D object happens
  // to be selected, and 1/2/3 would swap tools while someone's just browsing the
  // furniture library. Enter/Space on these is already handled by makeActivatable()
  // itself, so shortcuts below are safe to skip here.
  if(t.getAttribute && (t.getAttribute('role')==='button' || t.getAttribute('role')==='radio')) return;
  if(e.ctrlKey||e.metaKey){
    if(e.key.toLowerCase()==='z' && !e.shiftKey){ e.preventDefault(); doUndo(); return; }
    if(e.key.toLowerCase()==='y' || (e.key.toLowerCase()==='z' && e.shiftKey)){ e.preventDefault(); doRedo(); return; } // Ctrl+Y (Windows) and Ctrl/Cmd+Shift+Z (Mac) both trigger redo
    if(e.key.toLowerCase()==='d'){ e.preventDefault(); duplicateSelected(); return; }
    if(e.key.toLowerCase()==='c'){ e.preventDefault(); copySelected(); return; }
    if(e.key.toLowerCase()==='v'){ e.preventDefault(); pasteClipboard(); return; }
    if(e.key.toLowerCase()==='g' && !Editor.selectedIsStructure){ e.preventDefault(); if(e.shiftKey) ungroupSelected(); else groupSelected(); return; }
    if(e.key.toLowerCase()==='a' && App.view==='editor'){ e.preventDefault(); selectAllFurniture(); return; }
  }
  if(e.key==='1') setActiveTool('move');
  if(e.key==='2') setActiveTool('rotate');
  if(e.key==='3') setActiveTool('scale');
  if((e.key==='Delete'||e.key==='Backspace') && Editor.selectedIds.size && !Editor.selectedIsStructure) deleteSelected();
  if(e.key.toLowerCase()==='l' && Editor.selectedIds.size && !Editor.selectedIsStructure) toggleLockSelected();
  if(e.key.toLowerCase()==='h' && Editor.selectedIds.size && !Editor.selectedIsStructure) toggleHideSelected();
  if(e.key==='Escape'){ if(Editor.walkthrough) exitWalkthrough(); else deselectAll(); }
  // Arrow-key nudge for the active ROOM's position — only in the 2D plan, and only when
  // no furniture is selected (furniture has no arrow-key move of its own today, so this
  // never steals a shortcut from it; if that ever changes, a selected object should win).
  // Shift moves in bigger steps for fast repositioning; plain arrows are fine-adjustment.
  // Snapping still applies, same as a mouse drag, so nudging into place beside another
  // room clicks into alignment just like dragging does.
  if(Editor.viewMode==='2d' && Editor.room && Editor.selectedIds.size===0 &&
     ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){
    e.preventDefault();
    const step = e.shiftKey ? 0.5 : 0.05;
    const room = Editor.room;
    let nx = room.worldX||0, nz = room.worldZ||0;
    if(e.key==='ArrowLeft') nx -= step; if(e.key==='ArrowRight') nx += step;
    if(e.key==='ArrowUp') nz -= step; if(e.key==='ArrowDown') nz += step;
    const snapped = plan2dSnapRoomPosition(room, nx, nz);
    room.worldX = snapped.x; room.worldZ = snapped.z;
    buildRoomScene(); touchProject(); // debounced — arrow repeat shouldn't hammer localStorage
  }
}
function selectAllFurniture(){
  if(!Editor.room) return;
  const ids = Editor.room.objects.filter(o=>!o.locked).map(o=>o.id);
  if(!ids.length) return;
  Editor.selectedIds = new Set(ids);
  Editor.selectedId = ids[ids.length-1];
  applySelectionToScene(); renderPropsPanel(); updateOverlapHighlight(); updateFloatingToolbar();
}
function selectedObjects(){
  if(Editor.selectedIsStructure) return [];
  return [...Editor.selectedIds].map(findObjInRoom).filter(Boolean).filter(o=>!o.locked);
}
function duplicateSelected(){
  const objs = selectedObjects(); if(!objs.length) return;
  pushHistory();
  // preserve relative offsets & group membership across the whole set, not just one item
  const newGroupIds = {};
  const clones = objs.map(o=>{
    const clone = JSON.parse(JSON.stringify(o));
    clone.id = uid('obj'); clone.position = {x:o.position.x+0.3, y:o.position.y, z:o.position.z+0.3};
    if(clone.groupId){ if(!newGroupIds[clone.groupId]) newGroupIds[clone.groupId]=uid('grp'); clone.groupId = newGroupIds[clone.groupId]; }
    if(clone.wall) resnapStructuresToWalls({...Editor.room, objects:[clone]}); // keep duplicated doors/windows flush against their wall instead of floating off it
    return clone;
  });
  clones.forEach(clone=>{ Editor.room.objects.push(clone); instantiateObject(clone); });
  Editor.selectedIds = new Set(clones.map(c=>c.id));
  Editor.selectedId = clones[clones.length-1].id;
  applySelectionToScene(); renderPropsPanel(); updateOverlapHighlight(); updateFloatingToolbar();
  touchProject(); updateEmptyHint(); toast(clones.length>1 ? clones.length+' items duplicated' : 'Duplicated');
}
function deleteSelected(){
  const objs = selectedObjects(); if(!objs.length) return;
  pushHistory();
  const ids = new Set(objs.map(o=>o.id));
  Editor.room.objects = Editor.room.objects.filter(o=>!ids.has(o.id));
  ids.forEach(id=>{
    const mesh = Editor.objectMeshes[id];
    if(mesh){ Editor.roomGroup.remove(mesh); disposeObject3D(mesh); delete Editor.objectMeshes[id]; }
  });
  deselectAll(); touchProject(); updateEmptyHint();
}
function copySelected(){
  const objs = selectedObjects(); if(!objs.length){ return; }
  Editor.clipboard = objs.map(o=>JSON.parse(JSON.stringify(o)));
  toast(objs.length>1 ? objs.length+' items copied' : 'Copied');
}
function pasteClipboard(){
  if(!Editor.room || !Editor.clipboard.length) return;
  pushHistory();
  const newGroupIds = {};
  const clones = Editor.clipboard.map(o=>{
    const clone = JSON.parse(JSON.stringify(o));
    clone.id = uid('obj'); clone.position = {x:o.position.x+0.3, y:o.position.y, z:o.position.z+0.3};
    if(clone.groupId){ if(!newGroupIds[clone.groupId]) newGroupIds[clone.groupId]=uid('grp'); clone.groupId = newGroupIds[clone.groupId]; }
    delete clone.locked;
    if(clone.wall) resnapStructuresToWalls({...Editor.room, objects:[clone]});
    return clone;
  });
  clones.forEach(clone=>{ Editor.room.objects.push(clone); instantiateObject(clone); });
  Editor.selectedIds = new Set(clones.map(c=>c.id));
  Editor.selectedId = clones[clones.length-1].id;
  applySelectionToScene(); renderPropsPanel(); updateOverlapHighlight(); updateFloatingToolbar();
  touchProject(); updateEmptyHint(); toast(clones.length>1 ? clones.length+' items pasted' : 'Pasted');
}

/* ---------------------------- ADD FURNITURE (click / drag-drop) ---------------------------- */
function addFurnitureToRoom(typeId, worldPos){
  if(!Editor.room){ toast('Create a room first','error'); return; }
  if(!requireThree('Adding furniture')) return;
  const def = findFurnitureDef(typeId); if(!def) return;
  pushHistory();
  const pos = worldPos || {x:0,y:0,z:0};
  const o = { id:uid('obj'), type:typeId, category:'furniture', position:{x:pos.x,y:0,z:pos.z}, rotation:{x:0,y:0,z:0}, scale:{x:1,y:1,z:1}, color:def.color };
  if(def.struct){ snapStructureToWall(o, def, pos); }
  Editor.room.objects.push(o);
  const mesh = instantiateObject(o);
  selectObject(o.id);
  touchProject(); updateEmptyHint();
  toast(def.name+' added'); markOnboarding('furniture');
}
// Snaps a door/window to whichever of the 4 walls is nearest to the drop point
// (or nearest to the room center if it was added without a drop position, e.g. by
// clicking the library card). Also records which wall it's on (o.wall) so
// resnapStructuresToWalls() can keep it attached correctly if the room is resized.
function snapStructureToWall(o, def, worldPos){
  const room = Editor.room;
  const W = room.width, D = room.length;
  const pos = worldPos || {x:0, z:0};
  const halfW = Math.max(def.w, 0.2)/2;
  const candidates = [
    { wall:'back',  dist: (D/2) + pos.z, x: clamp(pos.x, -W/2+halfW, W/2-halfW), z: -D/2+0.01, rotY: 0 },
    { wall:'front', dist: (D/2) - pos.z, x: clamp(pos.x, -W/2+halfW, W/2-halfW), z:  D/2-0.01, rotY: Math.PI },
    { wall:'left',  dist: (W/2) + pos.x, x: -W/2+0.01, z: clamp(pos.z, -D/2+halfW, D/2-halfW), rotY: Math.PI/2 },
    { wall:'right', dist: (W/2) - pos.x, x:  W/2-0.01, z: clamp(pos.z, -D/2+halfW, D/2-halfW), rotY: -Math.PI/2 },
  ];
  const nearest = candidates.reduce((a,b)=> b.dist<a.dist ? b : a);
  const isWindow = def.name.toLowerCase().includes('window');
  o.position = {x:nearest.x, y: isWindow ? room.height*0.35 : 0, z:nearest.z};
  o.rotation = {x:0, y:nearest.rotY, z:0};
  o.wall = nearest.wall; // remembered for resnapStructuresToWalls() on room resize
}
// Called when room dimensions change. Doors/windows are anchored to a specific wall
// (o.wall) rather than an absolute coordinate, so a resize would otherwise leave them
// floating away from the wall or poking through it. This keeps them flush and within
// the (possibly now-shorter) wall's bounds.
function resnapStructuresToWalls(room){
  room.objects.forEach(o=>{
    if(!o.wall) return;
    const def = findFurnitureDef(o.type); if(!def || !def.struct) return;
    const W = room.width, D = room.length;
    const halfW = Math.max(def.w, 0.2)/2;
    const isWindow = def.name.toLowerCase().includes('window');
    if(o.wall==='back'){ o.position.x = clamp(o.position.x, -W/2+halfW, W/2-halfW); o.position.z = -D/2+0.01; }
    else if(o.wall==='front'){ o.position.x = clamp(o.position.x, -W/2+halfW, W/2-halfW); o.position.z = D/2-0.01; }
    else if(o.wall==='left'){ o.position.z = clamp(o.position.z, -D/2+halfW, D/2-halfW); o.position.x = -W/2+0.01; }
    else if(o.wall==='right'){ o.position.z = clamp(o.position.z, -D/2+halfW, D/2-halfW); o.position.x = W/2-0.01; }
    o.position.y = isWindow ? room.height*0.35 : 0;
  });
}
// Shared by the native 'drop' event AND the pointer-based asset drag below — raycasts a
// screen point onto the room's floor plane (y=0) and returns it in the active room's
// LOCAL space (clamped inside the walls), or null if there's no 3D scene / room to drop
// into yet. Returns null rather than throwing so callers can bail out (e.g. toast) cleanly.
function computeDropPointFrom3D(clientX, clientY){
  const holder = $('#three-canvas-holder'); if(!holder || !Editor.camera || !Editor.raycaster) return null;
  const rect = holder.getBoundingClientRect();
  if(clientX<rect.left || clientX>rect.right || clientY<rect.top || clientY>rect.bottom) return null;
  Editor.mouse.x = ((clientX-rect.left)/rect.width)*2-1;
  Editor.mouse.y = -((clientY-rect.top)/rect.height)*2+1;
  Editor.raycaster.setFromCamera(Editor.mouse, Editor.camera);
  const plane = new THREE.Plane(new THREE.Vector3(0,1,0),0);
  const pt = new THREE.Vector3();
  Editor.raycaster.ray.intersectPlane(plane, pt);
  if(!pt) pt.set(0,0,0);
  if(Editor.room){
    // pt is in WORLD space (three.js raycast against the y=0 plane); convert to the
    // active room's LOCAL space by subtracting its world offset before clamping —
    // room objects are stored/rendered in local coordinates (see instantiateObject()),
    // so addFurnitureToRoom() below needs a local point, not a world one. Without this,
    // dropping furniture on any room that isn't sitting at world origin would compute
    // the clamp against the wrong box and place the object at the wrong spot (or
    // outside the room entirely) once world offsets are involved.
    const ox = Editor.room.worldX||0, oz = Editor.room.worldZ||0;
    pt.x = clamp(pt.x-ox, -Editor.room.width/2+0.2, Editor.room.width/2-0.2);
    pt.z = clamp(pt.z-oz, -Editor.room.length/2+0.2, Editor.room.length/2-0.2);
  }
  return {x:pt.x, y:0, z:pt.z};
}
function onCanvasDrop(e){
  e.preventDefault();
  const typeId = e.dataTransfer.getData('text/furniture-id');
  const assetId = e.dataTransfer.getData('text/custom-asset-id');
  if(!typeId && !assetId) return;
  const pt = computeDropPointFrom3D(e.clientX, e.clientY) || {x:0,y:0,z:0};
  if(typeId) addFurnitureToRoom(typeId, pt);
  else if(assetId) addCustomAssetToRoom(assetId, pt);
}

/* ---------------------------- 3D ROOM DRAG (reposition whole rooms in the 3D viewport) ----------------------------
   Mirrors the 2D Plan's room-dragging (dragRoomId + plan2dSnapRoomPosition, both reused
   below as-is — the snapping math is already in world units and doesn't care which view
   it's called from) so a room can be picked up and moved directly in the 3D View, not
   just from the 2D Plan. Furniture keeps first refusal: if the pointer actually lands on
   a piece of furniture, this bails out immediately and leaves the existing click/
   TransformControls selection flow completely untouched. Only empty room "shell" (floor/
   walls/outline) starts a room drag. */
// Raycasts every room group and returns the first non-furniture hit (walking up each
// candidate's ancestors to make sure it isn't part of a furniture instance, then further
// up to find which top-level 'roomgroup_<id>' group it belongs to).
function hitTestRoomGroupAt(clientX, clientY){
  const holder = $('#three-canvas-holder'); if(!holder||!Editor.camera||!Editor.raycaster||!Editor.scene) return null;
  const rect = holder.getBoundingClientRect();
  Editor.mouse.x = ((clientX-rect.left)/rect.width)*2-1;
  Editor.mouse.y = -((clientY-rect.top)/rect.height)*2+1;
  Editor.raycaster.setFromCamera(Editor.mouse, Editor.camera);
  const groups = Object.values(Editor.roomGroups||{});
  const hits = Editor.raycaster.intersectObjects(groups, true);
  for(const h of hits){
    let cur = h.object, isFurniture=false;
    while(cur){ if(cur.userData && cur.userData.objId){ isFurniture=true; break; } cur=cur.parent; }
    if(isFurniture) continue;
    let rg = h.object;
    while(rg && !(rg.name && rg.name.indexOf('roomgroup_')===0)) rg = rg.parent;
    if(rg) return { roomId: rg.name.slice('roomgroup_'.length), point: h.point };
  }
  return null;
}
// Raycasts a screen point onto a fixed world Y plane — used to track the pointer's world
// X/Z through a drag once we know which floor level (room.floor's base Y) it started on.
function raycastAtPlaneY(clientX, clientY, planeY){
  const holder = $('#three-canvas-holder'); if(!holder||!Editor.camera||!Editor.raycaster) return null;
  const rect = holder.getBoundingClientRect();
  Editor.mouse.x = ((clientX-rect.left)/rect.width)*2-1;
  Editor.mouse.y = -((clientY-rect.top)/rect.height)*2+1;
  Editor.raycaster.setFromCamera(Editor.mouse, Editor.camera);
  const plane = new THREE.Plane(new THREE.Vector3(0,1,0), -(planeY||0));
  const pt = new THREE.Vector3();
  return Editor.raycaster.ray.intersectPlane(plane, pt) ? {x:pt.x, z:pt.z} : null;
}
function on3DRoomPointerDown(e){
  if(Editor.viewMode!=='3d' || Editor.walkthrough || Editor.measureMode) return;
  if(e.pointerType==='mouse' && e.button!==0) return;
  if(!Editor.camera || !Editor.raycaster || !Editor.project) return;
  // furniture takes priority — if the pointer actually landed on a piece of furniture in
  // the active room, leave it entirely to the existing click/TransformControls flow
  const rect = $('#three-canvas-holder').getBoundingClientRect();
  Editor.mouse.x = ((e.clientX-rect.left)/rect.width)*2-1;
  Editor.mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
  Editor.raycaster.setFromCamera(Editor.mouse, Editor.camera);
  const activeTargets = Object.values(Editor.objectMeshes||{}).filter(m=>m.visible);
  if(Editor.raycaster.intersectObjects(activeTargets, true).length) return;
  const hit = hitTestRoomGroupAt(e.clientX, e.clientY); if(!hit) return;
  const room = Editor.project.rooms[hit.roomId]; if(!room) return;
  Editor.renderer.domElement.setPointerCapture(e.pointerId);
  Editor.controls.enabled = false; // don't orbit the camera while dragging a room
  Editor.roomDrag3D = {
    roomId: hit.roomId, moved:false, planeY: hit.point.y,
    startWorldX: room.worldX||0, startWorldZ: room.worldZ||0,
    startPointerX: hit.point.x, startPointerZ: hit.point.z
  };
}
function on3DRoomPointerMove(e){
  const drag = Editor.roomDrag3D; if(!drag) return;
  const pt = raycastAtPlaneY(e.clientX, e.clientY, drag.planeY); if(!pt) return;
  const dx = pt.x-drag.startPointerX, dz = pt.z-drag.startPointerZ;
  if(Math.abs(dx)>0.05||Math.abs(dz)>0.05) drag.moved = true;
  if(!drag.moved) return;
  const room = Editor.project.rooms[drag.roomId]; if(!room) return;
  const snapped = plan2dSnapRoomPosition(room, drag.startWorldX+dx, drag.startWorldZ+dz);
  room.worldX = snapped.x; room.worldZ = snapped.z;
  const grp = Editor.roomGroups[drag.roomId];
  if(grp) grp.position.set(room.worldX, grp.position.y, room.worldZ); // cheap live feedback — full rebuild happens once on pointerup
}
function on3DRoomPointerUp(e){
  const drag = Editor.roomDrag3D; if(!drag) return;
  if(Editor.renderer.domElement.hasPointerCapture(e.pointerId)) Editor.renderer.domElement.releasePointerCapture(e.pointerId);
  Editor.controls.enabled = true;
  Editor.roomDrag3D = null;
  if(drag.moved){
    buildRoomScene(); touchProjectNow(); // rebuild once now that it's settled — refreshes highlight/outline, floor selector, dimension lines, etc.
    Editor._suppressClick = true; setTimeout(()=>{ Editor._suppressClick=false; }, 80); // the plain 'click' that follows this drag's pointerup shouldn't also re-fire selection logic
  }
}

function setCameraMode(mode, btn){
  Editor.camMode = mode;
  $$('.view-cube-row button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  if(!Editor.room || !Editor.threeAvailable) return;
  const W=Editor.room.width, D=Editor.room.length, H=Editor.room.height;
  const ox=Editor.room.worldX||0, oz=Editor.room.worldZ||0;
  if(mode==='top'){ Editor.camera.position.set(ox, Math.max(W,D)*1.3, oz+0.001); Editor.controls.target.set(ox,0,oz); }
  else if(mode==='front'){ Editor.camera.position.set(ox, H*0.55, oz+Math.max(W,D)*1.3); Editor.controls.target.set(ox,H*0.4,oz); }
  else { const dist=Math.max(W,D)*1.15+2; Editor.camera.position.set(ox+dist*0.6, Math.max(H*1.8,3), oz+dist*0.75); Editor.controls.target.set(ox,H*0.35,oz); }
  Editor.controls.update();
}

// `beforeChange` (typically pushHistory) MUST run before `obj[axis]` is mutated —
// obj is often a direct reference into the live room data (e.g. o.position), so
// mutating first and snapshotting after would capture the *new* value into history,
// making undo a no-op. This ordering is the fix for that bug.
function vec3Row(label, obj, onchange, step, beforeChange){
  const row = el('div',{class:'vec3-row'});
  ['x','y','z'].forEach(axis=>{
    const input = el('input',{type:'number', step:step||0.01, value:(+obj[axis]).toFixed(2)});
    input.addEventListener('change',()=>{
      if(beforeChange) beforeChange();
      obj[axis]=parseFloat(input.value)||0;
      onchange();
    });
    row.appendChild(el('div',{class:'vec3-field'}, el('label',null,axis.toUpperCase()), input));
  });
  return el('div',null, el('div',{style:'font-size:11px;color:var(--text-faint);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px'},label), row);
}

// `onCommit` (typically pushHistory) fires exactly once at the start of a drag
// gesture, not on every 'input' tick (which would flood history with hundreds of
// entries per drag) and not after the value has already changed (the same bug class

// continues to mutate without pushing another snapshot; 'change' (fires once, on
// release) resets the flag so the *next* drag gets its own history entry.
function sliderRow(label,val,min,max,step,onchange,onCommit){
  const row = el('div',{class:'slider-row'});
  const lab = el('div',{class:'sr-label'}, el('span',null,label), el('span',{id:'sr-val-'+label.replace(/\s+/g,'')}, val.toFixed(2)));
  const input = el('input',{type:'range', min, max, step, value:val});
  let committed = false;
  input.addEventListener('input',()=>{
    if(!committed && onCommit){ onCommit(); committed=true; }
    lab.lastChild.textContent = (+input.value).toFixed(2); onchange(parseFloat(input.value));
  });
  input.addEventListener('change',()=>{ committed=false; });
  row.appendChild(lab); row.appendChild(input);
  return row;
}
// Directly sets `rid`'s floor to `newFloor` — the direct-assignment counterpart to
// placeRoomOnFloorRelative() (which needs a reference room to stack against). Used by
// the Floor selector in Room Settings, which is reachable from both 3D and 2D Plan
// view (unlike the 2D-plan-only floating toolbar's Place Above/Below buttons), so
// there's always a visible, working way to move a room between floors.
function setRoomFloor(rid, newFloor){
  const room = Editor.project.rooms[rid]; if(!room) return;
  const oldFloor = Number.isFinite(room.floor) ? room.floor : 0;
  if(newFloor===oldFloor) return;
  pushHistory();
  const collides = room.worldX!=null && Object.values(Editor.project.rooms).some(r=>
    r!==room && r.worldX!=null && roomsOverlapSameFloor({worldX:room.worldX, worldZ:room.worldZ, width:room.width, length:room.length, floor:newFloor}, r));
  room.floor = newFloor;
  if(collides){ room.worldX = null; room.worldZ = null; } // that exact spot is already taken on the destination floor — auto-flow finds it a free one instead of overlapping
  assignRoomLayoutPositions(Editor.project.rooms, Editor.project.roomOrder);
  Editor.plan2d.planFloor = newFloor; // jump the 2D view to the floor the room just moved to, so the result is immediately visible
  buildRoomScene(); refreshSidebarRoomsTab(); updateFloorSelectorUI(); renderPropsPanel(); touchProjectNow();
  if(Editor.viewMode==='2d') draw2DPlan();
  toast(room.name+' moved to '+floorLabel(newFloor));
}
// Every floor number currently in use across the project, plus a small buffer of
// nearby floors so there's always somewhere new to move a room to (one up, one down)
// even in a brand-new single-floor project — used to populate the Floor <select> in
// Room Settings.
function availableFloorOptions(){
  const floors = new Set([0,1,-1]);
  (Editor.project && Editor.project.roomOrder||[]).forEach(rid=>{
    const r = Editor.project.rooms[rid]; if(!r) return;
    const f = Number.isFinite(r.floor)?r.floor:0;
    floors.add(f); floors.add(f+1); floors.add(f-1);
  });
  return Array.from(floors).sort((a,b)=>b-a);
}

/* ---------------------------- LIGHTING ---------------------------- */
function applyLightingToScene(){
  if(!Editor.scene) return;
  if(Editor.lightsGroup){ Editor.scene.remove(Editor.lightsGroup); }
  Editor.lightsGroup = new THREE.Group(); Editor.scene.add(Editor.lightsGroup);
  const room = Editor.room;
  const light = room ? room.lighting : {ambientIntensity:0.55,dirIntensity:0.85,mode:'day',pointLightsOn:true};
  // Each mode now drives a small 3-point rig (key / fill / rim) plus sky-ground
  // bounce and atmospheric fog, instead of a single flat directional light —
  // this is what gives the render actual depth and a "photographed" feel.
  const modeCfg = {
    day:{ bg:0xdfe4e8, ambColor:0xfff8ee, dirColor:0xfff4e0, dirPos:[6,10,4],
          fillColor:0xcfe0ff, fillPos:[-6,4,-3], rimColor:0xffffff, rimPos:[-3,6.5,-8],
          groundColor:0xb9ada0, exposure:1.15, fogNear:22, fogFar:54 },
    evening:{ bg:0x2b2436, ambColor:0xffd7c2, dirColor:0xffb37a, dirPos:[-4,6,3],
          fillColor:0x5a4a7a, fillPos:[5,3,-4], rimColor:0xffb37a, rimPos:[4,5.5,-6],
          groundColor:0x3a2f45, exposure:0.95, fogNear:16, fogFar:44 },
    night:{ bg:0x0c0d12, ambColor:0x33415c, dirColor:0x6f86c9, dirPos:[3,8,-4],
          fillColor:0x141a2c, fillPos:[-4,3,4], rimColor:0x6f86c9, rimPos:[-4,4.5,-6],
          groundColor:0x08090f, exposure:0.72, fogNear:12, fogFar:36 },
  }[light.mode||'day'];
  Editor.scene.background = new THREE.Color(modeCfg.bg);
  // fog far distance is stretched to cover the whole multi-room layout (plus the
  // mode's usual margin), so rooms placed away from the origin don't fade into fog
  // that was only ever sized for a single room. In single-room contexts (the client/
  // presentation view, or before any room has been built yet) there's no populated
  // Editor.roomGroups map to derive a real multi-room layout from, so this falls back
  // to the single active room centered at the origin — exactly matching how that view
  // actually builds its geometry, so the light rig stays centered on real geometry.
  const bounds = (Editor.project && Object.keys(Editor.roomGroups||{}).length)
    ? computeLayoutBounds(Editor.project)
    : (room ? {width:room.width, depth:room.length, cx:0, cz:0} : {width:4, depth:4, cx:0, cz:0});
  const layoutSpan = Math.max(bounds.width, bounds.depth);
  Editor.scene.fog = new THREE.Fog(modeCfg.bg, modeCfg.fogNear, Math.max(modeCfg.fogFar, layoutSpan*1.8+modeCfg.fogFar*0.5));

  // The key/fill/rim rig is centered on the multi-room layout's bounding box (not a
  // fixed origin), so every room gets reasonable light+shadow coverage regardless of
  // where it sits in the shared world space.
  const cx = bounds.cx, cz = bounds.cz;

  // KEY light — the primary sun/lamp; the only light that casts shadows
  const dir = new THREE.DirectionalLight(modeCfg.dirColor, light.dirIntensity);
  dir.position.set(cx+modeCfg.dirPos[0], modeCfg.dirPos[1], cz+modeCfg.dirPos[2]); dir.castShadow=true;
  dir.target.position.set(cx,0,cz); Editor.lightsGroup.add(dir.target);
  dir.shadow.mapSize.set(2048,2048);
  // shadow frustum is sized to cover the full layout bounding box (plus a margin),
  // never smaller than the original single-room ±9 box
  const halfW = Math.max(9, bounds.width/2+4), halfD = Math.max(9, bounds.depth/2+4);
  dir.shadow.camera.left=-halfW; dir.shadow.camera.right=halfW; dir.shadow.camera.top=halfD; dir.shadow.camera.bottom=-halfD;
  dir.shadow.camera.near=0.5; dir.shadow.camera.far=Math.max(30, layoutSpan+20);
  dir.shadow.bias=-0.00035; dir.shadow.normalBias=0.02; dir.shadow.radius=3.2; // softer, artifact-free shadow edges
  dir.shadow.camera.updateProjectionMatrix();
  Editor.lightsGroup.add(dir);

  // soft ambient — lifted shadows read as dark-grey, not crushed black
  const amb = new THREE.AmbientLight(modeCfg.ambColor, light.ambientIntensity*0.55);
  Editor.lightsGroup.add(amb);

  // sky/ground bounce — approximates light reflecting off ceiling and floor
  const hemi = new THREE.HemisphereLight(modeCfg.bg, modeCfg.groundColor, 0.45);
  Editor.lightsGroup.add(hemi);

  // FILL light — low, cool/complementary, opposite the key; softens the shadow side
  const fill = new THREE.DirectionalLight(modeCfg.fillColor, light.dirIntensity*0.28);
  fill.position.set(cx+modeCfg.fillPos[0], modeCfg.fillPos[1], cz+modeCfg.fillPos[2]);
  fill.target.position.set(cx,0,cz); Editor.lightsGroup.add(fill.target);
  Editor.lightsGroup.add(fill);

  // RIM light — grazing light from behind/above that separates furniture edges
  // from the back wall, the classic interior-photography trick for depth
  const rim = new THREE.DirectionalLight(modeCfg.rimColor, light.dirIntensity*0.22);
  rim.position.set(cx+modeCfg.rimPos[0], modeCfg.rimPos[1], cz+modeCfg.rimPos[2]);
  rim.target.position.set(cx,0,cz); Editor.lightsGroup.add(rim.target);
  Editor.lightsGroup.add(rim);

  if(Editor.renderer) Editor.renderer.toneMappingExposure = modeCfg.exposure;

  // toggle point lights that live inside furniture groups (lamps etc.) — in the
  // multi-room editor, every room toggles by its OWN lighting.pointLightsOn setting
  // (not just the active room's); the client/presentation view has only the single
  // active room's meshes in Editor.roomGroup, so it falls back to that.
  if(Editor.project && Object.keys(Editor.roomGroups||{}).length){
    Editor.project.roomOrder.forEach(rid=>{
      const r = Editor.project.rooms[rid]; const grp = Editor.roomGroups[rid];
      if(!r || !grp) return;
      const onFlag = r.lighting ? r.lighting.pointLightsOn!==false : true;
      grp.traverse(o=>{ if(o.isPointLight) o.visible = onFlag; });
    });
  } else if(Editor.roomGroup){
    Editor.roomGroup.traverse(o=>{ if(o.isPointLight) o.visible = light.pointLightsOn!==false; });
  }
}

/* ---------------------------- STYLE PRESETS ---------------------------- */
function applyStyle(styleKey){
  const preset = STYLE_PRESETS[styleKey]; if(!preset || !Editor.room) return;
  pushHistory();
  Editor.project.style = styleKey;
  Editor.room.wallColor = preset.wall; Editor.room.floorColor = preset.floor;
  let addedFurniture = false;
  if(Editor.room.objects.filter(o=>o.category!=='custom').length===0){
    // room is empty of built-in furniture — place the style's recommended starter pieces
    const cols = Math.ceil(Math.sqrt(preset.furniture.length));
    const spanX = Editor.room.width*0.6, spanZ = Editor.room.length*0.6;
    preset.furniture.forEach((typeId,i)=>{
      const def = findFurnitureDef(typeId); if(!def) return;
      const row = Math.floor(i/cols), col = i%cols;
      const x = -spanX/2 + (col+0.5)*(spanX/cols);
      const z = -spanZ/2 + (row+0.5)*(spanZ/Math.ceil(preset.furniture.length/cols));
      Editor.room.objects.push({ id:uid('obj'), type:typeId, category:'furniture', position:{x,y:0,z}, rotation:{x:0,y:0,z:0}, scale:{x:1,y:1,z:1}, color:def.color });
    });
    addedFurniture = true;
  }
  buildRoomScene();
  touchProject();
  markOnboarding('customize');
  const furnitureNote = addedFurniture
    ? ' Added starter furniture: '+preset.furniture.map(t=>(findFurnitureDef(t)||{}).name||t).join(', ')+'.'
    : ' Recommended pieces for this style: '+preset.furniture.map(t=>(findFurnitureDef(t)||{}).name||t).join(', ')+'.';
  toast('Applied "'+styleKey+'" style — '+preset.desc+'.'+furnitureNote, 'success', 5000);
  updateEmptyHint();
}

     ['center','Center in Floor Plan'],
     ['alignSelected','Align with Selected Room'],
     ['placeAboveFloor','Place Above Selected Room (new floor)'],
     ['placeBelowFloor','Place Below Selected Room (new floor)']].forEach(([v,label])=>{
      placeSel.appendChild(el('option',{value:v},label));
    });
    const needsRef = v=> v==='snapNearby'||v==='alignSelected'||v==='placeAboveFloor'||v==='placeBelowFloor';
    placeSel.addEventListener('change',()=>{ placeMode = placeSel.value; refRow.style.display = needsRef(placeMode) ? '' : 'none'; });
    const refSel = el('select');
    existingIds.forEach(rid=>{ const r=Editor.project.rooms[rid]; refSel.appendChild(el('option',{value:rid, selected:rid===Editor.roomId}, r.name)); });
    const refRow = el('div',{class:'field', style:'display:none;margin-top:8px'}, el('label',null,'Relative to'), refSel);
    panel.appendChild(el('div',{class:'field'}, el('label',null,'Placement'), placeSel));
    panel.appendChild(refRow);
    toggleRow.appendChild(toggleBtn); toggleRow.appendChild(panel);
    body.appendChild(toggleRow);
    // stash for the Create handler below (closures over let-bound placeMode/refSel)
    body._placeSel = placeSel; body._refSel = refSel;
  }
  modal.appendChild(body);
  modal.appendChild(el('div',{class:'modal-foot'},
    el('button',{class:'btn',onclick:()=>scrim.remove()},'Cancel'),
    el('button',{class:'btn primary',onclick:()=>{
      // New rooms default to whichever floor the 2D plan is currently showing (falling
      // back to Ground Floor for the "All Floors" view), so the room you just created
      // shows up right where you're looking instead of silently landing elsewhere.
      const defaultFloor = (Editor.plan2d && Number.isFinite(Editor.plan2d.planFloor)) ? Editor.plan2d.planFloor : 0;
      const room = {
        id:uid('room'), name:nameField.value.trim()||'Room', type:typeSel.value,
        width:toMeters(parseFloat(wIn.value)||16,unit), length:toMeters(parseFloat(lIn.value)||20,unit), height:toMeters(parseFloat(hIn.value)||10,unit),

      // Capture the pre-existing layout's bounds BEFORE this room is added — "Center in

      const priorBounds = Editor.project ? computeLayoutBounds(Editor.project) : null;

      else if(placeMode==='placeBelowFloor' && ref){ placeRoomOnFloorRelative(room, ref, -1); }

      // anything it didn't resolve (e.g. a collision placeRoomRelative backed off from).
      assignRoomLayoutPositions(Editor.project.rooms, Editor.project.roomOrder);
      Editor.project.activeRoomId = room.id; Editor.roomId=room.id; Editor.room=room;
      Editor.history=[]; Editor.future=[];
      Editor.plan2d.zoom=1; Editor.plan2d.panX=0; Editor.plan2d.panY=0;
      Editor.plan2d.planFloor = room.floor; // jump the 2D plan to show the floor this room actually landed on
